<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="docs/css/style.css">
    <link rel="stylesheet" href="docs/css/covers.css">
    <style>
        body { background: #111; color: white; padding: 20px; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .box { border: 1px solid #333; padding: 10px; text-align: center; }
        .cover-preview { width: 100%; aspect-ratio: 3/4; overflow: hidden; position: relative; }
    </style>
</head>
<body>
    <h1>Album Cover Styles Verification</h1>
    <div class="grid">
        <div class="box">
            <h3>Standard (Vault)</h3>
            <div class="cover-preview">
                <div class="textured-cover style-standard"><h2>TÍTULO</h2><span class="style-subtitle">VAULT COLLECTION</span></div>
            </div>
        </div>
        <div class="box">
            <h3>Cosmic</h3>
            <div class="cover-preview">
                <div class="textured-cover style-cosmic"><h2>TÍTULO</h2><span class="style-subtitle">SPACE VAULT</span></div>
            </div>
        </div>
        <div class="box">
            <h3>Holographic</h3>
            <div class="cover-preview">
                <div class="textured-cover style-holographic"><h2>TÍTULO</h2><span class="style-subtitle">SPECTRUM</span></div>
            </div>
        </div>
        <div class="box">
            <h3>Luxury</h3>
            <div class="cover-preview">
                <div class="textured-cover style-luxury"><h2>TÍTULO</h2><span class="style-subtitle">PREMIUM</span></div>
            </div>
        </div>
        <div class="box">
            <h3>Marble</h3>
            <div class="cover-preview">
                <div class="textured-cover style-marble"><h2>TÍTULO</h2><span class="style-subtitle">ELEGANCE</span></div>
            </div>
        </div>
        <div class="box">
            <h3>Velvet</h3>
            <div class="cover-preview">
                <div class="textured-cover style-velvet"><h2>TÍTULO</h2><span class="style-subtitle">CRIMSON</span></div>
            </div>
        </div>
    </div>
</body>
</html>
