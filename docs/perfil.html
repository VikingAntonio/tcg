<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <link rel="manifest" href="manifest.json">
    <title>Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil_fix.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="public-body">
    <!-- Redesigned Neumorphic Top Panel -->
    <div class="top-left-panel">
        <div class="pill-panel">
            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn" title="Usuario">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info">
                        <img id="dropdown-user-logo" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: none;">
                        <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                        <div class="user-dropdown-role" id="dropdown-user-role" style="display: none;">Usuario</div>
                    </div>
                    <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> Mi Panel</a>
                    <a href="#" class="menu-item logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </div>
            </div>

            <div class="pill-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light" title="Modo Claro">
                    <i class="fas fa-sun"></i>
                </button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple" title="Modo Morado">
                    <i class="fas fa-tint"></i>
                </button>
                <button class="pill-icon theme-btn-small" data-theme="theme-dark" title="Modo Oscuro">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <div class="cart-container-panel">
                <a href="carrito.html" class="pill-icon" id="cart-btn" title="Ver Carrito">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </a>
            </div>
        </div>
    </div>

    <div class="admin-container" style="max-width: 1200px; width: 95%; margin: 40px auto; padding: 20px; display: none;">
        <div class="admin-header">
            <a href="admin.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
            <h1>Mi Perfil</h1>
        </div>

        <div class="album-card" style="padding: 30px; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border);">
            <div id="profile-form">
                <!-- Logo Section (Store only) -->
                <div class="store-only-field" style="display: none; margin-bottom: 30px; text-align: center;">
                    <div style="position: relative; display: inline-block;">
                        <img id="profile-logo-preview" src="https://midominio.com/placeholder-logo.png" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color);">
                        <button id="btn-change-logo" class="btn btn-sm" style="position: absolute; bottom: 0; right: 0; border-radius: 50%; width: 40px; height: 40px; padding: 0;">
                            <i class="fas fa-camera"></i>
                        </button>
                        <input type="file" id="input-logo-file" accept="image/*" style="display: none;">
                    </div>
                    <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Logo de la Tienda</p>
                </div>

                <div class="grid-2-cols" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Nombre de Usuario</label>
                        <input type="text" id="profile-username" readonly class="readonly-field">
                    </div>
                    <div class="form-group" style="display: none;">
                        <label>Correo Electrónico</label>
                        <input type="email" id="profile-email" readonly class="readonly-field">
                    </div>
                    <div class="form-group store-only-field" style="display: none;">
                        <label>Nombre de la Tienda</label>
                        <input type="text" id="profile-store-name">
                    </div>
                    <div class="form-group">
                        <label><i class="fab fa-whatsapp"></i> WhatsApp Link</label>
                        <input type="text" id="profile-whatsapp" placeholder="https://wa.me/123456789">
                    </div>
                    <div class="form-group">
                        <label><i class="fab fa-facebook-messenger"></i> Messenger Link</label>
                        <input type="text" id="profile-messenger" placeholder="https://m.me/usuario">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-globe"></i> Dominio Web (Autorizado)</label>
                        <input type="text" id="profile-domain" placeholder="ej: misitio.com">
                    </div>
                    <div class="form-group store-only-field full-width-field" style="display: none; grid-column: 1 / -1;">
                        <label>Horario de Atención</label>
                        <!-- Schedule Slots Display Container -->
                        <div id="schedule-slots-container" class="schedule-slots-list">
                            <!-- Dynamic schedule slot badges/cards will render here -->
                        </div>
                        <!-- Hidden input to store consolidated text for database & Gemini AI assistant context -->
                        <input type="hidden" id="profile-horario">

                        <!-- Schedule Helper Panel -->
                        <div class="schedule-helper-card">
                            <div class="sched-subtitle">CONFIGURACIÓN RÁPIDA DE DÍAS</div>
                            <div class="schedule-quick-presets">
                                <button type="button" class="preset-btn" data-preset="Lun - Vie">Lun - Vie</button>
                                <button type="button" class="preset-btn" data-preset="Sáb - Dom">Sáb - Dom</button>
                                <button type="button" class="preset-btn" data-preset="Toda la semana">Toda la semana</button>
                            </div>
                            <div class="schedule-days-row">
                                <button type="button" class="day-pill" data-day="Lun">Lun</button>
                                <button type="button" class="day-pill" data-day="Mar">Mar</button>
                                <button type="button" class="day-pill" data-day="Mié">Mié</button>
                                <button type="button" class="day-pill" data-day="Jue">Jue</button>
                                <button type="button" class="day-pill" data-day="Vie">Vie</button>
                                <button type="button" class="day-pill" data-day="Sáb">Sáb</button>
                                <button type="button" class="day-pill" data-day="Dom">Dom</button>
                            </div>
                            <div class="sched-subtitle" style="margin-top: 14px;">HORARIO (APERTURA Y CIERRE)</div>
                            <div class="schedule-time-row">
                                <div class="time-input-wrap">
                                    <i class="far fa-clock"></i>
                                    <input type="text" id="sched-start" value="09:00 AM" readonly class="time-picker-simple">
                                </div>
                                <span class="time-to-separator">a</span>
                                <div class="time-input-wrap">
                                    <i class="far fa-clock"></i>
                                    <input type="text" id="sched-end" value="06:00 PM" readonly class="time-picker-simple">
                                </div>
                                <label class="sched-closed-check">
                                    <input type="checkbox" id="sched-is-closed">
                                    Cerrado
                                </label>
                                <button type="button" id="btn-apply-sched" class="btn btn-sm btn-primary">
                                    + Agregar Horario
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group store-only-field" style="display: none; margin-top: 10px;">
                    <label><i class="fas fa-map-marker-alt"></i> Ubicación / Dirección</label>
                    <input type="text" id="profile-ubicacion" placeholder="Ciudad, País o Dirección completa">
                </div>

                <!-- Additional Information Section -->
                <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                        <label style="font-size: 1rem; font-weight: 600; color: #ffffff; margin: 0;">Información Adicional</label>
                        <button type="button" id="btn-add-info-block" class="btn btn-sm btn-secondary" style="font-size: 0.8rem;">
                            + Agregar Bloque
                        </button>
                    </div>

                    <div id="additional-info-container" style="display: flex; flex-direction: column; gap: 16px;">
                        <!-- Dynamic Info Blocks Render Here -->
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <button id="btn-save-profile" class="btn" style="width: 100%;">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Bottom App Navigation -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/cart.js"></script>
    <script src="js/perfil.js"></script>
    <div class="bottom-nav">
        <div class="nav-item" id="btn-nav-home" title="Ir al Home">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item" id="btn-nav-return" title="Volver">
            <i class="fas fa-chevron-left"></i>
        </div>
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("Service Worker registrado", reg))
                    .catch(err => console.warn("Error al registrar Service Worker", err));
            });
        }
    </script>
    <script src="js/michatbot.js"></script>
</body>
</html>
