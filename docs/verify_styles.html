<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Mini Switch for Cards */
        .switch-searching {
            position: absolute;
            top: 5px;
            left: 5px;
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .switch-mini {
            width: 32px !important;
            height: 18px !important;
        }
        .switch-mini .slider:before {
            height: 12px !important;
            width: 12px !important;
            left: 3px !important;
            bottom: 3px !important;
        }
        .switch-mini input:checked + .slider:before {
            transform: translateX(14px) !important;
        }
        .switch-mini input:checked + .slider {
            background-color: #ff4757; /* Red when searching */
        }

        /* Wishlist specific styles */
        .wishlist-item {
            min-width: 0; /* Fix flex issue */
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .wishlist-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color) !important;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
        }
        .wishlist-field {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 6px;
            width: 100%;
        }
        .wishlist-field:focus {
            border-color: var(--primary-color) !important;
            outline: none;
        }

        /* Slot Tab Buttons */
        .wishlist-tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .wishlist-tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
        }
        .wishlist-tab-btn.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* Pretty Checkbox Styles */
        .wishlist-checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .wishlist-checkbox-container:hover {
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.8);
        }
        .wishlist-checkbox-container input {
            display: none;
        }
        .wishlist-checkbox-custom {
            width: 18px;
            height: 18px;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: transparent;
        }
        .wishlist-checkbox-container input:checked + .wishlist-checkbox-custom {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .wishlist-checkbox-custom::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 10px;
            display: none;
        }
        .wishlist-checkbox-container input:checked + .wishlist-checkbox-custom::after {
            display: block;
        }
        .wishlist-status-text {
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Slot Modal Tabs Styles */
        .slot-modal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .slot-tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .slot-tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
        }
        .slot-tab-btn.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .slot-tabs-body {
            min-height: 480px;
            width: 100%;
            overflow: visible !important;
        }
        @media (max-width: 640px) {
            .slot-tabs-body {
                min-height: 450px;
            }
            .slot-tabs-body .form-group {
                margin-bottom: 12px;
            }
            .slot-tabs-body .info-grid {
                margin-top: 15px;
                gap: 8px;
            }
            #slot-modal .overlay-content {
                padding: 15px;
                border-radius: 16px;
            }
            #slot-modal h2 {
                font-size: 1.2rem;
                margin-bottom: 10px !important;
            }
            .slot-modal-tabs {
                margin-bottom: 15px;
            }
        }

        /* --- PROFESSIONAL ALBUM COVERS ANIMATIONS (ADMIN ONLY) --- */

        /* Safety Containment for all professional styles */
        .style-cosmic, .style-holographic, .style-luxury, .style-marble, .style-velvet,
        .preview-box.style-cosmic, .preview-box.style-holographic, .preview-box.style-luxury,
        .preview-box.style-marble, .preview-box.style-velvet {
            position: relative !important;
            overflow: hidden !important;
        }

        /* Ensure Titles stay visible and on top */
        .textured-cover h2, .preview-box .preview-title {
            position: relative !important;
            z-index: 10 !important;
        }

        /* 1. ULTIMATE LIQUID ANIMATION (Holographic, Luxury, Marble, Velvet) */
        .style-holographic::before, .style-luxury::before, .style-marble::before, .style-velvet::before,
        .preview-box.style-holographic::before, .preview-box.style-luxury::before, .preview-box.style-marble::before, .preview-box.style-velvet::before {
            content: '' !important;
            position: absolute !important;
            top: -100% !important;
            left: -100% !important;
            width: 300% !important;
            height: 300% !important;
            filter: blur(40px) !important;
            opacity: 0.9 !important;
            z-index: 1 !important;
            animation: liquid-swirl 20s ease-in-out infinite alternate !important;
            pointer-events: none !important;
        }

        .style-holographic::after, .style-luxury::after, .style-marble::after, .style-velvet::after,
        .preview-box.style-holographic::after, .preview-box.style-luxury::after, .preview-box.style-marble::after, .preview-box.style-velvet::after {
            content: '' !important;
            position: absolute !important;
            top: -75% !important;
            left: -75% !important;
            width: 250% !important;
            height: 250% !important;
            filter: blur(30px) !important;
            opacity: 0.8 !important;
            z-index: 2 !important;
            animation: liquid-swirl 15s ease-in-out infinite alternate-reverse !important;
            mix-blend-mode: overlay !important;
            pointer-events: none !important;
        }

        /* Specific Liquid Colors & Textures */
        .style-holographic, .preview-box.style-holographic { background: linear-gradient(135deg, #fff 0%, #e2d1c3 100%) !important; }
        .style-holographic::before, .preview-box.style-holographic::before {
            background: radial-gradient(circle at 20% 20%, #00d2ff 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, #ff0080 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #f7ef8a 0%, transparent 50%) !important;
        }
        .style-holographic::after, .preview-box.style-holographic::after {
            background: radial-gradient(circle at 30% 70%, #00ffff 0%, transparent 40%),
                        radial-gradient(circle at 70% 30%, #ff00ff 0%, transparent 40%) !important;
        }

        .style-luxury, .preview-box.style-luxury { background: #000 !important; }
        .style-luxury::before, .preview-box.style-luxury::before {
            background: radial-gradient(circle at 20% 20%, #bf953f 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, #b38728 0%, transparent 50%),
                        radial-gradient(circle at 50% 20%, #f7ef8a 0%, transparent 50%) !important;
        }
        .style-luxury::after, .preview-box.style-luxury::after {
            background: radial-gradient(circle at 40% 40%, #d4af37 0%, transparent 40%),
                        radial-gradient(circle at 90% 10%, #aa771c 0%, transparent 40%) !important;
        }

        .style-marble, .preview-box.style-marble { background: #f0f0f0 !important; }
        .style-marble::before, .preview-box.style-marble::before {
            background: radial-gradient(circle at 15% 15%, #333 0%, transparent 40%),
                        radial-gradient(circle at 85% 85%, #666 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #999 0%, transparent 40%) !important;
            opacity: 0.6 !important;
        }
        .style-marble::after, .preview-box.style-marble::after {
            background: radial-gradient(circle at 35% 65%, #222 0%, transparent 35%),
                        radial-gradient(circle at 65% 35%, #444 0%, transparent 35%) !important;
            opacity: 0.5 !important;
        }

        .style-velvet, .preview-box.style-velvet { background: #300 !important; }
        .style-velvet::before, .preview-box.style-velvet::before {
            background: radial-gradient(circle at 25% 25%, #f00 0%, transparent 50%),
                        radial-gradient(circle at 75% 75%, #800 0%, transparent 50%),
                        radial-gradient(circle at 50% 10%, #ff4d4d 0%, transparent 50%) !important;
        }
        .style-velvet::after, .preview-box.style-velvet::after {
            background: radial-gradient(circle at 45% 55%, #600 0%, transparent 45%),
                        radial-gradient(circle at 55% 45%, #b00 0%, transparent 45%) !important;
        }

        @keyframes liquid-swirl {
            0% { transform: translate(-5%, -5%) rotate(0deg) scale(1); }
            50% { transform: translate(5%, 5%) rotate(180deg) scale(1.15); }
            100% { transform: translate(-5%, 5%) rotate(360deg) scale(1); }
        }

        /* 2. ULTIMATE COSMIC GALAXY (Moving Particles) */
        .style-cosmic::before, .style-cosmic::after, .style-cosmic h2::before, .style-cosmic h2::after,
        .preview-box.style-cosmic::before, .preview-box.style-cosmic::after,
        .preview-box.style-cosmic .preview-title::before, .preview-box.style-cosmic .preview-title::after {
            content: '' !important;
            position: absolute !important;
            width: 2px !important;
            height: 2px !important;
            border-radius: 50% !important;
            z-index: 1 !important;
            pointer-events: none !important;
        }

        .style-cosmic::before, .preview-box.style-cosmic::before { animation: cosmic-drift-1 120s linear infinite !important; }
        .style-cosmic::after, .preview-box.style-cosmic::after { animation: cosmic-drift-2 80s linear infinite alternate !important; }
        .style-cosmic h2::before, .preview-box.style-cosmic .preview-title::before { animation: cosmic-drift-3 100s linear infinite !important; }
        .style-cosmic h2::after, .preview-box.style-cosmic .preview-title::after { animation: cosmic-drift-1 90s linear infinite reverse !important; }
