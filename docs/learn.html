<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprender - Viking TCG</title>
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
        }

        .learn-page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Header */
        header.integrated-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            z-index: 100;
        }

        .logo-integrated {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .logo-integrated img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-integrated h1 {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-header-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-header-nav:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* Viewport Main Layout */
        .learn-main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        /* 3D Character Hero Section */
        .learn-avatar-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            flex: 1;
            min-height: 200px;
            max-height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .thought-bubble {
            position: absolute;
            top: 5px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            border-radius: 25px;
            padding: 10px 22px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            text-align: center;
            z-index: 10;
            animation: bubbleFloat 3s ease-in-out infinite alternate;
            backdrop-filter: blur(12px);
        }

        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 11px solid #38bdf8;
        }

        @keyframes bubbleFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .spirit-3d-wrapper {
            width: 100%;
            height: 100%;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Input Controls Dock */
        .learn-controls-dock {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 16px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .dock-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .dock-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Dropzone Component */
        .file-dropzone {
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 90px;
        }

        .file-dropzone:hover, .file-dropzone.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .file-dropzone i {
            font-size: 1.6rem;
            color: #38bdf8;
        }

        .file-dropzone span {
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .file-dropzone input[type="file"] {
            display: none;
        }

        /* Direct Input Forms */
        .dock-inputs-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dock-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .dock-input-group i {
            position: absolute;
            left: 14px;
            color: #38bdf8;
            font-size: 0.9rem;
        }

        .dock-input {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 14px 10px 38px;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .dock-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        .dock-textarea {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            outline: none;
            resize: none;
            height: 60px;
            transition: border-color 0.2s ease;
        }

        .dock-textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        /* Action Bar */
        .dock-action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 4px;
        }

        .btn-learn-submit {
            flex: 1;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-learn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .btn-view-items {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #38bdf8;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-view-items:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        /* Learned Items Modal/Drawer */
        .items-drawer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .items-drawer-modal.active {
            display: flex;
        }

        .items-drawer-content {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .items-drawer-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .items-drawer-header h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-drawer {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .btn-close-drawer:hover {
            color: #f8fafc;
        }

        .items-drawer-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .learn-item-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .learn-item-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .learn-item-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
        }

        .btn-delete-item {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete-item:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }

        .learn-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0;
            color: #f8fafc;
        }

        .learn-item-body-text {
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="learn-page-wrapper">
        <!-- Integrated Header -->
        <header class="integrated-header">
            <a href="admin.html" class="logo-integrated">
                <img id="user-store-logo" src="https://vikingtcg.xyz/favi.png" alt="Logo">
                <h1 id="user-store-name">Viking TCG</h1>
            </a>
            <div class="header-actions">
                <a href="admin.html" class="btn-header-nav"><i class="fas fa-arrow-left"></i> Panel Admin</a>
                <a href="#" id="btn-public-link" class="btn-header-nav" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Link Público</a>
            </div>
        </header>

        <!-- Main Single-Page Stage -->
        <main class="learn-main-stage">

            <!-- Center 3D Avatar Hero -->
            <div class="learn-avatar-container">
                <div class="thought-bubble">
                    ¿Qué voy a aprender hoy?
                </div>
                <div class="spirit-3d-wrapper">
                    <model-viewer
                        id="learn-spirit-viewer"
                        src="https://models.readyplayer.me/64b0f9f3f9f8c6d7a1234567.glb"
                        camera-controls
                        auto-rotate
                        shadow-intensity="1"
                        environment-image="neutral"
                        exposure="1.2"
                        interaction-prompt="none"
                        camera-orbit="auto 75deg auto"
                        disable-zoom
                        disable-pan
                        style="background: transparent;">
                    </model-viewer>
                </div>
            </div>

            <!-- Input Controls Dock -->
            <div class="learn-controls-dock">
                <div class="dock-grid">
                    <!-- Dropzone -->
                    <div class="file-dropzone" id="file-dropzone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="dropzone-text">Arrastra tus documentos o imágenes aquí</span>
                        <input type="file" id="file-input" accept=".txt,.pdf,.doc,.docx,.png,.jpg,.jpeg">
                    </div>

                    <!-- Input Fields -->
                    <div class="dock-inputs-column">
                        <div class="dock-input-group">
                            <i class="fas fa-table"></i>
                            <input type="url" id="sheets-url-input" class="dock-input" placeholder="Conectar Google Sheets URL...">
                        </div>
                        <textarea id="note-text-input" class="dock-textarea" placeholder="Escribe texto plano o notas sobre tu negocio..."></textarea>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="dock-action-bar">
                    <button type="button" class="btn-view-items" id="btn-open-drawer">
                        <i class="fas fa-database"></i> Ver Conocimientos (<span id="items-count-badge">0</span>)
                    </button>
                    <button type="button" class="btn-learn-submit" id="btn-save-knowledge">
                        <i class="fas fa-brain"></i> Guardar Data
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal Drawer for Items -->
    <div class="items-drawer-modal" id="items-drawer-modal">
        <div class="items-drawer-content">
            <div class="items-drawer-header">
                <h3><i class="fas fa-book-reader"></i> Información Aprendida</h3>
                <button class="btn-close-drawer" id="btn-close-drawer"><i class="fas fa-times"></i></button>
            </div>
            <div class="items-drawer-body" id="items-drawer-body">
                <div style="text-align: center; color: #94a3b8; padding: 20px;">Cargando conocimientos...</div>
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        let currentUserId = null;
        let currentUserProfile = null;
        let learnItems = [];
        let loadedFileContent = null;
        let loadedFileName = null;

        $(document).ready(async function() {
            await initLearnPage();

            // File Dropzone logic
            const $dropzone = $('#file-dropzone');
            const $fileInput = $('#file-input');

            $dropzone.on('click', function() { $fileInput.trigger('click'); });

            $dropzone.on('dragover dragenter', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $dropzone.addClass('dragover');
            });

            $dropzone.on('dragleave drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $dropzone.removeClass('dragover');
            });

            $dropzone.on('drop', function(e) {
                const files = e.originalEvent.dataTransfer.files;
                if (files && files.length > 0) {
                    handleFileSelection(files[0]);
                }
            });

            $fileInput.on('change', function() {
                if (this.files && this.files.length > 0) {
                    handleFileSelection(this.files[0]);
                }
            });

            // Save Knowledge action
            $('#btn-save-knowledge').on('click', async function() {
                await handleSaveKnowledge();
            });

            // Modal Drawer toggles
            $('#btn-open-drawer').on('click', function() {
                $('#items-drawer-modal').addClass('active');
            });

            $('#btn-close-drawer').on('click', function() {
                $('#items-drawer-modal').removeClass('active');
            });

            $('#items-drawer-modal').on('click', function(e) {
                if ($(e.target).is('#items-drawer-modal')) {
                    $('#items-drawer-modal').removeClass('active');
                }
            });
        });

        async function initLearnPage() {
            if (typeof _supabase === 'undefined') {
                Swal.fire('Error', 'No se pudo conectar con Supabase.', 'error');
                return;
            }

            const { data: { session } } = await _supabase.auth.getSession();
            let sessionUser = session ? session.user : null;

            if (!sessionUser) {
                const stored = localStorage.getItem('tcg_session');
                if (stored) {
                    try { sessionUser = JSON.parse(stored); } catch (e) {}
                }
            }

            if (!sessionUser) {
                Swal.fire({
                    title: 'Sesión requerida',
                    text: 'Debes iniciar sesión para administrar la información de tu negocio.',
                    icon: 'warning',
                    confirmButtonText: 'Iniciar Sesión'
                }).then(() => { window.location.href = 'index.html'; });
                return;
            }

            currentUserId = sessionUser.id;

            // Fetch user profile
            const { data: profile } = await _supabase.from('usuarios').select('*').eq('id', currentUserId).maybeSingle();
            if (profile) {
                currentUserProfile = profile;
                if (profile.store_name) $('#user-store-name').text(profile.store_name);
                else if (profile.username) $('#user-store-name').text(profile.username);

                if (profile.store_logo) $('#user-store-logo').attr('src', profile.store_logo);

                const publicIdentifier = profile.store_name || profile.username || currentUserId;
                $('#btn-public-link').attr('href', `public.html?id=${encodeURIComponent(publicIdentifier)}&view=learn`);

                // Load Spirit 3D GLTF
                if (profile.selected_spirit_id) {
                    const { data: spirit } = await _supabase.from('spirits').select('*').eq('id', profile.selected_spirit_id).maybeSingle();
                    if (spirit && spirit.gltf_url) {
                        $('#learn-spirit-viewer').attr('src', spirit.gltf_url);
                    }
                } else {
                    const { data: defaultSpirit } = await _supabase.from('spirits').select('*').eq('is_public', true).limit(1).maybeSingle();
                    if (defaultSpirit && defaultSpirit.gltf_url) {
                        $('#learn-spirit-viewer').attr('src', defaultSpirit.gltf_url);
                    }
                }
            }

            await loadLearnItems();
        }

        function handleFileSelection(file) {
            loadedFileName = file.name;
            $('#dropzone-text').text(`📄 Archivo: ${file.name}`);

            const reader = new FileReader();
            reader.onload = function(e) {
                loadedFileContent = e.target.result;
            };
            reader.readAsText(file);
        }

        async function loadLearnItems() {
            if (!currentUserId) return;

            const { data, error } = await _supabase
                .from('learn_items')
                .select('*')
                .eq('user_id', currentUserId)
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error cargando learn_items:", error);
                return;
            }

            learnItems = data || [];
            $('#items-count-badge').text(learnItems.length);
            renderDrawerItems();
        }

        function renderDrawerItems() {
            const $body = $('#items-drawer-body');
            $body.empty();

            if (learnItems.length === 0) {
                $body.html('<div style="text-align: center; color: #94a3b8; padding: 20px;">Aún no has guardado información de tu negocio.</div>');
                return;
            }

            learnItems.forEach(item => {
                const $card = $(`
                    <div class="learn-item-card">
                        <div class="learn-item-card-header">
                            <span class="learn-item-tag">${escapeHtml(item.category || 'General')}</span>
                            <button class="btn-delete-item" onclick="deleteLearnItem('${item.id}')" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
                        </div>
                        <h4 class="learn-item-title">${escapeHtml(item.title)}</h4>
                        <div class="learn-item-body-text">${escapeHtml(item.content)}</div>
                    </div>
                `);
                $body.append($card);
            });
        }

        async function handleSaveKnowledge() {
            const sheetsUrl = $('#sheets-url-input').val().trim();
            const noteText = $('#note-text-input').val().trim();

            if (!loadedFileContent && !sheetsUrl && !noteText) {
                Swal.fire('Campos vacíos', 'Sube un archivo, ingresa un link de Google Sheets o escribe notas.', 'warning');
                return;
            }

            Swal.fire({ title: 'Guardando datos...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let saveCount = 0;

            if (loadedFileContent) {
                await _supabase.from('learn_items').insert([{
                    user_id: currentUserId,
                    title: `Documento: ${loadedFileName}`,
                    category: 'Documento',
                    content: loadedFileContent,
                    is_public: true
                }]);
                saveCount++;
            }

            if (sheetsUrl) {
                await _supabase.from('learn_items').insert([{
                    user_id: currentUserId,
                    title: 'Google Sheets Conectado',
                    category: 'Google Sheets',
                    content: `Link de datos: ${sheetsUrl}`,
                    is_public: true
                }]);
                saveCount++;
            }

            if (noteText) {
                await _supabase.from('learn_items').insert([{
                    user_id: currentUserId,
                    title: 'Nota / Data de Negocio',
                    category: 'Notas',
                    content: noteText,
                    is_public: true
                }]);
                saveCount++;
            }

            Swal.close();
            Swal.fire({ icon: 'success', title: 'Data guardada exitosamente', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });

            // Reset inputs
            loadedFileContent = null;
            loadedFileName = null;
            $('#dropzone-text').text('Arrastra tus documentos o imágenes aquí');
            $('#file-input').val('');
            $('#sheets-url-input').val('');
            $('#note-text-input').val('');

            await loadLearnItems();
        }

        window.deleteLearnItem = async function(id) {
            const { isConfirmed } = await Swal.fire({
                title: '¿Eliminar este registro?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, eliminar'
            });

            if (isConfirmed) {
                const { error } = await _supabase.from('learn_items').delete().eq('id', id).eq('user_id', currentUserId);
                if (error) {
                    Swal.fire('Error', 'No se pudo eliminar: ' + error.message, 'error');
                } else {
                    Swal.fire({ icon: 'success', title: 'Eliminado', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
                    await loadLearnItems();
                }
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
