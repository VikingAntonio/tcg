<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Cartas - TCG Dual</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .scanner-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #video-preview {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            border: 2px solid var(--primary-color);
            background: #000;
            margin-bottom: 20px;
        }
        .controls-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            width: 100%;
            margin-bottom: 20px;
        }
        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
        }
        .status-scanning { background: rgba(0, 210, 255, 0.2); color: #00d2ff; }
        .status-idle { background: rgba(255, 255, 255, 0.1); color: #aaa; }
        .status-loading { background: rgba(255, 165, 0, 0.2); color: #ffa500; }

        #ocr-canvas { display: none; }

        .scan-overlay {
            position: relative;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
        }
        .scan-region {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 40%;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            z-index: 5;
        }
        .code-detected {
            margin-top: 10px;
            font-family: monospace;
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            height: 1.5em;
        }

        .top-right-panel {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
        }

        body.theme-light .status-idle { background: rgba(0, 0, 0, 0.05); color: #666; }
        body.theme-light .controls-panel { background: #fff; }
    </style>
</head>
<body class="public-body">
    <div class="top-right-panel" id="top-panel">
        <div class="user-menu-container">
            <button class="user-avatar-btn" onclick="location.href='admin.html'" title="Volver al Panel">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <div class="scanner-container">
        <div class="admin-header">
            <h1>Scanner de Cartas</h1>
            <p>Selecciona un destino y apunta la cámara al código de la carta.</p>
        </div>

        <div class="controls-panel">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Añadir a</label>
                    <select id="select-target-type">
                        <option value="album">Álbum</option>
                        <option value="deck">Deck</option>
                    </select>
                </div>

                <div id="album-selection-container" class="form-group">
                    <label>Seleccionar Álbum</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="select-album" style="flex: 1;"></select>
                        <button id="btn-new-album" class="btn btn-secondary" title="Nuevo Álbum"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <div id="deck-selection-container" class="form-group" style="display: none;">
                    <label>Seleccionar Deck</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="select-deck" style="flex: 1;"></select>
                        <button id="btn-new-deck" class="btn btn-secondary" title="Nuevo Deck"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>

            <div id="page-selection-container" class="form-group">
                <label>Página destino</label>
                <div style="display: flex; gap: 10px;">
                    <select id="select-page" style="flex: 1;"></select>
                    <button id="btn-new-page" class="btn btn-secondary" title="Nueva Página"><i class="fas fa-plus"></i></button>
                </div>
            </div>
        </div>

        <div class="scan-overlay">
            <video id="video-preview" autoplay playsinline></video>
            <div class="scan-region"></div>
        </div>

        <div id="scan-status" class="status-badge status-idle">Cargando...</div>
        <div id="detected-code-display" class="code-detected"></div>

        <canvas id="ocr-canvas"></canvas>

        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button id="btn-toggle-scan" class="btn" style="width: 180px;"><i class="fas fa-play"></i> Iniciar Scanner</button>
            <button id="btn-manual-entry" class="btn btn-secondary"><i class="fas fa-keyboard"></i> Código Manual</button>
        </div>
    </div>

    <script src="js/scanner.js"></script>
</body>
</html>
