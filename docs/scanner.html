<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #00d2ff;
        }

        body.public-body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .scanner-layout {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scanner-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .scanner-header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .destination-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: end;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .custom-select-wrapper {
            display: flex;
            gap: 10px;
        }

        select, input {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
            padding: 12px !important;
            border-radius: 12px !important;
            font-size: 14px !important;
            outline: none !important;
            width: 100%;
        }

        .btn-plus {
            background: var(--accent-color) !important;
            border: none !important;
            color: #000 !important;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .btn-plus:hover { transform: scale(1.05); }

        .viewport-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #file-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 75%;
            height: 85%;
            border: 2px solid var(--accent-color);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.7);
            position: relative;
        }

        .corner-tl { position: absolute; top: -5px; left: -5px; width: 20px; height: 20px; border-top: 4px solid var(--accent-color); border-left: 4px solid var(--accent-color); border-radius: 8px 0 0 0; }
        .corner-tr { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-top: 4px solid var(--accent-color); border-right: 4px solid var(--accent-color); border-radius: 0 8px 0 0; }
        .corner-bl { position: absolute; bottom: -5px; left: -5px; width: 20px; height: 20px; border-bottom: 4px solid var(--accent-color); border-left: 4px solid var(--accent-color); border-radius: 0 0 0 8px; }
        .corner-br { position: absolute; bottom: -5px; right: -5px; width: 20px; height: 20px; border-bottom: 4px solid var(--accent-color); border-right: 4px solid var(--accent-color); border-radius: 0 0 8px 0; }

        .scanning-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
            animation: scan-anim 2s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes scan-anim {
            0% { top: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .scanner-active .scanning-line { opacity: 1; }

        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ff4757;
            display: inline-block;
            margin-right: 10px;
            transition: 0.3s;
        }
        .status-ready .status-dot { background: #2ed573; box-shadow: 0 0 10px #2ed573; }
        .status-working .status-dot {
            background: #ffa500;
            box-shadow: 0 0 10px #ffa500;
            animation: pulse-orange 1s infinite;
        }

        @keyframes pulse-orange {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .btn-main {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background: var(--accent-color); color: #000; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }

        .back-btn {
            position: fixed;
            top: 25px; left: 25px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 100;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .dev-warning-banner {
            background: #ff4757;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
            width: 100%;
            max-width: 600px;
            animation: slideDown 0.5s ease-out;
            z-index: 1001;
        }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .close-warning {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
        }

        .result-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            transform: translateX(120%);
            background: #2f3136;
            border-left: 4px solid #5865f2;
            padding: 12px 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.24);
            z-index: 2000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            width: 300px;
        }

        .result-toast.active { transform: translateX(0); }
        .result-toast.error { border-left-color: #f04747; }
        .result-toast.success { border-left-color: #43b581; }

        .toast-img-box {
            width: 40px; height: 56px;
            background: #202225;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .scanner-layout { padding-top: 50px; }
            .back-btn { top: 15px; left: 15px; width: 35px; height: 35px; }
            .destination-grid { grid-template-columns: 1fr; }
        }

        /* Detection Zones */
        .code-zone {
            position: absolute;
            border: 2px dashed rgba(0, 210, 255, 0.4);
            border-radius: 4px;
            pointer-events: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .code-zone::after {
            content: attr(data-label);
            position: absolute;
            top: -18px;
            left: 0;
            font-size: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            border-radius: 3px;
        }
        /* AJUSTA ESTA ZONA VISUAL PARA QUE COINCIDA CON SCAN_ROI */
        .main-code-zone {
            bottom: 5%;  /* Distancia desde abajo */
            left: 5%;    /* Distancia desde la izquierda */
            width: 90%;  /* Ancho de la caja */
            height: 10%; /* Alto de la caja */
        }
    </style>
</head>
<body class="public-body">
    <button class="back-btn" onclick="location.href='admin.html'"><i class="fas fa-arrow-left"></i></button>

    <div class="scanner-layout">
        <div id="dev-warning" class="dev-warning-banner" style="display:none;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fas fa-exclamation-triangle"></i>
                <span style="font-weight: 600; font-size: 14px;">Esta función está en desarrollo y aún no está en funcionamiento</span>
            </div>
            <button class="close-warning" onclick="this.parentElement.style.display='none'">&times;</button>
        </div>

        <div class="scanner-header">
            <h1>Scanner de Cartas</h1>
            <p style="color: #aaa;">Encuentra y añade cartas automáticamente</p>
        </div>

        <div class="glass-panel">
            <div class="destination-grid">
                <div class="form-group">
                    <label>Añadir a</label>
                    <select id="select-target-type">
                        <option value="album">Álbum</option>
                        <option value="deck">Deck</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="dest-label">Seleccionar Álbum</label>
                    <div class="custom-select-wrapper">
                        <select id="select-dest"></select>
                        <button class="btn-plus" id="btn-new-dest" title="Crear Nuevo"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="viewport-container" id="scanner-viewport">
            <video id="video-preview" autoplay playsinline muted></video>
            <img id="file-preview" src="">
            <div class="scan-overlay">
                <div class="scan-frame">
                    <div class="corner-tl"></div>
                    <div class="corner-tr"></div>
                    <div class="corner-bl"></div>
                    <div class="corner-br"></div>

                    <!-- Solo el espacio para el código (Ajustable) -->
                    <div class="code-zone main-code-zone" data-label="Área de Escaneo"></div>

                    <div class="scanning-line"></div>
                </div>
            </div>
        </div>

        <div class="glass-panel status-panel" id="status-container">
            <div style="display: flex; align-items: center;">
                <span class="status-dot"></span>
                <span id="status-text">Motor Listo</span>
            </div>
            <div id="detected-code" style="color: var(--accent-color); font-family: monospace; font-size: 1rem; font-weight: bold;"></div>
        </div>

        <div class="controls-row">
            <button id="btn-toggle-scan" class="btn-main btn-primary">
                <i class="fas fa-camera"></i> Cámara
            </button>
            <button id="btn-upload" class="btn-main btn-secondary">
                <i class="fas fa-upload"></i> Subir Imagen
            </button>
            <button id="btn-manual" class="btn-main btn-secondary">
                <i class="fas fa-keyboard"></i> Manual
            </button>
        </div>
    </div>

    <input type="file" id="file-upload" accept="image/*" style="display: none;">

    <div class="result-toast" id="result-toast">
        <div class="toast-img-box">
            <img id="toast-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <div id="toast-icon-err" style="display: none; height: 100%; width: 100%; align-items: center; justify-content: center; color: #f04747; font-size: 24px;">
                <i class="fas fa-times-circle"></i>
            </div>
        </div>
        <div style="flex: 1;">
            <div id="toast-title" style="font-weight: 800; font-size: 11px; color: #b9bbbe; text-transform: uppercase; letter-spacing: 0.5px;">Notificación</div>
            <div id="toast-name" style="color: #fff; font-size: 14px; font-weight: 500; margin-top: 2px; line-height: 1.2;">Cargando...</div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
// CONFIGURACIÓN DE ÁREA DE ESCANEO (ROI)
// Estos valores se aplican sobre un lienzo de 800x1100 (proporción de carta)
const SCAN_ROI = {
    x: 40,    // Distancia desde la izquierda
    y: 940,   // Distancia desde arriba (YGO Passcode/PKMN Number suelen estar abajo)
    w: 720,   // Ancho del área de captura
    h: 120    // Alto del área de captura
};

let isScanning = false;
let stream = null;
let detectionBuffer = {};
const DETECTION_THRESHOLD = 3;

let ygoSetsCache = null;
async function getYgoSets() {
    if (ygoSetsCache) return ygoSetsCache;
    try {
        const response = await fetch('https://db.ygoprodeck.com/api/v7/cardsets.php');
        ygoSetsCache = await response.json();
    } catch (e) {
        console.warn("Error fetching YGO sets:", e);
        ygoSetsCache = [];
    }
    return ygoSetsCache;
}

let currentUser = null;
let tesseractWorker = null;
let scanTimer = null;

$(document).ready(async function() {
    await checkSession();
    await loadInitialData();
    await initTesseract();

    $('#select-target-type').change(function() {
        const type = $(this).val();
        $('#dest-label').text(type === 'album' ? 'Seleccionar Álbum' : 'Seleccionar Deck');
        loadDestinations(type);
    });

    $('#btn-new-dest').click(createNewDestination);

    $('#btn-toggle-scan').click(async function() {
        if (!isScanning) {
            await startCamera();
        } else {
            stopCamera();
        }
    });

    $('#btn-upload').click(function() {
        $('#file-upload').click();
    });

    $('#file-upload').change(handleFileUpload);

    $('#btn-manual').click(async function() {
        const { value: code } = await Swal.fire({
            title: 'Entrada Manual',
            input: 'text',
            inputLabel: 'Introduce el código de la carta',
            inputPlaceholder: 'LOB-001 / 58/102',
            showCancelButton: true,
            confirmButtonColor: '#00d2ff',
            background: '#1a1a2e',
            color: '#fff'
        });

        if (code) {
            await handleFoundCode(code.toUpperCase().trim());
        }
    });
});

async function checkSession() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
        const { data: user } = await _supabase
            .from('usuarios')
            .select('id, username, email, is_store, role, max_albums, max_pages, max_decks, max_cards_per_deck')
            .eq('id', session.user.id)
            .single();

        if (user) {
            currentUser = user;
            if (currentUser.role !== 'admin') {
                $('#dev-warning').show();
            }
        } else {
            window.location.href = 'admin.html';
        }
    } else {
        window.location.href = 'admin.html';
    }
}

async function loadInitialData() {
    await loadDestinations('album');
}

async function loadDestinations(type) {
    const table = type === 'album' ? 'albums' : 'decks';
    const { data, error } = await _supabase
        .from(table)
        .select('*')
        .eq('user_id', currentUser.id)
        .order('id', { ascending: true });

    const $select = $('#select-dest');
    $select.empty();
    if (data && data.length > 0) {
        data.forEach(item => {
            $select.append(`<option value="${item.id}">${item.title || item.name}</option>`);
        });
    } else {
        $select.append(`<option value="">No hay ${type}s</option>`);
    }
}

async function createNewDestination() {
    const type = $('#select-target-type').val();

    // Check limit
    const table = type === 'album' ? 'albums' : 'decks';
    const limit = type === 'album' ? (currentUser.max_albums || 3) : (currentUser.max_decks || 1);
    const { count } = await _supabase.from(table).select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);

    if (count >= limit) {
        Swal.fire('Límite alcanzado', `Tu plan actual permite un máximo de ${limit} ${type === 'album' ? 'álbumes' : 'deck'}.`, 'warning');
        return;
    }

    const { value: name } = await Swal.fire({
        title: `Nuevo ${type === 'album' ? 'Álbum' : 'Deck'}`,
        input: 'text',
        inputLabel: `Nombre del ${type}`,
        showCancelButton: true,
        confirmButtonColor: '#00d2ff',
        background: '#1a1a2e',
        color: '#fff'
    });

    if (name) {
        const table = type === 'album' ? 'albums' : 'decks';
        const field = type === 'album' ? 'title' : 'name';
        const { data, error } = await _supabase
            .from(table)
            .insert([{ [field]: name, user_id: currentUser.id }])
            .select();

        if (!error) {
            await loadDestinations(type);
            $('#select-dest').val(data[0].id);
        }
    }
}

async function initTesseract() {
    if (tesseractWorker) return;
    $('#status-text').text('Iniciando OCR...');
    tesseractWorker = await Tesseract.createWorker('eng');
    await tesseractWorker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/- '
    });
    $('#status-text').text('Motor Listo');
    $('#status-container').addClass('status-ready');
}

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        const video = document.getElementById('video-preview');
        video.srcObject = stream;

        // Intentar aplicar enfoque continuo si el dispositivo lo permite
        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
            track.applyConstraints({
                advanced: [{ focusMode: 'continuous' }, { exposureMode: 'continuous' }]
            }).catch(e => console.warn("Constraints no soportados:", e));
        }

        video.style.display = 'block';
        $('#file-preview').hide();

        isScanning = true;
        $('#btn-toggle-scan').html('<i class="fas fa-stop"></i> Detener').removeClass('btn-primary').addClass('btn-secondary');
        $('#scanner-viewport').addClass('scanner-active');
        $('#status-text').text('Escaneando...');

        startScanningLoop();
    } catch (err) {
        console.error("Error accessing camera:", err);
        Swal.fire('Error', 'No se pudo acceder a la cámara.', 'error');
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        document.getElementById('video-preview').srcObject = null;
    }
    isScanning = false;
    clearTimeout(scanTimer);
    detectionBuffer = {};
    $('#btn-toggle-scan').html('<i class="fas fa-camera"></i> Cámara').removeClass('btn-secondary').addClass('btn-primary');
    $('#scanner-viewport').removeClass('scanner-active');
    $('#status-text').text('Pausado');
    $('#status-container').removeClass('status-working');
}

async function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    stopCamera();

    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
            $('#file-preview').attr('src', event.target.result).show();
            $('#video-preview').hide();
            $('#status-text').text('Procesando Imagen...');
            $('#status-container').addClass('status-working');

            await processImage(img);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

function startScanningLoop() {
    if (!isScanning) return;

    scanTimer = setTimeout(async () => {
        if (!isScanning) return;

        const video = document.getElementById('video-preview');
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            await captureAndProcessFrame(video);
        }

        startScanningLoop();
    }, 1200);
}

async function captureAndProcessFrame(video) {
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d');

    const vW = video.videoWidth;
    const vH = video.videoHeight;

    let cropW, cropH, cropX, cropY;

    if (vW > vH) {
        cropH = vH * 0.85;
        cropW = vH * 0.75;
        cropX = (vW - vH) / 2 + (vH * 0.125);
        cropY = vH * 0.075;
    } else {
        cropW = vW * 0.75;
        cropH = vW * 0.85;
        cropX = vW * 0.125;
        cropY = (vH - vW) / 2 + vW * 0.075;
    }

    canvas.width = 800;
    canvas.height = 1100;
    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 800, 1100);

    // Create a processing canvas for the specific ROI adjusted by the user - UPSCALE 2x
    const procCanvas = document.createElement('canvas');
    procCanvas.width = SCAN_ROI.w * 2;
    procCanvas.height = SCAN_ROI.h * 2;
    const pctx = procCanvas.getContext('2d');

    // Smooth scaling
    pctx.imageSmoothingEnabled = true;
    pctx.imageSmoothingQuality = 'high';

    pctx.drawImage(canvas, SCAN_ROI.x, SCAN_ROI.y, SCAN_ROI.w, SCAN_ROI.h, 0, 0, SCAN_ROI.w * 2, SCAN_ROI.h * 2);
    preprocessROI(pctx, 0, 0, SCAN_ROI.w * 2, SCAN_ROI.h * 2);

    // No cambiamos el texto aquí para no parpadear con "Verificando..."
    $('#status-container').addClass('status-working');

    await processImage(procCanvas);
}

function preprocessROI(ctx, x, y, w, h, threshold = 140) {
    const imageData = ctx.getImageData(x, y, w, h);
    const data = imageData.data;
    const factor = 2.5; // Slightly higher contrast

    for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        // Luminance-based grayscale
        let v = 0.2126 * r + 0.7152 * g + 0.0722 * b;

        // Apply Contrast
        v = factor * (v - 128) + 128;

        // Apply Threshold
        v = v > threshold ? 255 : 0;

        data[i] = data[i+1] = data[i+2] = v;
    }
    ctx.putImageData(imageData, x, y);
}

async function processImage(imageOrCanvas, isRetry = false) {
    try {
        const { data: { text } } = await tesseractWorker.recognize(imageOrCanvas);
        const { code } = identifyFromText(text);

        if (code) {
            await processDetectedText(text);
        } else if (!isRetry && !$('#file-preview').is(':visible') && isScanning) {
            // Reintento con un preprocesado diferente si falló el primero
            const procCanvas = document.createElement('canvas');
            procCanvas.width = imageOrCanvas.width;
            procCanvas.height = imageOrCanvas.height;
            const pctx = procCanvas.getContext('2d');
            pctx.drawImage(imageOrCanvas, 0, 0);

            // Segundo intento con un threshold distinto
            preprocessROI(pctx, 0, 0, procCanvas.width, procCanvas.height, 165);
            await processImage(procCanvas, true);
        } else {
            await processDetectedText(text);
        }
    } catch (err) {
        console.error("OCR Error:", err);
        $('#status-text').text('Error en OCR');
        $('#status-container').removeClass('status-working');
    }
}

function smartNormalize(s, forceNumeric = false) {
    if (!s) return "";
    // Si se espera numérico o tiene más números que letras, aplicamos correcciones agresivas
    const digitCount = (s.match(/[0-9]/g) || []).length;
    const letterCount = (s.match(/[A-Z]/g) || []).length;

    if (forceNumeric || digitCount >= letterCount) {
        return s.replace(/[OQDU]/g, '0') // O, Q, D, U -> 0
                .replace(/[ILJT]/g, '1') // I, L, J, T -> 1
                .replace(/Z/g, '2')      // Z -> 2
                .replace(/E/g, '3')      // E -> 3
                .replace(/A/g, '4')      // A -> 4
                .replace(/S/g, '5')      // S -> 5
                .replace(/G/g, '6')      // G -> 6
                .replace(/B/g, '8')      // B -> 8
                .replace(/\s/g, '');
    }
    return s.replace(/\s/g, '');
}

function identifyFromText(text) {
    const lines = text.toUpperCase().split('\n');
    let results = [];

    for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        // 1. Yu-Gi-Oh Passcode (8 dígitos) - Alta prioridad
        // Incluimos letras que suelen confundirse con números
        const regexPasscode = /\b([0-9OIZSGEABDUQ]{8})\b/;
        const matchPass = line.match(regexPasscode);
        if (matchPass) {
            const code = smartNormalize(matchPass[1], true);
            if (code.length === 8) {
                results.unshift({ code: code, type: 'yugioh' }); // unshift to prioritize
            }
        }

        // 2. Yu-Gi-Oh Set Code: [SET]-[LANG][ID]
        const regexYG = /\b([A-Z0-9]{3,6})[\-\s]([A-Z0-9]{3,8})\b/i;
        const matchYG = line.match(regexYG);
        if (matchYG) {
            let prefix = matchYG[1];
            let suffix = matchYG[2];

            let lang = "";
            let idPart = suffix;
            // Detect common language codes like EN, SP, IT, FR, DE, JP
            if (/^(EN|SP|IT|FR|DE|JP|PT|KR)[0-9OIZSGEAB]{1,}/.test(suffix)) {
                lang = suffix.substring(0, 2);
                idPart = suffix.substring(2);
            }

            let normalizedID = smartNormalize(idPart, true);
            results.push({ code: prefix + '-' + lang + normalizedID, type: 'yugioh' });
        }

        // 3. Pokémon Fraction (e.g., 123/456)
        const regexPK_F = /\b([0-9OIZSGEAB]{1,5})\/([0-9OIZSGEAB]{1,5})\b/i;
        const matchPK_F = line.match(regexPK_F);
        if (matchPK_F) {
            let n1 = smartNormalize(matchPK_F[1], true);
            let n2 = smartNormalize(matchPK_F[2], true);
            results.push({ code: n1 + '/' + n2, type: 'pokemon' });
        }

        // 4. Pokémon Promo (e.g., SWSH123)
        const regexPK_P = /\b([A-Z]{2,5})[\s]?([0-9OIZSGEAB]{2,5})\b/i;
        const matchPK_P = line.match(regexPK_P);
        if (matchPK_P) {
            let prefix = matchPK_P[1];
            if (!['BASIC', 'STAGE', 'HP', 'NO', 'DNA', 'TYPE'].includes(prefix)) {
                let num = smartNormalize(matchPK_P[2], true);
                results.push({ code: prefix + num, type: 'pokemon' });
            }
        }
    }

    return results.length > 0 ? results[0] : { code: null, type: null };
}

async function processDetectedText(text) {
    const { code, type } = identifyFromText(text);

    if (code) {
        // Si es carga de archivo, no necesitamos votación
        if (!$('#file-preview').is(':visible')) {
            if (!detectionBuffer[code]) {
                detectionBuffer = {}; // Solo nos enfocamos en un código a la vez
                detectionBuffer[code] = 1;
            } else {
                detectionBuffer[code]++;
            }

            const count = detectionBuffer[code];
            $('#detected-code').text(`${code} (${count}/${DETECTION_THRESHOLD})`);

            if (count < DETECTION_THRESHOLD) {
                $('#status-text').text(`Verificando... [${count}/${DETECTION_THRESHOLD}]`);
                return;
            }

            // Si llegamos aquí, el código es válido
            detectionBuffer = {};
            $('#status-text').text('¡Confirmado!');
        }

        $('#detected-code').text(code);
        const success = await handleFoundCode(code, type);
        if (!success && code) {
             showManualPrompt(code, text);
        }
    } else {
        const raw = text.trim().replace(/[\n\r]/g, ' ').substring(0, 40);
        if (raw.length > 5) {
            $('#detected-code').html(`<span style="opacity: 0.5; font-size: 0.8rem;">? ${raw}</span> <i class="fas fa-edit" style="cursor:pointer; margin-left: 5px;" onclick="promptCorrection('${raw.replace(/'/g, "\\'")}')"></i>`);
            if ($('#file-preview').is(':visible')) {
                showManualPrompt(null, text);
            }
        }

        $('#status-text').text(isScanning ? 'Escaneando...' : 'Listo');
        $('#status-container').removeClass('status-working');
    }
}

async function showManualPrompt(failedCode, rawText) {
    if (window.isPrompting) return;
    window.isPrompting = true;

    const title = failedCode ? `No se encontró ${failedCode}` : 'Código no detectado';
    const msg = failedCode ? 'El código parece correcto pero no está en la base de datos. ¿Deseas corregirlo?' : 'No pudimos encontrar un código. ¿Deseas ingresarlo manualmente?';

    const { isConfirmed } = await Swal.fire({
        title: title,
        text: msg,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, editar',
        cancelButtonText: 'No'
    });

    window.isPrompting = false;
    if (isConfirmed) {
        promptCorrection(failedCode || rawText.substring(0, 20));
    }
}

async function promptCorrection(detectedText) {
    const { value: correctedCode } = await Swal.fire({
        title: 'Corregir Código',
        input: 'text',
        inputValue: detectedText,
        inputLabel: 'Introduce el código correcto:',
        showCancelButton: true,
        confirmButtonColor: '#00d2ff',
        background: '#1a1a2e',
        color: '#fff'
    });

    if (correctedCode) {
        await handleFoundCode(correctedCode.toUpperCase().trim());
    }
}

async function handleFoundCode(code, type = null) {
    if (window.lastProcessedCode === code) return true;
    window.lastProcessedCode = code;

    $('#status-text').text('Buscando...');

    if (!type) {
        if (code.includes('-')) type = 'yugioh';
        else if (code.includes('/') || /^[A-Z]{2,}\d+/.test(code)) type = 'pokemon';
        else type = 'pokemon';
    }

    const cardData = await fetchCardData(code, type);

    if (cardData) {
        const saved = await saveCard(cardData);
        if (saved) {
            showToast('success', 'Carta Añadida', cardData.name, cardData.image_url);
            setTimeout(() => { window.lastProcessedCode = null; }, 4000);
            return true;
        }
    }

    setTimeout(() => { window.lastProcessedCode = null; }, 2000);
    return false;
}

async function fetchCardData(code, type) {
    try {
        if (type === 'yugioh') {
            const cleanCode = code.toUpperCase().replace(/\s/g, '-').replace(/-{2,}/g, '-');
            let data = null;

            if (/^\d{5,10}$/.test(cleanCode)) {
                const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?id=${cleanCode}`);
                data = await res.json();
            }
            else {
                const setMatch = cleanCode.match(/^([A-Z0-9]{3,6})-([A-Z0-9]{3,8})$/);
                if (setMatch) {
                    const prefix = setMatch[1];
                    const sets = await getYgoSets();
                    const setObj = sets.find(s => s.set_code.toUpperCase() === prefix);
                    if (setObj) {
                        const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?cardset=${encodeURIComponent(setObj.set_name)}`);
                        const fullSetData = await res.json();
                        if (fullSetData.data) {
                            const cardMatch = fullSetData.data.find(c => c.card_sets && c.card_sets.some(s => s.set_code.toUpperCase() === cleanCode));
                            if (cardMatch) {
                                data = { data: [cardMatch] };
                            }
                        }
                    }
                }
            }

            if (!data || !data.data) {
                const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?cardset=${encodeURIComponent(cleanCode)}`);
                data = await res.json();
            }

            if (data && data.data && data.data.length > 0) {
                const card = data.data[0];
                const setInfo = card.card_sets?.find(s => s.set_code.toUpperCase() === cleanCode) || card.card_sets?.[0];

                return {
                    name: card.name,
                    image_url: card.card_images[0].image_url,
                    rarity: setInfo?.set_rarity || '',
                    expansion: setInfo?.set_name || '',
                    type: 'yugioh'
                };
            }
        } else {
            let number, total;
            if (code.includes('/')) {
                [number, total] = code.split('/');
                const query = `number:${number} set.printedTotal:${total}`;
                const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.data && data.data.length > 0) return formatPokemonCard(data.data[0]);
            }

            number = code.includes('/') ? code.split('/')[0] : code;
            const resNum = await fetch(`https://api.pokemontcg.io/v2/cards?q=number:${number}`);
            const dataNum = await resNum.json();
            if (dataNum.data && dataNum.data.length > 0) {
                if (code.includes('/')) {
                    const bestMatch = dataNum.data.find(c => c.set.printedTotal == code.split('/')[1]) || dataNum.data[0];
                    return formatPokemonCard(bestMatch);
                }
                return formatPokemonCard(dataNum.data[0]);
            }

            const langs = ['en', 'es', 'ja'];
            for (const lang of langs) {
                try {
                    const resFb = await fetch(`https://api.tcgdex.net/v2/${lang}/cards/${code.toLowerCase()}`);
                    if (resFb.ok) {
                        const card = await resFb.json();
                        return {
                            name: card.name,
                            image_url: `${card.image}/high.webp`,
                            rarity: card.rarity || '',
                            expansion: card.set.name || '',
                            type: 'pokemon'
                        };
                    }
                } catch (e) {
                    console.warn(`TCGdex search failed for ${lang}:`, e);
                }
            }
        }
    } catch (err) {
        console.error("Fetch Error:", err);
    }
    return null;
}

function formatPokemonCard(card) {
    return {
        name: card.name,
        image_url: card.images.large,
        rarity: card.rarity || '',
        expansion: card.set.name || '',
        type: 'pokemon'
    };
}

async function saveCard(cardData) {
    const targetType = $('#select-target-type').val();
    const destId = $('#select-dest').val();

    if (!destId) return false;

    try {
        if (targetType === 'album') {
            let { data: pages } = await _supabase.from('pages').select('id, page_index').eq('album_id', destId).order('page_index', { ascending: true });
            if (!pages || pages.length === 0) {
                const { data: newPage } = await _supabase.from('pages').insert([{ album_id: destId, page_index: 0 }]).select();
                pages = newPage;
            }

            const { data: allSlots } = await _supabase.from('card_slots').select('page_id, slot_index').in('page_id', pages.map(p => p.id));
            let saved = false;
            for (const page of pages) {
                const occupied = (allSlots || []).filter(s => s.page_id === page.id).map(s => s.slot_index);
                for (let i = 0; i < 9; i++) {
                    if (!occupied.includes(i)) {
                        await _supabase.from('card_slots').insert([{
                            page_id: page.id, slot_index: i, name: cardData.name, image_url: cardData.image_url,
                            rarity: cardData.rarity, expansion: cardData.expansion, condition: 'M', quantity: 1
                        }]);
                        saved = true; break;
                    }
                }
                if (saved) break;
            }

            if (!saved) {
                if (pages.length >= (currentUser.max_pages || 5)) {
                    Swal.fire('Límite alcanzado', `Has alcanzado el límite de ${currentUser.max_pages || 5} páginas en este álbum.`, 'warning');
                    return false;
                }

                const lastIdx = pages[pages.length - 1].page_index;
                const { data: nPage } = await _supabase.from('pages').insert([{ album_id: destId, page_index: lastIdx + 1 }]).select();
                await _supabase.from('card_slots').insert([{
                    page_id: nPage[0].id, slot_index: 0, name: cardData.name, image_url: cardData.image_url,
                    rarity: cardData.rarity, expansion: cardData.expansion, condition: 'M', quantity: 1
                }]);
            }
            return true;
        } else {
            const { count } = await _supabase.from('deck_cards').select('*', { count: 'exact', head: true }).eq('deck_id', destId);
            if (count >= (currentUser.max_cards_per_deck || 60)) {
                Swal.fire('Límite alcanzado', `Este deck ya tiene el máximo de ${currentUser.max_cards_per_deck || 60} cartas permitidas.`, 'warning');
                return false;
            }

            await _supabase.from('deck_cards').insert([{
                deck_id: destId, name: cardData.name, image_url: cardData.image_url,
                rarity: cardData.rarity, expansion: cardData.expansion, quantity: 1
            }]);
            return true;
        }
    } catch (err) {
        console.error("Save Error:", err);
        return false;
    }
}

function showToast(type, title, message, imageUrl = null) {
    const $toast = $('#result-toast');
    $toast.removeClass('success error active');
    $('#toast-title').text(title);
    $('#toast-name').text(message);

    if (imageUrl) {
        $('#toast-img').attr('src', imageUrl).show();
        $('#toast-icon-err').hide();
    } else {
        $('#toast-img').hide();
        $('#toast-icon-err').css('display', 'flex');
    }

    $toast.addClass(type).addClass('active');
    setTimeout(() => $toast.removeClass('active'), 3000);
}
