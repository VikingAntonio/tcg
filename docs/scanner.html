<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <link rel="manifest" href="manifest.json">
    <title>Vikingdev TCG - Gemini Vision Scanner</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #00d2ff;
        }

        body.public-body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 20px;
            padding-bottom: 140px !important;
        }

        .scanner-layout {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 90px;
        }

        #companion-wrapper {
            bottom: 80px !important;
            left: 15px !important;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scanner-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .scanner-header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .destination-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: end;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .custom-select-wrapper {
            display: flex;
            gap: 10px;
        }

        select, input {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
            padding: 12px !important;
            border-radius: 12px !important;
            font-size: 14px !important;
            outline: none !important;
            width: 100%;
        }

        .btn-plus {
            background: var(--accent-color) !important;
            border: none !important;
            color: #000 !important;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .btn-plus:hover { transform: scale(1.05); }

        .viewport-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #file-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 85%;
            height: 85%;
            border: 2px solid var(--accent-color);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
            position: relative;
        }

        .corner-tl { position: absolute; top: -5px; left: -5px; width: 20px; height: 20px; border-top: 4px solid var(--accent-color); border-left: 4px solid var(--accent-color); border-radius: 8px 0 0 0; }
        .corner-tr { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-top: 4px solid var(--accent-color); border-right: 4px solid var(--accent-color); border-radius: 0 8px 0 0; }
        .corner-bl { position: absolute; bottom: -5px; left: -5px; width: 20px; height: 20px; border-bottom: 4px solid var(--accent-color); border-left: 4px solid var(--accent-color); border-radius: 0 0 0 8px; }
        .corner-br { position: absolute; bottom: -5px; right: -5px; width: 20px; height: 20px; border-bottom: 4px solid var(--accent-color); border-right: 4px solid var(--accent-color); border-radius: 0 0 8px 0; }

        .scanning-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
            animation: scan-anim 2s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes scan-anim {
            0% { top: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .scanner-active .scanning-line { opacity: 1; }

        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ff4757;
            display: inline-block;
            margin-right: 10px;
            transition: 0.3s;
        }
        .status-ready .status-dot { background: #2ed573; box-shadow: 0 0 10px #2ed573; }
        .status-working .status-dot {
            background: #ffa500;
            box-shadow: 0 0 10px #ffa500;
            animation: pulse-orange 1s infinite;
        }

        @keyframes pulse-orange {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .btn-main {
            flex: 1;
            min-width: 130px;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary { background: var(--accent-color); color: #000; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-action { background: #2ed573; color: #000; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4); }

        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }

        .back-btn {
            position: fixed;
            top: 25px; left: 25px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 100;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .result-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            transform: translateX(120%);
            background: #2f3136;
            border-left: 4px solid #5865f2;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.24);
            z-index: 2000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            width: 300px;
        }

        .result-toast.active { transform: translateX(0); }
        .result-toast.error { border-left-color: #f04747; }
        .result-toast.success { border-left-color: #43b581; }

        .toast-img-box {
            width: 40px; height: 56px;
            background: #202225;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .scanner-layout { padding-top: 50px; }
            .back-btn { top: 15px; left: 15px; width: 35px; height: 35px; }
            .destination-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="public-body">
    <button class="back-btn" onclick="location.href='admin.html'"><i class="fas fa-arrow-left"></i></button>

    <div class="scanner-layout">
        <div class="scanner-header">
            <h1><i class="fas fa-eye"></i> Gemini Vision Scanner</h1>
            <p style="color: #aaa;">Reconocimiento inteligente de cartas TCG con IA</p>
        </div>

        <div class="glass-panel">
            <div class="destination-grid">
                <div class="form-group">
                    <label>Tipo de Juego</label>
                    <select id="select-game-type">
                        <option value="yugioh">Yu-Gi-Oh!</option>
                        <option value="pokemon">Pokémon</option>
                        <option value="magic">Magic The Gathering</option>
                        <option value="onepiece">One Piece</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Añadir a</label>
                    <select id="select-target-type">
                        <option value="album">Álbum</option>
                        <option value="deck">Deck</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="dest-label">Seleccionar Álbum</label>
                    <div class="custom-select-wrapper">
                        <select id="select-dest"></select>
                        <button class="btn-plus" id="btn-new-dest" title="Crear Nuevo"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="viewport-container" id="scanner-viewport" title="Toca para escanear">
            <video id="video-preview" autoplay playsinline muted></video>
            <img id="file-preview" src="">
            <div class="scan-overlay">
                <div class="scan-frame">
                    <div class="corner-tl"></div>
                    <div class="corner-tr"></div>
                    <div class="corner-bl"></div>
                    <div class="corner-br"></div>
                    <div class="scanning-line"></div>
                </div>
            </div>
        </div>

        <div class="glass-panel status-panel status-ready" id="status-container">
            <div style="display: flex; align-items: center;">
                <span class="status-dot"></span>
                <span id="status-text">Motor Gemini Vision Listo</span>
            </div>
            <div id="detected-code" style="color: var(--accent-color); font-family: monospace; font-size: 0.95rem; font-weight: bold; text-align: right; overflow: hidden; text-overflow: ellipsis; max-width: 200px; white-space: nowrap;"></div>
        </div>

        <div class="controls-row">
            <button id="btn-toggle-scan" class="btn-main btn-primary">
                <i class="fas fa-camera"></i> Cámara
            </button>
            <button id="btn-scan-now" class="btn-main btn-action" style="display: none;">
                <i class="fas fa-bolt"></i> Escanear
            </button>
            <button id="btn-upload" class="btn-main btn-secondary">
                <i class="fas fa-upload"></i> Subir Imagen
            </button>
            <button id="btn-manual" class="btn-main btn-secondary">
                <i class="fas fa-keyboard"></i> Manual
            </button>
        </div>
    </div>

    <input type="file" id="file-upload" accept="image/*" style="display: none;">

    <div class="result-toast" id="result-toast">
        <div class="toast-img-box">
            <img id="toast-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <div id="toast-icon-err" style="display: none; height: 100%; width: 100%; align-items: center; justify-content: center; color: #f04747; font-size: 24px;">
                <i class="fas fa-times-circle"></i>
            </div>
        </div>
        <div style="flex: 1;">
            <div id="toast-title" style="font-weight: 800; font-size: 11px; color: #b9bbbe; text-transform: uppercase; letter-spacing: 0.5px;">Notificación</div>
            <div id="toast-name" style="color: #fff; font-size: 14px; font-weight: 500; margin-top: 2px; line-height: 1.2;">Cargando...</div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
let currentCardType = 'yugioh';
let isScanning = false;
let stream = null;
let currentUser = null;
let isProcessingVision = false;

let ygoSetsCache = null;
async function getYgoSets() {
    if (ygoSetsCache) return ygoSetsCache;
    try {
        const response = await fetch('https://db.ygoprodeck.com/api/v7/cardsets.php');
        ygoSetsCache = await response.json();
    } catch (e) {
        console.warn("Error fetching YGO sets:", e);
        ygoSetsCache = [];
    }
    return ygoSetsCache;
}

$(document).ready(async function() {
    await checkSession();
    await loadInitialData();

    $('#select-game-type').change(function() {
        currentCardType = $(this).val();
    });

    $('#select-target-type').change(function() {
        const type = $(this).val();
        $('#dest-label').text(type === 'album' ? 'Seleccionar Álbum' : 'Seleccionar Deck');
        loadDestinations(type);
    });

    $('#btn-new-dest').click(createNewDestination);

    $('#btn-toggle-scan').click(async function() {
        if (!isScanning) {
            await startCamera();
        } else {
            stopCamera();
        }
    });

    $('#btn-scan-now').click(async function() {
        await captureAndProcessVision();
    });

    $('#scanner-viewport').click(async function() {
        if (isScanning && !isProcessingVision) {
            await captureAndProcessVision();
        }
    });

    $('#btn-upload').click(function() {
        $('#file-upload').click();
    });

    $('#file-upload').change(handleFileUpload);

    $('#btn-manual').click(async function() {
        const { value: input } = await Swal.fire({
            title: 'Entrada Manual',
            input: 'text',
            inputLabel: 'Introduce el código o nombre de la carta',
            inputPlaceholder: 'LOB-001 / Dark Magician',
            showCancelButton: true,
            confirmButtonColor: '#00d2ff',
            background: '#1a1a2e',
            color: '#fff'
        });

        if (input) {
            await handleFoundCode(null, input.trim(), currentCardType);
        }
    });
});

async function checkSession() {
    if (window.location.protocol === 'file:') {
        currentUser = { id: '00000000-0000-0000-0000-000000000001', username: 'admin', role: 'admin', max_albums: 5, max_pages: 5, max_decks: 5, max_cards_per_deck: 60 };
        return;
    }
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
        const { data: user } = await _supabase
            .from('usuarios')
            .select('id, username, email, is_store, role, max_albums, max_pages, max_decks, max_cards_per_deck')
            .eq('id', session.user.id)
            .single();

        if (user) {
            currentUser = user;
        } else {
            window.location.href = 'admin.html';
        }
    } else {
        window.location.href = 'admin.html';
    }
}

async function loadInitialData() {
    await loadDestinations('album');
}

async function loadDestinations(type) {
    if (!currentUser) return;
    const table = type === 'album' ? 'albums' : 'decks';
    const { data, error } = await _supabase
        .from(table)
        .select('*')
        .eq('user_id', currentUser.id)
        .order('id', { ascending: true });

    const $select = $('#select-dest');
    $select.empty();
    if (data && data.length > 0) {
        data.forEach(item => {
            $select.append(`<option value="${item.id}">${item.title || item.name}</option>`);
        });
    } else {
        $select.append(`<option value="">No hay ${type}s</option>`);
    }
}

async function createNewDestination() {
    const type = $('#select-target-type').val();
    const table = type === 'album' ? 'albums' : 'decks';
    const limit = type === 'album' ? (currentUser.max_albums || 3) : (currentUser.max_decks || 1);
    const { count } = await _supabase.from(table).select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);

    if (count >= limit) {
        Swal.fire('Límite alcanzado', `Tu plan actual permite un máximo de ${limit} ${type === 'album' ? 'álbumes' : 'deck'}.`, 'warning');
        return;
    }

    const { value: name } = await Swal.fire({
        title: `Nuevo ${type === 'album' ? 'Álbum' : 'Deck'}`,
        input: 'text',
        inputLabel: `Nombre del ${type}`,
        showCancelButton: true,
        confirmButtonColor: '#00d2ff',
        background: '#1a1a2e',
        color: '#fff'
    });

    if (name) {
        const field = type === 'album' ? 'title' : 'name';
        const { data, error } = await _supabase
            .from(table)
            .insert([{ [field]: name, user_id: currentUser.id }])
            .select();

        if (!error) {
            await loadDestinations(type);
            $('#select-dest').val(data[0].id);
        }
    }
}

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        const video = document.getElementById('video-preview');
        video.srcObject = stream;

        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
            track.applyConstraints({
                advanced: [{ focusMode: 'continuous' }, { exposureMode: 'continuous' }]
            }).catch(e => console.warn("Constraints no soportados:", e));
        }

        video.style.display = 'block';
        $('#file-preview').hide();
        isScanning = true;
        $('#btn-toggle-scan').html('<i class="fas fa-stop"></i> Detener').removeClass('btn-primary').addClass('btn-secondary');
        $('#btn-scan-now').show();
        $('#scanner-viewport').addClass('scanner-active');
        $('#status-text').text('Cámara Lista - Toca para Escanear');
        $('#status-container').removeClass('status-working').addClass('status-ready');
    } catch (err) {
        console.error("Error accessing camera:", err);
        Swal.fire('Error', 'No se pudo acceder a la cámara.', 'error');
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        document.getElementById('video-preview').srcObject = null;
    }
    isScanning = false;
    $('#btn-toggle-scan').html('<i class="fas fa-camera"></i> Cámara').removeClass('btn-secondary').addClass('btn-primary');
    $('#btn-scan-now').hide();
    $('#scanner-viewport').removeClass('scanner-active');
    $('#status-text').text('Motor Gemini Vision Listo');
    $('#status-container').removeClass('status-working').addClass('status-ready');
}

async function captureAndProcessVision() {
    if (isProcessingVision) return;

    const video = document.getElementById('video-preview');
    if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) {
        Swal.fire('Atención', 'Por favor activa la cámara primero o sube una imagen.', 'info');
        return;
    }

    const canvas = document.getElementById('hidden-canvas');
    const origWidth = video.videoWidth || 1280;
    const origHeight = video.videoHeight || 720;
    const maxDim = 640;
    let targetWidth = origWidth;
    let targetHeight = origHeight;

    if (targetWidth > maxDim || targetHeight > maxDim) {
        if (targetWidth > targetHeight) {
            targetHeight = Math.round((targetHeight * maxDim) / targetWidth);
            targetWidth = maxDim;
        } else {
            targetWidth = Math.round((targetWidth * maxDim) / targetHeight);
            targetHeight = maxDim;
        }
    }

    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, targetWidth, targetHeight);

    const base64Data = canvas.toDataURL('image/jpeg', 0.6);
    await processImageWithGeminiVision(base64Data);
}

async function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    stopCamera();

    const reader = new FileReader();
    reader.onload = async function(event) {
        const base64Data = event.target.result;
        $('#file-preview').attr('src', base64Data).show();
        $('#video-preview').hide();
        await processImageWithGeminiVision(base64Data);
    };
    reader.readAsDataURL(file);
}

async function processImageWithGeminiVision(base64Data) {
    if (isProcessingVision) return;
    isProcessingVision = true;

    $('#status-text').text('Analizando con Gemini Vision...');
    $('#status-container').removeClass('status-ready').addClass('status-working');
    $('#detected-code').text('Procesando...');

    try {
        const { data, error } = await _supabase.functions.invoke('spirit-chat', {
            body: {
                is_scan: true,
                image_base64: base64Data,
                image_mime: 'image/jpeg',
                game_type: currentCardType
            }
        });

        if (error) {
            console.error("Error al invocar Gemini Vision:", error);
            $('#status-text').text('Error al conectar con Gemini');
            $('#status-container').removeClass('status-working');
            showToast('error', 'Error', 'No se pudo conectar con Gemini Vision');
            isProcessingVision = false;
            return;
        }

        if (data && data.success && (data.card_name || data.code)) {
            const cardName = data.card_name || 'Carta Desconocida';
            const cardCode = data.code || '';
            const detectedGame = data.game || currentCardType;

            $('#status-text').text('¡Carta Encontrada!');
            $('#status-container').removeClass('status-working').addClass('status-ready');
            $('#detected-code').text(cardCode ? `${cardName} (${cardCode})` : cardName);

            const success = await handleFoundCode(cardCode, cardName, detectedGame, data);
            if (!success) {
                showManualPrompt(cardCode || cardName);
            }
        } else {
            const errMsg = data?.error || 'No se reconoció la carta';
            $('#status-text').text(errMsg);
            $('#status-container').removeClass('status-working');
            $('#detected-code').text('');
            showToast('error', 'No detectado', errMsg);
        }
    } catch (err) {
        console.error("Excepción en Gemini Vision:", err);
        $('#status-text').text('Error en escaneo');
        $('#status-container').removeClass('status-working');
    } finally {
        isProcessingVision = false;
    }
}

async function showManualPrompt(failedIdentifier) {
    const { isConfirmed } = await Swal.fire({
        title: 'Carta no encontrada',
        text: `No encontramos datos para "${failedIdentifier}". ¿Deseas ingresarla o editarla manualmente?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, ingresar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#00d2ff',
        background: '#1a1a2e',
        color: '#fff'
    });

    if (isConfirmed) {
        const { value: manualInput } = await Swal.fire({
            title: 'Corregir Carta',
            input: 'text',
            inputValue: failedIdentifier || '',
            inputLabel: 'Introduce el nombre o código correcto:',
            showCancelButton: true,
            confirmButtonColor: '#00d2ff',
            background: '#1a1a2e',
            color: '#fff'
        });

        if (manualInput) {
            await handleFoundCode(null, manualInput.trim(), currentCardType);
        }
    }
}

async function handleFoundCode(code, name, type = null, visionData = null) {
    const identifier = code || name;
    if (!identifier) return false;

    $('#status-text').text('Buscando detalles...');
    let cardData = await fetchCardData(code, name, type || currentCardType);

    if (!cardData && visionData && visionData.card_name) {
        cardData = {
            name: visionData.card_name,
            image_url: 'https://images.ygoprodeck.com/images/cards/back_high.jpg',
            rarity: visionData.rarity || '',
            expansion: visionData.expansion || '',
            type: visionData.game || currentCardType
        };
    }

    if (cardData) {
        const saved = await saveCard(cardData);
        if (saved) {
            showToast('success', 'Carta Añadida', cardData.name, cardData.image_url);
            $('#status-text').text('¡Guardado con éxito!');
            return true;
        }
    }
    return false;
}

async function fetchCardData(code, name, type) {
    try {
        if (type === 'yugioh') {
            let data = null;
            const cleanCode = code ? code.toUpperCase().replace(/\s/g, '-').replace(/-{2,}/g, '-') : null;
            if (cleanCode && /^\d{5,10}$/.test(cleanCode)) {
                const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?id=${cleanCode}`);
                data = await res.json();
            } else if (cleanCode) {
                const setMatch = cleanCode.match(/^([A-Z0-9]{3,6})-([A-Z0-9]{3,8})$/);
                if (setMatch) {
                    const prefix = setMatch[1];
                    const sets = await getYgoSets();
                    const setObj = sets.find(s => s.set_code.toUpperCase() === prefix);
                    if (setObj) {
                        const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?cardset=${encodeURIComponent(setObj.set_name)}`);
                        const fullSetData = await res.json();
                        if (fullSetData.data) {
                            const cardMatch = fullSetData.data.find(c => c.card_sets && c.card_sets.some(s => s.set_code.toUpperCase() === cleanCode));
                            if (cardMatch) data = { data: [cardMatch] };
                        }
                    }
                }
            }
            if (cleanCode && (!data || !data.data)) { const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?cardset=${encodeURIComponent(cleanCode)}`); data = await res.json(); }
            if (name && (!data || !data.data)) { const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(name)}`); data = await res.json(); }
            if (data && data.data && data.data.length > 0) {
                const card = data.data[0], setInfo = card.card_sets?.find(s => s.set_code.toUpperCase() === cleanCode) || card.card_sets?.[0];
                return { name: card.name, image_url: card.card_images[0].image_url, rarity: setInfo?.set_rarity || '', expansion: setInfo?.set_name || '', type: 'yugioh' };
            }
        } else {
            if (code) {
                let number, total;
                if (code.includes('/')) {
                    [number, total] = code.split('/');
                    const query = `number:${number} set.printedTotal:${total}`;
                    const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    if (data.data && data.data.length > 0) return formatPokemonCard(data.data[0]);
                }
                number = code.includes('/') ? code.split('/')[0] : code;
                const resNum = await fetch(`https://api.pokemontcg.io/v2/cards?q=number:${number}`);
                const dataNum = await resNum.json();
                if (dataNum.data && dataNum.data.length > 0) {
                    if (code.includes('/')) { const bestMatch = dataNum.data.find(c => c.set.printedTotal == code.split('/')[1]) || dataNum.data[0]; return formatPokemonCard(bestMatch); }
                    return formatPokemonCard(dataNum.data[0]);
                }
            }
            if (name) { const resName = await fetch(`https://api.pokemontcg.io/v2/cards?q=name:"${encodeURIComponent(name)}"`); const dataName = await resName.json(); if (dataName.data && dataName.data.length > 0) return formatPokemonCard(dataName.data[0]); }
            const langs = ['en', 'es', 'ja'];
            for (const lang of langs) {
                try {
                    const resFb = await fetch(`https://api.tcgdex.net/v2/${lang}/cards/${code.toLowerCase()}`);
                    if (resFb.ok) { const card = await resFb.json(); return { name: card.name, image_url: `${card.image}/high.webp`, rarity: card.rarity || '', expansion: card.set.name || '', type: 'pokemon' }; }
                } catch (e) {}
            }
        }
    } catch (err) {}
    return null;
}

function formatPokemonCard(card) { return { name: card.name, image_url: card.images.large, rarity: card.rarity || '', expansion: card.set.name || '', type: 'pokemon' }; }

async function saveCard(cardData) {
    const targetType = $('#select-target-type').val(), destId = $('#select-dest').val();
    if (!destId) return false;
    try {
        if (targetType === 'album') {
            let { data: pages } = await _supabase.from('pages').select('id, page_index').eq('album_id', destId).order('page_index', { ascending: true });
            if (!pages || pages.length === 0) { const { data: newPage } = await _supabase.from('pages').insert([{ album_id: destId, page_index: 0 }]).select(); pages = newPage; }
            const { data: allSlots } = await _supabase.from('card_slots').select('page_id, slot_index').in('page_id', pages.map(p => p.id));
            let saved = false;
            for (const page of pages) {
                const occupied = (allSlots || []).filter(s => s.page_id === page.id).map(s => s.slot_index);
                for (let i = 0; i < 9; i++) {
                    if (!occupied.includes(i)) {
                        await _supabase.from('card_slots').insert([{ page_id: page.id, slot_index: i, name: cardData.name, image_url: cardData.image_url, rarity: cardData.rarity, expansion: cardData.expansion, condition: 'M', quantity: 1 }]);
                        saved = true; break;
                    }
                }
                if (saved) break;
            }
            if (!saved) {
                if (pages.length >= (currentUser.max_pages || 5)) { Swal.fire('Límite alcanzado', `Has alcanzado el límite de ${currentUser.max_pages || 5} páginas en este álbum.`, 'warning'); return false; }
                const lastIdx = pages[pages.length - 1].page_index;
                const { data: nPage } = await _supabase.from('pages').insert([{ album_id: destId, page_index: lastIdx + 1 }]).select();
                await _supabase.from('card_slots').insert([{ page_id: nPage[0].id, slot_index: 0, name: cardData.name, image_url: cardData.image_url, rarity: cardData.rarity, expansion: cardData.expansion, condition: 'M', quantity: 1 }]);
            }
            return true;
        } else {
            const { count } = await _supabase.from('deck_cards').select('*', { count: 'exact', head: true }).eq('deck_id', destId);
            if (count >= (currentUser.max_cards_per_deck || 60)) { Swal.fire('Límite alcanzado', `Este deck ya tiene el máximo de ${currentUser.max_cards_per_deck || 60} cartas permitidas.`, 'warning'); return false; }
            await _supabase.from('deck_cards').insert([{ deck_id: destId, name: cardData.name, image_url: cardData.image_url, rarity: cardData.rarity, expansion: cardData.expansion, quantity: 1 }]);
            return true;
        }
    } catch (err) { return false; }
}

function showToast(type, title, message, imageUrl = null) {
    const $toast = $('#result-toast'); $toast.removeClass('success error active');
    $('#toast-title').text(title); $('#toast-name').text(message);
    if (imageUrl) { $('#toast-img').attr('src', imageUrl).show(); $('#toast-icon-err').hide(); }
    else { $('#toast-img').hide(); $('#toast-icon-err').css('display', 'flex'); }
    $toast.addClass(type).addClass('active'); setTimeout(() => $toast.removeClass('active'), 3000);
}
