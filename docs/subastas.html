<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Gestión de Subastas - Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/subastas_v2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="admin-body">
    <!-- Polished Navigation Bar -->
    <nav class="auction-nav">
        <div class="nav-content">
            <a href="admin.html" class="btn-back-styled">
                <i class="fas fa-arrow-left"></i>
                <span>Volver al Panel</span>
            </a>
            <div class="nav-title-group">
                <h1>Panel de <span class="highlight">Subastas</span></h1>
            </div>
            <div style="width: 140px;"></div> <!-- Spacer to center title -->
        </div>
    </nav>

    <div class="management-wrapper">
        <!-- New Visual Helper for Upload -->
        <div class="upload-hero">
            <div class="main-drop-zone" id="main-drop-zone-auction">
                <div class="drop-zone-inner">
                    <div class="upload-icon-wrapper">
                        <i class="fas fa-images"></i>
                        <i class="fas fa-plus mini-plus"></i>
                    </div>
                    <h2>Subida Masiva de Artículos</h2>
                    <p>Arrastra tus fotos aquí o haz clic para seleccionarlas</p>
                    <span class="upload-hint">Puedes subir hasta 60 imágenes simultáneas</span>
                </div>
                <input type="file" id="input-auction-files-bulk" accept="image/*" multiple style="display: none;">
            </div>
        </div>

        <!-- Bulk Actions Toolbar -->
        <div id="bulk-actions-toolbar" class="bulk-toolbar" style="display: none;">
            <div class="bulk-info">
                <i class="fas fa-layer-group"></i>
                <span id="draft-count">0</span> borradores por configurar
            </div>
            <div class="bulk-controls">
                <div class="bulk-input-row">
                    <div class="bulk-group">
                        <label>Puja Base</label>
                        <input type="number" id="bulk-start-bid" value="1" min="1">
                    </div>
                    <div class="bulk-group">
                        <label>Saltos</label>
                        <select id="bulk-inc-type">
                            <option value="free">Libres</option>
                            <option value="fixed_5">$5</option>
                            <option value="fixed_10">$10</option>
                            <option value="fixed_20">$20</option>
                        </select>
                    </div>
                    <div class="bulk-group">
                        <label>Duración</label>
                        <select id="bulk-duration">
                            <option value="24">24 Horas</option>
                            <option value="48">48 Horas</option>
                            <option value="72">3 Días</option>
                            <option value="168">7 Días</option>
                        </select>
                    </div>
                </div>
                <div class="bulk-buttons">
                    <button id="btn-apply-bulk" class="btn-bulk-secondary">Aplicar a Todo</button>
                    <button id="btn-save-all-drafts" class="btn-bulk-primary">
                        <i class="fas fa-rocket"></i> Publicar Catálogo
                    </button>
                </div>
            </div>
        </div>

        <!-- Drafts List -->
        <div id="auction-drafts-list" class="drafts-grid">
            <!-- Draft cards -->
        </div>

        <div class="section-header-styled">
            <i class="fas fa-gavel"></i>
            <span>Tus Subastas Activas</span>
            <div class="line"></div>
        </div>

        <div id="live-auction-list" class="my-auctions-grid">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i> Cargando...
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/subastas_v2.js"></script>
</body>
</html>
