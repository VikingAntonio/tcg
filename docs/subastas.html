<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Configurar Subastas - Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/subastas_v2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        /* Surgical fix for the Giant Logo and layout */
        body.admin-body { background: #000; color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .back-btn-container { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .management-wrapper { max-width: 1100px; margin: 0 auto; padding: 80px 20px 40px; }
        .form-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .drop-zone-mini { height: 100px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .drop-zone-mini:hover { border-color: var(--primary-color); background: rgba(255,255,255,0.05); }
        .auctions-list-title { margin: 40px 0 20px; font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 50px; text-transform: uppercase; font-weight: 800; }
        .status-pill.active { background: #2ecc71; color: #000; }
        .status-pill.ended { background: #555; color: #fff; }
    </style>
</head>
<body class="admin-body">
    <div class="back-btn-container">
        <a href="admin.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
    </div>

    <div class="management-wrapper">
        <div class="admin-header" style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; font-weight: 900; letter-spacing: -1px;">Gestión de <span style="color: var(--primary-color);">Subastas</span></h1>
            <p style="opacity: 0.7;">Crea artículos y deja que el sistema gestione las pujas y ganadores por ti.</p>
        </div>

        <!-- Single Form for Creation -->
        <div class="form-card">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem;"><i class="fas fa-magic"></i> Nueva Subasta Automática</h2>
            <div class="form-grid">
                <div class="form-group" style="grid-column: span 2;">
                    <label>Nombre del Producto</label>
                    <input type="text" id="live-input-nombre" placeholder="Ej: Pikachu Illustrator PSA 10">
                </div>
                <div class="form-group">
                    <label>Puja Inicial ($)</label>
                    <input type="number" id="live-input-start-bid" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Incrementos</label>
                    <select id="live-input-inc-type">
                        <option value="free">Libre (Cualquier monto)</option>
                        <option value="fixed_5">Fijos de $5</option>
                        <option value="fixed_10">Fijos de $10</option>
                        <option value="fixed_20">Fijos de $20</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Imagen</label>
                    <div class="drop-zone-mini" id="drop-zone-auction">
                        <i class="fas fa-camera fa-lg"></i>
                        <span id="file-name-display" style="font-size: 10px; margin-top: 5px;">Arrastra o pulsa aquí</span>
                        <input type="file" id="input-auction-file" accept="image/*" style="display: none;">
                    </div>
                    <input type="hidden" id="live-input-image">
                </div>
                <div class="form-group">
                    <label>Inicia el</label>
                    <input type="datetime-local" id="live-input-start-date">
                </div>
                <div class="form-group">
                    <label>Termina el</label>
                    <input type="datetime-local" id="live-input-end-date">
                </div>
            </div>

            <div class="form-group">
                <label>Reglas / Descripción corta</label>
                <textarea id="live-input-description" rows="2" placeholder="Estado de la carta, costo de envío, etc."></textarea>
            </div>

            <button id="btn-save-live" class="btn" style="width: 100%; margin-top: 10px; height: 50px; font-size: 1.1rem;">
                <i class="fas fa-rocket"></i> Publicar en mi Tienda
            </button>
            <input type="hidden" id="live-edit-id">
        </div>

        <h2 class="auctions-list-title"><i class="fas fa-history"></i> Mis Subastas Publicadas</h2>
        <div id="live-auction-list" class="my-auctions-grid">
            <!-- Auctions loaded via JS -->
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/subastas_v2.js"></script>
</body>
</html>
