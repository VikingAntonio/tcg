<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Configurar Subastas - Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/subastas_v2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="admin-body">
    <div class="back-btn-container">
        <a href="admin.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
    </div>

    <div class="management-wrapper">
        <div class="admin-header" style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; font-weight: 900; letter-spacing: -1px;">Gestión de <span style="color: var(--primary-color);">Subastas</span></h1>
            <p style="opacity: 0.7;">Carga tus imágenes y configura subastas masivas de forma rápida y sencilla.</p>
        </div>

        <!-- Primary Drop Zone -->
        <div class="main-drop-zone" id="main-drop-zone-auction">
            <div class="drop-zone-content">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
                <h2>Cargar Imágenes</h2>
                <p>Arrastra varias imágenes aquí o haz clic para seleccionar (puedes subir hasta 60 a la vez)</p>
                <input type="file" id="input-auction-files-bulk" accept="image/*" multiple style="display: none;">
            </div>
        </div>

        <!-- Bulk Actions Toolbar (Hidden until drafts exist) -->
        <div id="bulk-actions-toolbar" class="bulk-toolbar" style="display: none;">
            <div class="bulk-toolbar-info">
                <span id="draft-count">0</span> borradores listos
            </div>
            <div class="bulk-toolbar-controls">
                <div class="bulk-control-group">
                    <label>Puja Inicial ($)</label>
                    <input type="number" id="bulk-start-bid" value="1" min="1">
                </div>
                <div class="bulk-control-group">
                    <label>Incrementos</label>
                    <select id="bulk-inc-type">
                        <option value="free">Libre</option>
                        <option value="fixed_5">$5</option>
                        <option value="fixed_10">$10</option>
                        <option value="fixed_20">$20</option>
                    </select>
                </div>
                <div class="bulk-control-group">
                    <label>Duración</label>
                    <select id="bulk-duration">
                        <option value="24">24 Horas</option>
                        <option value="48">48 Horas</option>
                        <option value="72">3 Días</option>
                        <option value="168">7 Días</option>
                    </select>
                </div>
                <button id="btn-apply-bulk" class="btn btn-secondary btn-sm">Aplicar a Todo</button>
                <button id="btn-save-all-drafts" class="btn btn-primary"><i class="fas fa-rocket"></i> Publicar Todo</button>
            </div>
        </div>

        <!-- Drafts List -->
        <div id="auction-drafts-list" class="drafts-grid">
            <!-- Draft cards will appear here -->
        </div>

        <div class="section-divider">
            <span>Subastas Activas</span>
        </div>

        <div id="live-auction-list" class="my-auctions-grid">
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/subastas_v2.js"></script>
</body>
</html>
