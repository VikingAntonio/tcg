<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Personalizador de Tienda</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        :root {
            --custom-accent: #00d2ff;
            --custom-border: rgba(255, 255, 255, 0.12);
        }

        body {
            display: block !important;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-color);
        }

        /* Top Bar Floating Control Strip */
        .custom-top-controls {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-text-nav {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: var(--nm-shadow);
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .btn-text-nav:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .segmented-group {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 4px;
            box-shadow: var(--nm-shadow);
            gap: 3px;
        }

        .btn-segment {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-segment.active {
            background: var(--primary-color);
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        body.theme-light .btn-segment.active {
            color: #ffffff;
        }

        .btn-action-save-text {
            background: linear-gradient(135deg, #00d2ff, #00ff88);
            color: #0b0f19;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-action-save-text:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        .btn-action-reset-text {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-action-reset-text:hover {
            background: rgba(255, 71, 87, 0.25);
            border-color: #ff4757;
        }

        /* Compact Collapsible Sidebar for Global Styles */
        .compact-global-sidebar {
            position: fixed;
            top: 90px;
            left: 25px;
            width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--nm-shadow);
            padding: 16px;
            z-index: 9999;
            box-sizing: border-box;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }

        .compact-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .compact-sidebar-title {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--primary-color);
        }

        .compact-field-group {
            margin-bottom: 10px;
        }

        .compact-field-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .compact-color-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compact-color-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            background: none;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            flex-shrink: 0;
        }

        .compact-color-input::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .compact-color-input::-webkit-color-swatch {
            border: none;
            border-radius: 7px;
        }

        .compact-text-input {
            width: 100%;
            background: var(--slot-bg);
            border: 1px solid var(--slot-border);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }

        .compact-select-input {
            width: 100%;
            background: var(--slot-bg);
            border: 1px solid var(--slot-border);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Canvas Stage / Grid Workspace */
        .custom-workspace-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .custom-viewport-frame {
            width: 100%;
            max-width: 1200px;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        /* Mobile Viewport Simulation */
        .custom-viewport-frame.mode-mobile {
            max-width: 420px;
            background: var(--bg-color);
            border-radius: 40px;
            padding: 30px 14px 40px 14px;
            border: 8px solid #2d3436;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.15);
            position: relative;
        }

        .custom-viewport-frame.mode-mobile::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 14px;
            background: #2d3436;
            border-radius: 20px;
            z-index: 50;
        }

        /* Actual Tile Grid exactly matching admin.html / style.css */
        .custom-viewport-frame .tile-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(140px, auto);
            grid-auto-flow: dense;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .custom-viewport-frame.mode-mobile .tile-grid {
            grid-template-columns: repeat(2, 1fr) !important;
            grid-auto-rows: minmax(120px, auto) !important;
            gap: 12px !important;
            padding: 10px !important;
        }

        /* Tile Slots in Editor */
        .custom-viewport-frame .tile {
            position: relative;
            cursor: pointer;
            user-select: none;
            overflow: visible; /* Stickers can protrude visually while editing */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .custom-viewport-frame .tile.slot-selected {
            outline: 3px solid #ffcc00 !important;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.5) !important;
        }

        .custom-viewport-frame .tile.is-dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .custom-viewport-frame .tile.drag-over {
            outline: 2px dashed #00ff88 !important;
            background: rgba(0, 255, 136, 0.1) !important;
        }

        /* Protected Text Zone */
        .slot-protected-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 65%;
            border: 1px dashed rgba(255, 204, 0, 0.45);
            border-radius: 12px;
            pointer-events: none;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background: rgba(255, 204, 0, 0.05);
        }

        .custom-viewport-frame .tile.slot-selected .slot-protected-zone {
            display: flex;
        }

        .slot-protected-zone-tag {
            position: absolute;
            bottom: -15px;
            font-size: 8px;
            font-weight: 800;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.75);
            padding: 1px 5px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* Sizing Handles on Borders (Yellow dots) */
        .slot-resize-dot {
            position: absolute;
            background: #ffcc00;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            border: 2px solid #000;
            z-index: 30;
            display: none;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        }

        .custom-viewport-frame .tile.slot-selected .slot-resize-dot {
            display: block;
        }

        .slot-resize-dot.dot-right {
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }

        .slot-resize-dot.dot-bottom {
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            cursor: ns-resize;
        }

        .slot-resize-dot.dot-corner {
            right: -7px;
            bottom: -7px;
            cursor: nwse-resize;
        }

        /* Stickers Layer */
        .slot-stickers-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .sticker-item {
            position: absolute;
            cursor: move;
            pointer-events: auto;
            user-select: none;
            transform-origin: center center;
        }

        .sticker-item.sticker-selected {
            outline: 2px dashed #00d2ff;
        }

        .sticker-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Individual Slot Editor Modal */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 30000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .custom-modal-overlay.active {
            display: flex;
        }

        .custom-modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 90%;
            max-width: 580px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: var(--text-color);
        }

        .custom-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .custom-modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-color);
        }

        .btn-modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .btn-modal-close:hover {
            color: #ff4757;
        }

        .modal-section-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        /* Stickers Manager inside Modal */
        .stickers-library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
            max-height: 160px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 16px;
        }

        .sticker-lib-item {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sticker-lib-item:hover {
            border-color: var(--primary-color);
            transform: scale(1.08);
            background: rgba(0, 210, 255, 0.1);
        }

        .sticker-lib-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .slot-stickers-manager-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .sticker-manager-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 8px;
            gap: 10px;
        }

        .sticker-row-preview {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .sticker-row-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .btn-delete-sticker {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff4757;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
        }

        .btn-delete-sticker:hover {
            background: #ff4757;
            color: #fff;
        }

        @media (max-width: 768px) {
            .compact-global-sidebar {
                position: static;
                width: 100%;
                margin-bottom: 20px;
            }
            .custom-top-controls {
                position: static;
                margin: 20px auto 10px auto;
                justify-content: center;
            }
            .custom-workspace-container {
                padding-top: 20px;
            }
        }
    </style>
</head>
<body class="theme-dark">

    <!-- Standard Floating Top Header (Pill Panel) matching project architecture -->
    <div class="top-left-panel" id="top-panel">
        <div class="pill-panel">
            <div class="pill-group" id="header-theme-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light" title="Modo Claro"><i class="fas fa-sun"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple" title="Modo Morado"><i class="fas fa-magic"></i></button>
                <button class="pill-icon theme-btn-small active" data-theme="theme-dark" title="Modo Oscuro"><i class="fas fa-moon"></i></button>
            </div>

            <a href="carrito.html" id="cart-btn" class="pill-icon" title="Carrito">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </a>

            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn" title="Usuario">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info">
                        <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                        <div class="user-dropdown-role" id="dropdown-user-role" style="display: none;">Admin</div>
                    </div>
                    <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> Mi Panel</a>
                    <a href="custom.html" class="menu-item"><i class="fas fa-paint-brush"></i> Personalizar Tienda</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Top Action Strip (Strict Plain Text Buttons, No Emojis, No Icons) -->
    <div class="custom-top-controls">
        <a href="admin.html" class="btn-text-nav" id="btn-back-admin">Volver al Panel</a>

        <!-- Target View Switcher -->
        <div class="segmented-group">
            <button class="btn-segment active" id="btn-target-admin" data-target="admin">Panel Admin</button>
            <button class="btn-segment" id="btn-target-public" data-target="public">Tienda Pública</button>
        </div>

        <!-- Device Switcher -->
        <div class="segmented-group">
            <button class="btn-segment active" id="btn-device-pc" data-device="pc">PC</button>
            <button class="btn-segment" id="btn-device-mobile" data-device="mobile">Celular</button>
        </div>

        <button class="btn-action-reset-text" id="btn-reset-all">Restablecer</button>
        <button class="btn-action-save-text" id="btn-save-all">Guardar Cambios</button>
    </div>

    <!-- Compact Floating Global Styles Panel (Only 4 properties: border color, bg color, text color, typography) -->

        <div class="compact-sidebar-header">
            <span class="compact-sidebar-title">Estilos Globales</span>
            <button id="btn-toggle-sidebar" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px;">Minimizar</button>
        </div>

        <div id="sidebar-controls-body">
            <div class="compact-field-group">
                <label>Color de Fondo</label>

                    <input type="color" id="global-bg-color" class="compact-color-input" value="#1e272e">
                    <input type="text" id="global-bg-text" class="compact-text-input" value="#1e272e">

            <div class="compact-field-group">

            </div>

            <div class="compact-field-group">

                <div class="compact-color-row">
                    <input type="color" id="global-text-color" class="compact-color-input" value="#f5f6fa">
                    <input type="text" id="global-text-color-val" class="compact-text-input" value="#f5f6fa">
                </div>

            <div class="compact-field-group">

    <!-- Main Grid Workspace -->

            <div class="compact-field-group">
                <label>Color de Fondo</label>

                    <input type="color" id="slot-bg-color" class="compact-color-input" value="#1e272e">
                    <input type="text" id="slot-bg-text" class="compact-text-input" value="#1e272e">
                </div>
            </div>

            <div class="compact-field-group">
                <label>Color de Borde</label>
                <div class="compact-color-row">
                    <input type="color" id="slot-border-color" class="compact-color-input" value="#00d2ff">
                    <input type="text" id="slot-border-text" class="compact-text-input" value="#00d2ff">
                </div>
            </div>

            <div class="compact-field-group">

                <div class="compact-color-row">
                    <input type="color" id="slot-text-color" class="compact-color-input" value="#f5f6fa">
                    <input type="text" id="slot-text-color-val" class="compact-text-input" value="#f5f6fa">

            <div class="compact-field-group">

                <select id="slot-font-family" class="compact-select-input">

                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Roboto', sans-serif">Roboto</option>

                    <option value="'Cinzel', serif">Cinzel</option>

            <div style="display: flex; gap: 10px; margin-top: 20px; border-top: 1px solid var(--card-border); padding-top: 15px;">
                <button class="btn-action-reset-text" id="btn-reset-slot-to-global" style="flex: 1;">Restablecer a Global</button>

            </div>
