<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Personalizador de Tienda</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        :root {
            --custom-accent: #00d2ff;
            --custom-border: rgba(255, 255, 255, 0.12);
        }

        body {
            display: block !important;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-color);
        }

        /* Top Bar Floating Control Strip */
        .custom-top-controls {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-text-nav {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: var(--nm-shadow);
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .btn-text-nav:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .segmented-group {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 4px;
            box-shadow: var(--nm-shadow);
            gap: 3px;
        }

        .btn-segment {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-segment.active {
            background: var(--primary-color);
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        body.theme-light .btn-segment.active {
            color: #ffffff;
        }

        .btn-action-save-text {
            background: linear-gradient(135deg, #00d2ff, #00ff88);
            color: #0b0f19;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-action-save-text:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        .btn-action-reset-text {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-action-reset-text:hover {
            background: rgba(255, 71, 87, 0.25);
            border-color: #ff4757;
        }

        /* Compact Collapsible Sidebar for Global Styles */
        .compact-global-sidebar {
            position: fixed;
            top: 90px;
            left: 25px;
            width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--nm-shadow);
            padding: 16px;
            z-index: 9999;
            box-sizing: border-box;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }

        .compact-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .compact-sidebar-title {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--primary-color);
        }

        .compact-field-group {
            margin-bottom: 10px;
        }

        .compact-field-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* Clean Swatch Styling */
        .swatch-btn {
            position: relative;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            vertical-align: middle;
        }

        .swatch-btn.swatch-fill {
            background-color: #1e272e;
            border: 1px solid var(--card-border);
        }

        .swatch-btn.swatch-outline {
            background-color: transparent !important;
            border: 3px solid #00d2ff;
        }

        .swatch-btn input[type="color"] {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 60px;
            height: 60px;
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .compact-select-input {
            width: 100%;
            background: var(--slot-bg);
            border: 1px solid var(--slot-border);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Canvas Stage / Grid Workspace */
        .custom-workspace-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 80px 290px; /* Offset for left floating global sidebar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .custom-viewport-frame {
            width: 100%;
            max-width: 1200px;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        /* Mobile Viewport Simulation */
        .custom-viewport-frame.mode-mobile {
            max-width: 420px;
            background: var(--bg-color);
            border-radius: 40px;
            padding: 30px 14px 40px 14px;
            border: 8px solid #2d3436;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.15);
            position: relative;
        }

        .custom-viewport-frame.mode-mobile::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 14px;
            background: #2d3436;
            border-radius: 20px;
            z-index: 50;
        }

        /* Actual Tile Grid exactly matching admin.html / style.css */
        .custom-viewport-frame .tile-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(140px, auto);
            grid-auto-flow: dense;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .custom-viewport-frame.mode-mobile .tile-grid {
            grid-template-columns: repeat(2, 1fr) !important;
            grid-auto-rows: minmax(120px, auto) !important;
            gap: 12px !important;
            padding: 10px !important;
        }

        /* Tile Slots in Editor - Clean layout without icons */
        .custom-viewport-frame .tile {
            position: relative;
            cursor: pointer;
            user-select: none;
            overflow: visible; /* Stickers can protrude while editing */
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Remove yellow outline on selection */
        .custom-viewport-frame .tile.slot-selected {
            outline: none !important;
        }

        .custom-viewport-frame .tile.is-dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .custom-viewport-frame .tile.drag-over {
            outline: 2px dashed #00ff88 !important;
            background: rgba(0, 255, 136, 0.1) !important;
        }

        /* Slot Content Wrapper */
        .slot-content-wrapper {
            position: relative;
            z-index: 15; /* Above stickers layer */
            pointer-events: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .slot-title-text {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* Tight Protected Text Zone: Minimal 1px margin around slot text */
        .slot-protected-zone {
            position: absolute;
            top: -2px;
            bottom: -2px;
            left: -3px;
            right: -3px;
            border: 1px dashed rgba(255, 204, 0, 0.6);
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 18;
            background: rgba(255, 204, 0, 0.04);
        }

        .custom-viewport-frame .tile.slot-selected .slot-protected-zone {
            display: block;
        }

        .slot-protected-zone-tag {
            position: absolute;
            bottom: -13px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            font-weight: 800;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.85);
            padding: 0 4px;
            border-radius: 3px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* 8 Sizing Handles (Yellow dots: 4 corners + 4 midpoints) */
        .slot-resize-dot {
            position: absolute;
            background: #ffcc00;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            border: 2px solid #000;
            z-index: 35;
            display: none;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
        }

        .custom-viewport-frame .tile.slot-selected .slot-resize-dot {
            display: block;
        }

        .slot-resize-dot.dot-n  { top: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .slot-resize-dot.dot-s  { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .slot-resize-dot.dot-w  { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .slot-resize-dot.dot-e  { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .slot-resize-dot.dot-nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .slot-resize-dot.dot-ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .slot-resize-dot.dot-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .slot-resize-dot.dot-se { bottom: -6px; right: -6px; cursor: nwse-resize; }

        /* Floating 'Personalizar' button attached to selected slot */
        .btn-floating-customize {
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00d2ff, #0077ff);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.4);
            z-index: 40;
            display: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-floating-customize:hover {
            transform: translateX(-50%) scale(1.05);
            background: linear-gradient(135deg, #00ff88, #00d2ff);
            color: #0b0f19;
        }

        .custom-viewport-frame .tile.slot-selected .btn-floating-customize {
            display: block;
        }

        /* Stickers Layer (Positioned behind text, z-index: 10) */
        .slot-stickers-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .sticker-item {
            position: absolute;
            cursor: move;
            pointer-events: auto;
            user-select: none;
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Active In-Slot Sticker Direct Controls */
        .sticker-item.active-sticker {
            outline: 1.5px dashed #00d2ff;
        }

        .stk-handle {
            position: absolute;
            width: 9px;
            height: 9px;
            background: #00d2ff;
            border: 1px solid #000;
            border-radius: 50%;
            display: none;
            z-index: 25;
            box-sizing: border-box;
        }

        .sticker-item.active-sticker .stk-handle {
            display: block;
        }

        .stk-handle.stk-scale-handle {
            right: -5px;
            bottom: -5px;
            cursor: se-resize;
        }

        .stk-handle.stk-rotate-handle {
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffcc00;
            cursor: grab;
            border-radius: 3px;
            width: 8px;
            height: 8px;
        }

        .stk-btn-del {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 16px;
            height: 16px;
            background: #ff4757;
            color: #fff;
            border-radius: 50%;
            border: 1px solid #000;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
            z-index: 26;
        }

        .sticker-item.active-sticker .stk-btn-del {
            display: flex;
        }

        /* Clean Single-Row Unit Customization Bar */
        .unit-custom-bar-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20000;
            display: none;
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 8px 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 210, 255, 0.2);
            backdrop-filter: blur(20px);
            align-items: center;
            gap: 14px;
            max-width: 95vw;
            box-sizing: border-box;
        }

        .unit-custom-bar-overlay.active {
            display: flex;
        }

        .unit-bar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .unit-bar-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .unit-bar-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .unit-bar-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .unit-bar-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .unit-bar-btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .unit-bar-btn-close:hover {
            color: #ff4757;
        }

        /* Stickers Mini Tray Popup */
        .stickers-picker-popup {
            position: absolute;
            bottom: 55px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(5, 42px);
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 20005;
        }

        .stickers-picker-popup.active {
            display: grid;
        }

        .picker-sticker-item {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.15s;
        }

        .picker-sticker-item:hover {
            transform: scale(1.15);
            border-color: var(--primary-color);
        }

        .picker-sticker-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .compact-global-sidebar {
                position: static;
                width: 100%;
                margin-bottom: 20px;
            }
            .custom-top-controls {
                position: static;
                margin: 20px auto 10px auto;
                justify-content: center;
            }
            .custom-workspace-container {
                padding-top: 20px;
            }
            .unit-custom-bar-overlay {
                flex-wrap: wrap;
                border-radius: 20px;
                bottom: 15px;
                padding: 10px;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="theme-dark">

    <!-- Standard Floating Top Header (Pill Panel) matching project architecture -->
    <div class="top-left-panel" id="top-panel">
        <div class="pill-panel">
            <div class="pill-group" id="header-theme-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light" title="Modo Claro"><i class="fas fa-sun"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple" title="Modo Morado"><i class="fas fa-magic"></i></button>
                <button class="pill-icon theme-btn-small active" data-theme="theme-dark" title="Modo Oscuro"><i class="fas fa-moon"></i></button>
            </div>

            <a href="carrito.html" id="cart-btn" class="pill-icon" title="Carrito">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </a>

            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn" title="Usuario">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info">
                        <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                        <div class="user-dropdown-role" id="dropdown-user-role" style="display: none;">Admin</div>
                    </div>
                    <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> Mi Panel</a>
                    <a href="custom.html" class="menu-item"><i class="fas fa-paint-brush"></i> Personalizar Tienda</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Top Action Strip (Strict Plain Text Buttons, No Emojis, No Icons) -->
    <div class="custom-top-controls">
        <a href="admin.html" class="btn-text-nav" id="btn-back-admin">Volver al Panel</a>

        <!-- Target View Switcher -->
        <div class="segmented-group">
            <button class="btn-segment active" id="btn-target-admin" data-target="admin">Panel Admin</button>
            <button class="btn-segment" id="btn-target-public" data-target="public">Tienda Pública</button>
        </div>

        <!-- Device Switcher -->
        <div class="segmented-group">
            <button class="btn-segment active" id="btn-device-pc" data-device="pc">PC</button>
            <button class="btn-segment" id="btn-device-mobile" data-device="mobile">Celular</button>
        </div>

        <button class="btn-action-reset-text" id="btn-reset-all">Restablecer</button>
        <button class="btn-action-save-text" id="btn-save-all">Guardar Cambios</button>
    </div>

    <!-- Compact Floating Global Styles Panel (Only 4 properties: Fondo, Borde, Letra, Tipografía) -->
    <aside class="compact-global-sidebar" id="compact-global-sidebar">
        <div class="compact-sidebar-header">
            <span class="compact-sidebar-title">Estilos Globales</span>
            <button id="btn-toggle-sidebar" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px;">Minimizar</button>
        </div>

        <div id="sidebar-controls-body">
            <div class="compact-field-group">
                <label>Fondo</label>
                <div class="swatch-btn swatch-fill" id="swatch-global-bg">
                    <input type="color" id="global-bg-color" value="#1e272e">
                </div>
            </div>

            <div class="compact-field-group">
                <label>Borde</label>
                <div class="swatch-btn swatch-outline" id="swatch-global-border">
                    <input type="color" id="global-border-color" value="#00d2ff">
                </div>
            </div>

            <div class="compact-field-group">
                <label>Letra</label>
                <div class="swatch-btn swatch-fill" id="swatch-global-text" style="background-color: #f5f6fa;">
                    <input type="color" id="global-text-color" value="#f5f6fa">
                </div>
            </div>

            <div class="compact-field-group">
                <label>Tipografía</label>
                <select id="global-font-family" class="compact-select-input">
                    <option value="'Montserrat', sans-serif">Montserrat</option>
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Roboto', sans-serif">Roboto</option>
                    <option value="'Poppins', sans-serif">Poppins</option>
                    <option value="'Orbitron', sans-serif">Orbitron</option>
                    <option value="'Cinzel', serif">Cinzel</option>
                </select>
            </div>
        </div>
    </aside>

    <!-- Main Grid Workspace -->
    <div class="custom-workspace-container">
        <div class="custom-viewport-frame mode-pc" id="custom-viewport-frame">
            <div class="tile-grid" id="custom-grid-container">
                <!-- Real platform slots dynamically rendered here without random icons -->
            </div>
        </div>
    </div>

    <!-- Clean Single-Row Unit Customization Bar (Fondo, Borde, Letra, Tipografía, Stickers, Reset) -->
    <div class="unit-custom-bar-overlay" id="unit-custom-bar">
        <!-- Fondo Swatch -->
        <div class="unit-bar-group">
            <span class="unit-bar-label">Fondo</span>
            <div class="swatch-btn swatch-fill" id="swatch-unit-bg">
                <input type="color" id="unit-bg-color" value="#1e272e">
            </div>
        </div>

        <!-- Borde Swatch (Outline only) -->
        <div class="unit-bar-group">
            <span class="unit-bar-label">Borde</span>
            <div class="swatch-btn swatch-outline" id="swatch-unit-border">
                <input type="color" id="unit-border-color" value="#00d2ff">
            </div>
        </div>

        <!-- Letra Swatch -->
        <div class="unit-bar-group">
            <span class="unit-bar-label">Letra</span>
            <div class="swatch-btn swatch-fill" id="swatch-unit-text" style="background-color: #f5f6fa;">
                <input type="color" id="unit-text-color" value="#f5f6fa">
            </div>
        </div>

        <!-- Tipografía Dropdown -->
        <div class="unit-bar-group">
            <span class="unit-bar-label">Tipografía</span>
            <select id="unit-font-family" class="unit-bar-select">
                <option value="inherit">Heredar</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
                <option value="'Inter', sans-serif">Inter</option>
                <option value="'Roboto', sans-serif">Roboto</option>
                <option value="'Poppins', sans-serif">Poppins</option>
                <option value="'Orbitron', sans-serif">Orbitron</option>
                <option value="'Cinzel', serif">Cinzel</option>
            </select>
        </div>

        <!-- Stickers Picker Trigger -->
        <div class="unit-bar-group" style="position: relative;">
            <button class="unit-bar-btn" id="btn-toggle-stickers-popup">+ Sticker</button>
            <div class="stickers-picker-popup" id="stickers-picker-popup">
                <!-- Temporary Test Stickers Library -->
            </div>
        </div>

        <!-- Unit Reset to Global -->
        <button class="unit-bar-btn" id="btn-unit-reset" style="color: #ff4757; border-color: rgba(255,71,87,0.3);">Restablecer</button>

        <!-- Close Bar -->
        <button class="unit-bar-btn-close" id="btn-close-unit-bar">&times;</button>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/michatbot.js"></script>
    <script src="js/custom.js"></script>
</body>
</html>
