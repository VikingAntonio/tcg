<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Accesorios Deluxe - Viking TCG</title>
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/tcg-purchase-anim.js"></script>

    <style>
        :root {
            --tcg-accent: #00d2ff;
            --tcg-gold: #ffd700;
            --tcg-border: rgba(255, 255, 255, 0.12);
        }

        body {
            background: radial-gradient(circle at 50% 15%, #131e33 0%, #060911 100%) !important;
            min-height: 100vh;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            scrollbar-width: none !important;
        }
        body::-webkit-scrollbar { display: none !important; }

        .catalog-container {
            max-width: 1400px;
            width: 94%;
            margin: 0 auto;
            padding: 90px 15px 120px 15px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Hero Header */
        .catalog-hero {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .catalog-hero::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-title-group h1 {
            font-size: 2.1rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title-group p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-catalog-nav {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--tcg-border);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-catalog-nav:hover {
            border-color: var(--tcg-accent);
            color: var(--tcg-accent);
            transform: translateY(-2px);
            background: rgba(0, 210, 255, 0.1);
        }

        /* Filter Tabs */
        .category-filter-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tabs-pill-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-filter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .tab-filter-btn:hover {
            color: #fff;
            border-color: rgba(0, 210, 255, 0.4);
        }

        .tab-filter-btn.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25) 0%, rgba(0, 136, 255, 0.25) 100%);
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .search-box-wrapper {
            position: relative;
            min-width: 260px;
        }

        .search-box-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            padding: 8px 16px 8px 38px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .search-box-wrapper input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        .search-box-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.85rem;
        }

        /* Accessories Grid */
        .accessories-deluxe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
            width: 100%;
        }

        .deluxe-acc-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .deluxe-acc-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.15), 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Locked Card Styling (Grayscale) */
        .deluxe-acc-card.is-locked {
            border-color: rgba(255, 255, 255, 0.06);
        }

        .deluxe-acc-card.is-locked .acc-card-image-box img {
            filter: grayscale(1) opacity(0.65) contrast(1.1);
        }

        .deluxe-acc-card.is-locked:hover .acc-card-image-box img {
            filter: grayscale(0.5) opacity(0.85) contrast(1.1);
        }

        .acc-card-top-badges {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
        }

        .acc-category-pill {
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #00d2ff;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .acc-status-badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
        }

        .badge-owned {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .badge-included {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #60a5fa;
        }

        .badge-paid {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #fbbf24;
        }

        /* Card Image Box */
        .acc-card-image-box {
            position: relative;
            width: 100%;
            height: 250px;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.95) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
        }

        .acc-card-image-box img, .acc-card-image-box model-viewer {
            max-width: 90%;
            max-height: 90%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.35s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .acc-card-image-box.type-coin img,
        .acc-card-image-box.type-counters img,
        .acc-card-image-box.type-dice img {
            aspect-ratio: 1 / 1;
            width: auto;
            height: auto;
            max-width: 190px;
            max-height: 190px;
            border-radius: 8px;
            object-fit: contain;
        }

        .deluxe-acc-card:hover .acc-card-image-box img:not(.acc-slider-current-img) {
            transform: scale(1.06) rotate(1deg);
        }

        @keyframes pulseSlideHint {
            0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); box-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        }

        .in-image-arrow:hover {
            background: rgba(0, 210, 255, 0.4) !important;
            border-color: #00d2ff !important;
            transform: scale(1.1);
        }

        .acc-card-zoom-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            opacity: 0;
            transition: all 0.25s ease;
        }

        .deluxe-acc-card:hover .acc-card-zoom-hint {
            opacity: 1;
            transform: scale(1.05);
        }

        /* Card Bottom Info */
        .acc-card-body {
            padding: 18px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
            background: rgba(10, 16, 30, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .acc-card-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.3;
        }

        .acc-card-meta-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .acc-price-tag {
            font-size: 1.15rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .acc-free-tag {
            font-size: 0.88rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .btn-card-action {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-action-buy {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
        }

        .btn-action-buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.55);
            filter: brightness(1.1);
        }

        .btn-action-owned {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #10b981;
            cursor: default;
        }

        .btn-action-use {
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid #00d2ff;
            color: #00d2ff;
        }

        .btn-action-use:hover {
            background: #00d2ff;
            color: #030a16;
        }

        /* Empty state */
        .catalog-empty-notice {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #94a3b8;
        }

        .catalog-empty-notice i {
            font-size: 2.5rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        /* Responsive tweaks */
        @media (max-width: 640px) {
            .catalog-container {
                padding: 80px 12px 100px 12px;
            }
            .hero-title-group h1 {
                font-size: 1.6rem;
            }
            .accessories-deluxe-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }
            .acc-card-image-box {
                height: 180px;
                padding: 15px 10px;
            }
            .acc-card-title {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    <!-- 3D Mascot Chatbot Integration -->
    <script src="js/michatbot.js"></script>

    <script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }
    window.escapeHtml = escapeHtml;

        let currentUser = null;
        let allAccessories = [];
        let activeCategory = 'all';
        let storePromotions = [];
        let storeGifts = [];
        let storePacks = [];

        $(document).ready(async function() {
            initThemes();
            await checkUserSession();
            await fetchPromosAndPacks();
            await loadCatalogAccessories();
            bindCatalogEvents();

            // Check if returning from a successful Stripe purchase
            if (window.TCGPurchase) {
                await window.TCGPurchase.checkPostPaymentCallback({
                    accessory: (acc) => {
                        const cached = localStorage.getItem('tcg_session');
                        if (cached) {
                            try { currentUser = JSON.parse(cached); } catch(_) {}
                        }
                        renderCatalogGrid();
                    }
                });
            }

            // Realtime listener when an accessory/item is unlocked without reload
            window.addEventListener('tcg_item_unlocked', (e) => {
                const cached = localStorage.getItem('tcg_session');
                if (cached) {
                    try { currentUser = JSON.parse(cached); } catch(_) {}
                }
                renderCatalogGrid();
            });
        });

        function initThemes() {
            const savedTheme = localStorage.getItem('tcg_theme') || 'theme-dark';
            $('body').removeClass('theme-light theme-medium theme-dark theme-purple').addClass(savedTheme);
            $('.theme-btn-small').removeClass('active');
            $(`.theme-btn-small[data-theme="${savedTheme}"]`).addClass('active');

            $('.theme-btn-small').on('click', function() {
                const theme = $(this).data('theme');
                $('body').removeClass('theme-light theme-medium theme-dark theme-purple').addClass(theme);
                localStorage.setItem('tcg_theme', theme);
                $('.theme-btn-small').removeClass('active');
                $(this).addClass('active');
            });

            // Toggle avatar dropdown
            $('#avatar-btn').on('click', function(e) {
                e.stopPropagation();
                $('#user-dropdown').toggleClass('show');
            });
            $(document).on('click', function(e) {
                if (!$(e.target).closest('.user-menu-container').length) {
                    $('#user-dropdown').removeClass('show');
                }
            });

            $('#menu-btn-logout').on('click', async function(e) {
                e.preventDefault();
                const sbClient = window._supabase || (typeof _supabase !== 'undefined' ? _supabase : null);
                if (sbClient?.auth) await sbClient.auth.signOut();
                localStorage.removeItem('tcg_session');
                window.location.href = 'index.html';
            });
        }

        async function checkUserSession() {
            try {
                const sbClient = window._supabase || (typeof _supabase !== 'undefined' ? _supabase : null);
                if (sbClient?.auth) {
                    const { data: { session } } = await sbClient.auth.getSession();
                    if (session?.user) {
                        const { data: user } = await sbClient
                            .from('usuarios')
                            .select('*')
                            .eq('id', session.user.id)
                            .maybeSingle();
                        if (user) {
                            currentUser = user;
                            localStorage.setItem('tcg_session', JSON.stringify(user));
                            updateUserUI();
                            return;
                        }
                    }
                }
            } catch (e) {
                console.warn('Session check notice:', e);
            }

            const cached = localStorage.getItem('tcg_session');
            if (cached) {
                try {
                    currentUser = JSON.parse(cached);
                    updateUserUI();
                } catch (_) {}
            }
        }

        function updateUserUI() {
            if (!currentUser) return;
            $('#dropdown-user-name').text(currentUser.store_name || currentUser.username || 'Usuario');
            if (currentUser.role === 'admin') {
                $('#dropdown-user-role').text('Administrador').show();
            } else {
                $('#dropdown-user-role').text((currentUser.role || 'Starter').toUpperCase()).show();
            }
            if (currentUser.store_logo) {
                $('#dropdown-user-logo').attr('src', currentUser.store_logo).show();
            }
        }

        async function loadCatalogAccessories() {
            try {
                // 1. Fetch from accessories table
                const { data, error } = await _supabase
                    .from('accessories')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    allAccessories = data;
                } else {
                    // Fallback to viking_data
                    const { data: vikData } = await _supabase
                        .from('viking_data')
                        .select('*')
                        .or('type.eq.accessories,type.eq.accessory');

                    if (vikData && vikData.length > 0) {
                        allAccessories = vikData.map(v => {
                            const r = (v.rarity || '').toLowerCase();
                            const e = (v.expansion || '').toLowerCase();
                            let cat = 'sleeves';
                            if (r.includes('mat') || e.includes('mat')) cat = 'mats';
                            else if (r === 'deckbox' || e === 'deckbox') cat = 'deckbox';
                            else if (r === 'coin' || e === 'coin') cat = 'coin';

                            return {
                                id: v.id,
                                name: v.name,
                                image_url: v.image_url,
                                category: cat,
                                sale_status: 'disponible',
                                price_mxn: 25,
                                target_roles: ['starter', 'premium', 'tienda']
                            };
                        });
                    } else {
                        allAccessories = [];
                    }
                }
            } catch (err) {
                console.warn('Error loading accessories catalog:', err);
                allAccessories = [];
            }

            renderCatalogGrid();
        }

        function renderCatalogGrid() {
            const $grid = $('#accessories-grid');
            $grid.empty();

            const userRole = (currentUser?.role || 'starter').toLowerCase();
            const isAdmin = userRole === 'admin';

            // Filter items based on active category & visibility
            const filtered = allAccessories.filter(item => {
                // Hide 'oculto' items unless admin
                if (item.sale_status === 'oculto' && !isAdmin) return false;

                if (activeCategory === 'all') return true;
                return (item.category || '').toLowerCase() === activeCategory;
            });

            if (filtered.length === 0) {
                $grid.html(`
                    <div class="catalog-empty-notice">
                        <i class="fas fa-sparkles"></i>
                        <p>No se encontraron diseños para esta categoría.</p>
                    </div>
                `);
                return;
            }

            filtered.forEach(item => {
                const isPaid = (item.sale_status === 'de_paga');
                const isOwned = window.TCGPurchase?.hasUserPurchased('accessory', item.id, currentUser);
                const roles = item.target_roles || ['starter', 'premium', 'tienda'];
                const isIncludedInPlan = roles.includes(userRole) || isAdmin;

                // An item is accessible if owned OR (included in plan AND not paid)
                const canUse = isOwned || (isIncludedInPlan && !isPaid);
                const isLocked = !canUse;
                const basePrice = Math.max(5, Number(item.price_mxn) || 25);
                const category = (item.category || 'sleeves').toLowerCase();

                // Resolve real-time pricing hierarchy (Gift -> Promo -> Base)
                const pricing = window.TCGPurchase?.resolveProductPricing({
                    id: item.id,
                    category: category,
                    basePrice: basePrice,
                    promotions: storePromotions,
                    giftCampaigns: storeGifts,
                    user: currentUser
                }) || { effectivePrice: basePrice, originalPrice: basePrice, hasPromo: false, isGift: false };

                let catLabel = 'Sleeve';
                if (category === 'deckbox') catLabel = 'Deck';
                else if (category === 'coin') catLabel = 'Coin';
                else if (category === 'dice') catLabel = 'Dado';
                else if (category === 'counters') catLabel = 'Contador';
                else if (category === 'calculator') catLabel = 'Calculadora';
                else if (category === 'token') catLabel = 'Token';
                else if (category === 'mats') catLabel = 'Playmat';

                // Status badge logic
                let statusBadgeHtml = '';
                if (isOwned) {
                    statusBadgeHtml = `<span class="acc-status-badge badge-owned"><i class="fas fa-check-circle"></i> Adquirido</span>`;
                } else if (pricing.isGift) {
                    statusBadgeHtml = `<span class="acc-status-badge" style="background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4);"><i class="fas fa-gift"></i> Regalo</span>`;
                } else if (pricing.hasPromo) {
                    statusBadgeHtml = `<span class="acc-status-badge" style="background: rgba(0, 210, 255, 0.2); color: #00d2ff; border: 1px solid rgba(0, 210, 255, 0.4);"><i class="fas fa-tag"></i> Promo -${pricing.discountPercent}%</span>`;
                } else if (!isPaid && isIncludedInPlan) {
                    statusBadgeHtml = `<span class="acc-status-badge badge-included"><i class="fas fa-check-circle"></i> Desbloqueado</span>`;
                } else {
                    statusBadgeHtml = `<span class="acc-status-badge badge-paid"><i class="fas fa-lock"></i> De Paga</span>`;
                }

                // Action button logic
                let actionBtnHtml = '';
                if (isLocked) {
                    if (pricing.isGift) {
                        actionBtnHtml = `
                            <button type="button" class="btn-card-action btn-action-buy btn-claim-gift-direct" data-campaign-id="${pricing.giftCampaign?.id || ''}" style="background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%); color: #fff; border: none; font-weight: 800;">
                                <i class="fas fa-gift"></i> Reclamar Gratis
                            </button>
                        `;
                    } else {
                        actionBtnHtml = `
                            <button type="button" class="btn-card-action btn-action-buy btn-buy-accessory" data-id="${item.id}" data-price="${pricing.effectivePrice}">
                                Adquirir $${pricing.effectivePrice} MXN
                            </button>
                        `;
                    }
                } else if (isOwned) {
                    actionBtnHtml = `
                        <div class="btn-card-action btn-action-owned">
                            <i class="fas fa-check"></i> En tu Colección
                        </div>
                    `;
                } else {
                    actionBtnHtml = `
                        <div class="btn-card-action btn-action-use">
                            <i class="fas fa-check"></i> Adquirido
                        </div>
                    `;
                }

                const $card = $(`
                    <div class="deluxe-acc-card ${isLocked ? 'is-locked' : ''}" data-id="${item.id}" data-name="${escapeHtml(item.name || '')}" data-category="${category}">
                        <div class="acc-card-top-badges">
                            <span class="acc-category-pill">${catLabel}</span>
                            ${statusBadgeHtml}
                        </div>

                        ${(() => {
                            let isMulti = false;
                            let faces = [];
                            if (item.image_url && item.image_url.trim().startsWith('{')) {
                                try {
                                    const parsed = JSON.parse(item.image_url);
                                    if (parsed.heads || parsed.tails) {
                                        isMulti = true;
                                        if (parsed.heads) faces.push({ label: 'Cara', url: parsed.heads });
                                        if (parsed.tails) faces.push({ label: 'Cruz', url: parsed.tails });
                                    } else {
                                        const ks = Object.keys(parsed).sort();
                                        if (ks.length > 0) {
                                            isMulti = true;
                                            ks.forEach(k => faces.push({ label: 'Cara ' + k, url: parsed[k] }));
                                        }
                                    }
                                } catch(e) {}
                            }

                            if (isMulti && faces.length > 0) {
                                return `
                                    <div class="acc-card-image-box ${category === 'coin' || category === 'dice' ? 'type-coin' : ''} acc-slider-container" data-faces='${JSON.stringify(faces).replace(/'/g, "&apos;")}' title="Ver en grande" style="position: relative;">
                                        <img src="${faces[0].url}" alt="${escapeHtml(item.name || 'Accesorio')}" class="acc-slider-current-img" style="width: 100%; height: 100%; object-fit: contain; transition: transform 0.25s ease;">
                                        <div class="acc-in-image-controls" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px; pointer-events: none; z-index: 6;">
                                            <button type="button" class="btn-acc-card-slide-prev in-image-arrow" style="pointer-events: auto; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(0, 210, 255, 0.3); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; backdrop-filter: blur(4px); opacity: 0.7; transition: opacity 0.2s;"><i class="fas fa-chevron-left"></i></button>
                                            <button type="button" class="btn-acc-card-slide-next in-image-arrow" style="pointer-events: auto; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(0, 210, 255, 0.3); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; backdrop-filter: blur(4px); opacity: 0.7; transition: opacity 0.2s;"><i class="fas fa-chevron-right"></i></button>
                                        </div>
                                    </div>
                                `;
                            } else {
                                return `
                                    <div class="acc-card-image-box ${category === 'coin' ? 'type-coin' : (category === 'counters' ? 'type-counters' : '')}" data-url="${item.image_url}" title="Ver en grande">
                                        <img src="${item.image_url}" alt="${escapeHtml(item.name || 'Accesorio')}" onerror="this.src='https://via.placeholder.com/200?text=Accesorio'">
                                        <div class="acc-card-zoom-hint"><i class="fas fa-search-plus"></i></div>
                                    </div>
                                `;
                            }
                        })()}

                        <div class="acc-card-body">
                            <div>
                                <h3 class="acc-card-title">${escapeHtml(item.name || 'Accesorio')}</h3>
                            </div>

                            <div class="acc-card-meta-line">
                                ${isPaid ? `
                                    ${pricing.isGift ? `
                                        <span class="acc-price-tag" style="text-decoration: line-through; opacity: 0.6; font-size: 0.75rem;">$${basePrice} MXN</span>
                                        <span class="acc-free-tag" style="background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4);">GRATIS</span>
                                    ` : pricing.hasPromo ? `
                                        <span class="acc-price-tag" style="text-decoration: line-through; opacity: 0.6; font-size: 0.75rem;">$${basePrice} MXN</span>
                                        <span class="acc-price-tag" style="color: #00ff88; font-weight: 900;">$${pricing.effectivePrice} MXN</span>
                                    ` : `<span class="acc-price-tag">$${basePrice} MXN</span>`}
                                ` : `<span class="acc-free-tag">Incluido</span>`}
                            </div>

                            ${actionBtnHtml}
                        </div>
                    </div>
                `);

                // Multi-face slider navigation
                const $sliderBox = $card.find('.acc-slider-container');
                if ($sliderBox.length > 0) {
                    const rawFaces = $sliderBox.attr('data-faces');
                    let facesData = [];
                    try { facesData = JSON.parse(rawFaces); } catch(err) {}

                    if (facesData.length > 1) {
                        let curFaceIdx = 0;
                        const $curImg = $sliderBox.find('.acc-slider-current-img');

                        $sliderBox.find('.btn-acc-card-slide-prev').on('click', function(e) {
                            e.stopPropagation();
                            curFaceIdx = (curFaceIdx - 1 + facesData.length) % facesData.length;
                            $curImg.attr('src', facesData[curFaceIdx].url);
                        });

                        $sliderBox.find('.btn-acc-card-slide-next').on('click', function(e) {
                            e.stopPropagation();
                            curFaceIdx = (curFaceIdx + 1) % facesData.length;
                            $curImg.attr('src', facesData[curFaceIdx].url);
                        });
                    }
                }

                // Zoom click
                $card.find('.acc-card-image-box').on('click', function(e) {
                    if ($(e.target).closest('button').length > 0) return;
                    e.stopPropagation();
                    const curImgSrc = $(this).find('img').attr('src') || item.image_url;

                    Swal.fire({
                        title: item.name,
                        imageUrl: curImgSrc,
                        imageAlt: item.name,
                        showConfirmButton: false,
                        showCloseButton: true,
                        background: '#0a101f',
                        color: '#fff'
                    });
                });

                // Buy click
                $card.find('.btn-buy-accessory').on('click', async function(e) {
                    e.stopPropagation();
                    if (window.TCGPurchase) {
                        await window.TCGPurchase.purchaseItemViaStripe('accessory', Object.assign({}, item, { price_mxn: pricing.effectivePrice }));
                    }
                });

                // Claim Gift click
                $card.find('.btn-claim-gift-direct').on('click', async function(e) {
                    e.stopPropagation();
                    if (pricing.giftCampaign && typeof window.claimGiftItem === 'function') {
                        await window.claimGiftItem(pricing.giftCampaign);
                        await fetchPromosAndPacks();
                        renderCatalogGrid();
                    }
                });

                $grid.append($card);
            });

            // Re-apply search filter if typing
            const searchVal = $('#catalog-search-input').val().toLowerCase();
            if (searchVal) {
                $('#catalog-search-input').trigger('input');
            }
        }

        function bindCatalogEvents() {
            // Category tab clicks
            $('#catalog-filter-tabs .tab-filter-btn').on('click', function() {
                $('#catalog-filter-tabs .tab-filter-btn').removeClass('active');
                $(this).addClass('active');
                activeCategory = $(this).data('category') || 'all';
                renderCatalogGrid();
            });

            // Search input
            $('#catalog-search-input').on('input', function() {
                const term = $(this).val().toLowerCase().trim();
                $('.deluxe-acc-card').each(function() {
                    const name = ($(this).data('name') || '').toLowerCase();
                    const cat = ($(this).data('category') || '').toLowerCase();
                    if (!term || name.includes(term) || cat.includes(term)) {
                        $(this).show();
                    } else {
                        $(this).hide();
                    }
                });
            });
        }

        // Load Promotions, Gifts, and Packs in Store
        async function fetchPromosAndPacks() {
            try {
                const [pRes, pkRes, gRes] = await Promise.all([
                    _supabase.from('product_promotions').select('*').eq('status', 'active'),
                    _supabase.from('product_packs').select('*').eq('status', 'published'),
                    _supabase.from('gift_campaigns').select('*').eq('status', 'active')
                ]);
                storePromotions = pRes.data || [];
                storePacks = pkRes.data || [];
                storeGifts = gRes.data || [];
            } catch (e) {
                console.warn('Error loading store promos/packs/gifts:', e);
            }
        }

        // Inspection modal for Packs
        window.openPackModal = function(packId) {
            const pack = storePacks.find(p => String(p.id) === String(packId));
            if (!pack) return;
            const items = Array.isArray(pack.items) ? pack.items : [];
            const itemsHtml = items.map(it => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:8px; margin-bottom:6px;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${it.image_url || 'https://vikingtcg.xyz/favi.png'}" style="width:36px; height:36px; object-fit:cover; border-radius:6px;">
                        <span><b>${it.quantity}x</b> ${escapeHtml(it.name)} (${it.category})</span>
                    </div>
                    <span style="color:#00ff88; font-weight:700;">$${Number(it.price_mxn || 0).toFixed(2)}</span>
                </div>
            `).join('');

            Swal.fire({
                title: pack.name,
                html: `
                    <div style="text-align:left; font-size:0.9rem;">
                        <img src="${pack.image_url}" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-bottom:12px;">
                        <p style="color:#cbd5e1; margin-bottom:12px;">${escapeHtml(pack.description || '')}</p>
                        <h4 style="color:#00d2ff; margin-bottom:8px;">Artículos Incluidos:</h4>
                        <div style="max-height:180px; overflow-y:auto;">
                            ${itemsHtml}
                        </div>
                        <div style="margin-top:14px; text-align:right;">
                            <span style="font-size:1.3rem; font-weight:800; color:#ffd700;">$${Number(pack.promo_price || pack.normal_price).toFixed(2)} MXN</span>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Comprar Pack',
                cancelButtonText: 'Cerrar'
            }).then(res => {
                if (res.isConfirmed) {
                    window.TCGPurchase.purchaseItemViaStripe(pack.id, 'pack', pack.promo_price || pack.normal_price);
                }
            });
        };

</script>
</body>
</html>
