<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Build Mode | Vikingdev</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/build.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body class="build-body">

    <!-- Vertical Side Tab Trigger -->
    <div id="side-tab-trigger" class="vertical-side-tab">
        <span>HERRAMIENTAS</span>
    </div>

    <!-- Collapsible Side Panel -->
    <div id="build-side-panel" class="side-panel">
        <div class="side-panel-content">
            <button id="btn-open-upload" class="btn-build-main" style="width: 100%; margin-bottom: 20px;">
                <i class="fas fa-plus"></i> NUEVO MODELO
            </button>
        </div>
    </div>
    <div id="side-panel-overlay" class="panel-overlay"></div>

    <div class="build-container">
        <!-- Minimal Header -->
        <header class="build-header-minimal">
            <button onclick="window.location.href='admin.html'" class="btn-build-nav">
                <i class="fas fa-arrow-left"></i>
            </button>
        </header>

        <!-- Tool Interception Cards -->
        <div class="view-grid" id="view-grid">
            <!-- Dynamically loaded -->
            <div class="loading" style="grid-column: 1/-1; text-align: center; padding: 40px;">Cargando herramientas...</div>
        </div>

        <!-- Assets Management Section -->
        <section class="build-assets-section">
            <div class="assets-grid-container" id="assets-grid">
                <!-- Dynamically loaded 4 columns desktop / 2 mobile -->
            </div>
        </section>
    </div>

    <!-- Upload/Edit Modal -->
    <div id="modal-asset" class="overlay">
        <div class="overlay-content build-modal">
            <span class="close-btn" onclick="$('#modal-asset').removeClass('active')">&times;</span>
            <h2 class="modal-title-custom" id="asset-modal-title">NUEVO MODELO</h2>
            <input type="hidden" id="asset-id">

            <div class="slot-modal-tabs">
                <button class="slot-tab-btn active" data-tab="tab-model">MODELO</button>
                <button class="slot-tab-btn" data-tab="tab-config">CONFIGURACIÓN</button>
            </div>

            <div id="tab-model" class="slot-tab-content active">
                <div class="modern-form-group">
                    <label>NOMBRE DEL MODELO</label>
                    <input type="text" id="asset-name" class="modern-input" placeholder="Ej: Dragon en Construcción">
                </div>

                <div class="modern-form-grid">
                    <div class="modern-form-group">
                        <label>ARCHIVOS GLTF / GLB</label>
                        <label class="drop-zone-modern" id="drop-zone-asset">
                            <i class="fas fa-cube"></i>
                            <p>Arrastra .gltf o .glb</p>
                            <input type="file" id="input-asset-files" multiple accept=".gltf,.glb,.bin,.png,.jpg,.jpeg,.webp" style="display: none;">
                            <div class="file-name"></div>
                        </label>
                    </div>

                    <div class="modern-form-group">
                        <label>POSTER / MINIATURA</label>
                        <label class="drop-zone-modern" id="drop-zone-poster">
                            <i class="fas fa-image"></i>
                            <p>Arrastra una imagen</p>
                            <input type="file" id="input-poster-file" accept="image/*" style="display: none;">
                            <div class="file-name"></div>
                        </label>
                    </div>
                </div>
            </div>

            <div id="tab-config" class="slot-tab-content">
                <div class="info-grid">
                    <div class="modern-form-group">
                        <label>ANIMACIÓN</label>
                        <select id="asset-animation" class="modern-input">
                            <option value="orbit">Órbita</option>
                            <option value="float">Flotante</option>
                            <option value="float-static">Estatico</option>
                        </select>
                    </div>
                    <div class="modern-form-group">
                        <label>ESCALA</label>
                        <input type="number" id="asset-scale" class="modern-input" value="1.8" step="0.1">
                    </div>
                </div>
                <div class="modern-form-group">
                    <label>SISTEMA DE PARTÍCULAS</label>
                    <select id="asset-particles" class="modern-input">
                        <option value="none">Ninguno</option>
                        <option value="dust">Polvo Estelar</option>
                        <option value="fire">Chispas</option>
                        <option value="snow">Nieve</option>
                    </select>
                </div>
            </div>

            <button id="btn-save-asset" class="btn-build-main btn-save-full">
                <i class="fas fa-save"></i> GUARDAR CAMBIOS
            </button>
        </div>
    </div>

    <!-- Model Picker Popover -->
    <div id="model-picker" class="model-picker-overlay">
        <div class="model-picker-content">
            <div class="picker-header">
                <h2>SELECCIONAR MODELO</h2>
                <button class="btn-close-picker" onclick="$('#model-picker').removeClass('active')">&times;</button>
            </div>
            <div class="model-picker-grid" id="picker-grid">
                <!-- Loaded assets -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/michatbot.js"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/build.js"></script>
</body>
</html>
