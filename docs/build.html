<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Build Mode | Vikingdev</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/build.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body class="build-body">

    <div class="build-container">
        <!-- Header -->
        <header class="build-header">
            <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px;">
                <button onclick="window.location.href='admin.html'" class="btn-build-main" style="background: rgba(255,255,255,0.1); color: white;">
                    <i class="fas fa-arrow-left"></i> Panel
                </button>
                <div class="view-icon"><i class="fas fa-tools"></i></div>
            </div>
            <h1>BUILD SYSTEM</h1>
            <p>Configura placeholders 3D para tus herramientas en construcción</p>
        </header>

        <!-- Tool Interception Cards -->
        <div class="view-grid" id="view-grid">
            <!-- Dynamically loaded -->
            <div class="loading" style="grid-column: 1/-1; text-align: center; padding: 40px;">Cargando herramientas...</div>
        </div>

        <!-- Assets Management Section -->
        <section class="build-assets-section">
            <div class="section-title-row">
                <h2>MIS MODELOS 3D</h2>
                <button id="btn-open-upload" class="btn-build-main">
                    <i class="fas fa-plus"></i> NUEVO MODELO
                </button>
            </div>

            <div class="view-grid" id="assets-grid">
                <!-- Dynamically loaded -->
            </div>
        </section>
    </div>

    <!-- Upload/Edit Modal -->
    <div id="modal-asset" class="overlay">
        <div class="overlay-content build-modal">
            <span class="close-btn" onclick="$('#modal-asset').removeClass('active')">&times;</span>
            <h2 class="modal-title-custom" id="asset-modal-title">NUEVO ASSET</h2>
            <input type="hidden" id="asset-id">

            <div class="slot-modal-tabs" style="margin-bottom: 30px;">
                <button class="slot-tab-btn active" data-tab="tab-file">ARCHIVO</button>
                <button class="slot-tab-btn" data-tab="tab-meta">DETALLES</button>
            </div>

            <div id="tab-file" class="slot-tab-content active">
                <div class="modern-form-group">
                    <label>NOMBRE DEL MODELO</label>
                    <input type="text" id="asset-name" class="modern-input" placeholder="Ej: Dragon en Construcción">
                </div>
                <div class="modern-form-group">
                    <label>ARCHIVOS GLTF / GLB</label>
                    <label class="drop-zone-modern" id="drop-zone-asset">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Suelta los archivos aquí (.gltf, .glb, .bin, texturas)</p>
                        <input type="file" id="input-asset-files" multiple accept=".gltf,.glb,.bin,.png,.jpg,.jpeg,.webp" style="display: none;">
                        <div class="file-name" style="color: var(--build-primary); margin-top: 10px; font-weight: bold;"></div>
                    </label>
                </div>
            </div>

            <div id="tab-meta" class="slot-tab-content">
                <div class="info-grid">
                    <div class="modern-form-group">
                        <label>ANIMACIÓN</label>
                        <select id="asset-animation" class="modern-input">
                            <option value="orbit">Órbita</option>
                            <option value="float">Flotante</option>
                            <option value="float-static">Estatico</option>
                        </select>
                    </div>
                    <div class="modern-form-group">
                        <label>ESCALA</label>
                        <input type="number" id="asset-scale" class="modern-input" value="1.8" step="0.1">
                    </div>
                </div>
                <div class="modern-form-group">
                    <label>POSTER (OPCIONAL)</label>
                    <input type="file" id="input-poster" accept="image/*" class="modern-input">
                </div>
            </div>

            <button id="btn-save-asset" class="btn-build-main" style="width: 100%; height: 60px; justify-content: center; margin-top: 20px;">
                <i class="fas fa-save"></i> GUARDAR MODELO
            </button>
        </div>
    </div>

    <!-- Model Picker Popover -->
    <div id="model-picker" class="model-picker-overlay">
        <div class="model-picker-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2 style="margin: 0;">SELECCIONAR MODELO</h2>
                <button class="btn-build-main" style="padding: 10px 20px; background: rgba(255,255,255,0.1); color: white;" onclick="$('#model-picker').removeClass('active')">CERRAR</button>
            </div>
            <div class="model-picker-grid" id="picker-grid">
                <!-- Loaded assets -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/build.js"></script>
</body>
</html>
