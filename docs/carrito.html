            <style>
        /* ===== Mi Carrito — diseño responsivo (estilo tienda) ===== */
        .cart-page-container {
            max-width: 1080px;
            width: 100%;
            margin: 96px auto 64px;
            padding: 0 16px;
        }

        /* Encabezado */
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            padding: 0 4px;
        }
        .cart-header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Lista de artículos */
        #cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .cart-item {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr) auto;
            grid-template-areas: "img info foot";
            align-items: center;
            gap: 20px;
            padding: 18px;
            background: var(--slot-bg);
            border: 1px solid var(--slot-border);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .cart-item:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }
        .cart-item > img {
            grid-area: img;
            width: 96px;
            height: 128px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        }
        .cart-item-info {
            grid-area: info;
            min-width: 0;
        }
        .cart-item-info h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            line-height: 1.3;
            color: var(--text-color);
            overflow-wrap: anywhere;
        }
        .cart-item-info p {
            margin: 0;
            font-size: 0.82rem;
            line-height: 1.45;
            color: var(--text-muted);
            overflow-wrap: anywhere;
        }
        .cart-price-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Fila de acciones: cantidad + precio + eliminar */
        .cart-item-foot {
            grid-area: foot;
            display: flex;
            align-items: center;
            gap: 22px;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .cart-item-qty label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }
        .cart-qty-select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--slot-border);
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .cart-qty-max {
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .cart-item-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: #00b894;
            white-space: nowrap;
            text-align: right;
        }
        .btn-remove {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.25);
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-remove:hover {
            background: #ff4757;
            color: #ffffff;
        }

        /* Resumen / Total */
        .cart-summary {
            margin-top: 26px;
            padding: 26px 28px;
            background: var(--slot-bg);
            border: 1px solid var(--slot-border);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 1.15rem;
            color: var(--text-color);
        }
        .total-amount {
            font-weight: 800;
            color: #00b894;
            font-size: 1.9rem;
        }
        .checkout-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-checkout {
            padding: 14px 26px;
            font-size: 0.98rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-whatsapp {
            background: #25d366 !important;
        }
        .btn-messenger {
            background: #006aff !important;
        }

        /* Carrito vacío */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-cart i {
            font-size: 3.5rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .empty-cart h2 {
            margin: 0 0 8px;
            color: var(--text-color);
        }
        .empty-cart p {
            margin: 0;
            color: var(--text-muted);
        }

        /* Móvil y tabletas */
        @media (max-width: 720px) {
            .cart-page-container {
                margin: 84px auto 48px;
                padding: 0 12px;
            }
            .cart-header {
                flex-direction: column;
                align-items: stretch;
            }
            .cart-header h1 {
                justify-content: center;
                font-size: 1.4rem;
            }
            .cart-header .btn {
                width: 100%;
                justify-content: center;
            }
            .cart-item {
                grid-template-columns: 84px minmax(0, 1fr);
                grid-template-areas:
                    "img info"
                    "foot foot";
                align-items: start;
                gap: 12px 16px;
                padding: 14px;
            }
            .cart-item > img {
                width: 84px;
                height: 112px;
            }
            .cart-item-info h3 {
                font-size: 1rem;
            }
            .cart-item-foot {
                justify-content: space-between;
                gap: 12px;
                padding-top: 12px;
                margin-top: 4px;
                border-top: 1px solid var(--slot-border);
            }
            .cart-qty-max {
                display: none;
            }
            .cart-item-price {
                margin-left: auto;
                font-size: 1.2rem;
            }
            .cart-summary {
                padding: 22px 18px;
            }
            .total-row {
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            .checkout-actions {
                flex-direction: column;
            }
            .btn-checkout {
                width: 100%;
            }
        }
    </style>
</head>

    <script>
        let storeOwnerLinks = {
            whatsapp: '526645367661',
            messenger: 'TCGToonShop'
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('tcg_theme') || 'theme-dark';
            applyTheme(savedTheme);
        }

        function applyTheme(theme) {
            $('body').removeClass('theme-light theme-medium theme-dark theme-purple').addClass(theme);
            localStorage.setItem('tcg_theme', theme);

            $('.theme-btn-small').removeClass('active');
            $(`.theme-btn-small[data-theme="${theme}"]`).addClass('active');
        }

        async function checkUserSession() {
            let currentUser = null;
            if (typeof _supabase !== 'undefined') {
                try {
                    const { data: { session } } = await _supabase.auth.getSession();
                    if (session && session.user) {
                        const { data: user } = await _supabase.from('usuarios').select('*').eq('id', session.user.id).maybeSingle();
                        if (user) currentUser = user;
                    }
                } catch (e) {
                    console.error("Error checking auth session:", e);
                }
            }

            if (!currentUser) {
                const cached = localStorage.getItem('tcg_session');
                if (cached) {
                    try { currentUser = JSON.parse(cached); } catch (e) {}
                }
            }

            if (currentUser) {
                const name = currentUser.store_name || currentUser.username || 'Usuario';
                $('#dropdown-user-name').text(name);
                if (currentUser.role) {
                    $('#dropdown-user-role').text(currentUser.role).show();
                }
                if (currentUser.store_logo) {
                    $('#dropdown-user-logo').attr('src', currentUser.store_logo).show();
                } else {
                    $('#dropdown-user-logo').hide();
                }
            } else {
                $('#dropdown-user-name').text('Usuario');
                $('#dropdown-user-role').hide();
                $('#dropdown-user-logo').hide();
            }
            $('#top-panel').show();
        }

        $(document).ready(async function() {
            // Maintenance & Beta/Test Mode Check
            if (typeof window.checkVikingMaintenance === 'function') {
                window.checkVikingMaintenance('carrito');
            }

            initTheme();
            await checkUserSession();

            $(document).on('click', '.theme-btn-small', function() {
                const theme = $(this).data('theme');
                if (theme) applyTheme(theme);
            });

            // Avatar Menu Toggle
            $(document).on('click', '#avatar-btn', function(e) {
                e.stopPropagation();
                $('#user-dropdown').toggleClass('active');
            });
            $(document).on('click', function(e) {
                if (!$(e.target).closest('.user-menu-container').length) {
                    $('#user-dropdown').removeClass('active');
                }
            });

            // Logout Handler
            $('#menu-btn-logout').click(async function(e) {
                e.preventDefault();
                if (typeof _supabase !== 'undefined') {
                    try { await _supabase.auth.signOut(); } catch (err) {}
                }
                localStorage.removeItem('tcg_session');
                window.location.reload();
            });

            // Setup context links
            const logoLink = document.getElementById('logo-link');
            if (logoLink) logoLink.href = 'public.html' + window.location.search;
            const homeBtn = document.getElementById('btn-nav-home');
            if (homeBtn) {
                homeBtn.onclick = function() {
                    window.location.href = 'public.html' + window.location.search;
                };
            }
            const returnBtn = document.getElementById('btn-nav-return');
            if (returnBtn) {
                returnBtn.onclick = function() {
                    window.history.back();
                };
            }

            renderCart();
            await loadStoreContact();

            $('#btn-clear-cart').click(function() {
                Swal.fire({
                    title: '¿Vaciar carrito?',
                    text: "Se eliminarán todos los artículos seleccionados.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ff4757',
                    confirmButtonText: 'Sí, vaciar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Cart.clear();
                        renderCart();
                    }
                });
            });

            $('#send-whatsapp').click(function() {
                sendMessage('whatsapp');
            });

            $('#send-messenger').click(function() {
                sendMessage('messenger');
            });
        });

        function renderCart() {
            const items = Cart.getAll();
            const $list = $('#cart-items-list');
            $list.empty();

            if (items.length === 0) {
                $('#cart-summary-section').hide();
                $('#empty-cart-msg').show();
                return;
            }

            $('#cart-summary-section').show();
            $('#empty-cart-msg').hide();

            items.forEach(item => {
                const qty = parseInt(item.cart_quantity) || 1;
                const maxQty = Math.max(1, parseInt(item.max_quantity || item.quantity) || 1);

                const isPreorderDeposit = item.unit_deposit !== undefined && item.unit_deposit !== null;
                const unitPrice = isPreorderDeposit ? parseFloat(item.unit_deposit) : (parseFloat((item.price || "0").toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0);
                const subtotal = unitPrice * qty;

                const detailParts = [];
                if (isPreorderDeposit) {
                    const fullPrice = parseFloat(item.total_unit_price) || (parseFloat((item.price || "0").toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0);
                    detailParts.push(`PREVENTA`);
                    if (fullPrice > 0) {
                        detailParts.push(`Precio Lista: $${fullPrice.toFixed(2)}/u`);
                    }
                    detailParts.push(`Abono Elegido: $${unitPrice.toFixed(2)}/u`);
                }
                if (item.deadline) detailParts.push(`Límite Pago: ${item.deadline}`);
                if (item.rarity && item.rarity !== '-') detailParts.push(item.rarity);
                if (item.expansion && item.expansion !== '-') detailParts.push(item.expansion);
                if (item.condition && item.condition !== '-') detailParts.push(item.condition);
                if (item.language && item.language !== '-') detailParts.push(`Idioma: ${item.language}`);
                if (item.edition && item.edition !== '-') detailParts.push(`Edición: ${item.edition}`);
                if (item.tcg) detailParts.push(item.tcg.toUpperCase());
                if (item.description && item.description !== '-') detailParts.push(item.description);

                const detailsText = detailParts.length > 0 ? detailParts.join(' | ') : 'Producto';

                let priceSubtext = `Precio unitario: $${unitPrice.toFixed(2)}`;
                if (isPreorderDeposit) {
                    const fullPrice = parseFloat(item.total_unit_price) || (parseFloat((item.price || "0").toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0);
                    priceSubtext = `Abono unitario: <strong style="color: #f5af19;">$${unitPrice.toFixed(2)}</strong> (Total prod.: $${fullPrice.toFixed(2)})`;
                }

                let qtyOptions = '';
                for (let i = 1; i <= maxQty; i++) {
                    qtyOptions += `<option value="${i}" ${i === qty ? 'selected' : ''}>${i}</option>`;
                }

                const $itemRow = $(`
                    <div class="cart-item">
                        <img src="${item.image_url || 'https://via.placeholder.com/100x140?text=Producto'}" alt="${item.name}">
                        <div class="cart-item-info">
                            <h3>${item.name}</h3>
                            <p>${detailsText}</p>
                            <div class="cart-price-sub">${priceSubtext}</div>
                        </div>
                        <div class="cart-item-foot">
                            <div class="cart-item-qty">
                                <label>Copias:</label>
                                <select class="cart-qty-select" onchange="updateItemQty('${item.cart_id}', this.value)">
                                    ${qtyOptions}
                                </select>
                                <span class="cart-qty-max">(máx ${maxQty})</span>
                            </div>
                            <div class="cart-item-price">$${subtotal.toFixed(2)}</div>
                            <button class="btn-remove" onclick="removeItem('${item.cart_id}')" title="Eliminar">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `);
                $list.append($itemRow);
            });

            $('#cart-total-display').text('$' + Cart.getTotal().toFixed(2));
        }

        window.updateItemQty = function(id, newQty) {
            Cart.updateQuantity(id, newQty);
            renderCart();
        };

        window.removeItem = function(id) {
            Cart.remove(id);
            renderCart();
        };

        async function loadStoreContact() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeName = urlParams.get('store') || urlParams.get('user') || urlParams.get('id');

            if (!storeName) return;

            try {
                const safeId = storeName.replace(/['"]/g, '');
                const { data, error } = await _supabase
                    .from('usuarios')
                    .select('id, store_name, username, store_logo, is_store, whatsapp_link, messenger_link')
                    .or(`store_name.eq."${safeId}",username.eq."${safeId}"`)
                    .maybeSingle();

                if (!error && data) {
                    storeOwnerLinks.seller_id = data.id;
                    if (data.whatsapp_link) storeOwnerLinks.whatsapp = data.whatsapp_link;
                    if (data.messenger_link) storeOwnerLinks.messenger = data.messenger_link;

                    const title = data.is_store && data.store_name ? data.store_name : (data.username || 'Viking TCG');
                    $('#public-store-name').text(title);
                    if (data.store_logo) {
                        $('#public-store-logo').attr('src', data.store_logo).show();
                    }
                }
            } catch (e) {
                console.error("Error loading store contact:", e);
            }
        }

        async function simulatePurchase() {
            const items = Cart.getAll();
            if (items.length === 0) {
                Swal.fire({ icon: 'info', title: 'Carrito Vacío', text: 'Agrega al menos un producto al carrito.' });
                return;
            }

            const { value: buyerDetails } = await Swal.fire({
                title: 'Simular Compra (Prueba de Notificación)',
                html: `
                    <div style="text-align: left; font-family: sans-serif; font-size: 0.9rem;">
                        <p style="margin-bottom: 12px; color: #cbd5e1;">Esta acción simulará la adquisición de los productos e inmediatamente enviará la notificación al vendedor:</p>
                        <label style="display: block; margin-bottom: 4px; font-weight: bold; color: #00d2ff;">Nombre del Comprador *</label>
                        <input id="swal-sim-name" class="swal2-input" value="Sutano Pérez" style="margin-top: 0; width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px;">

                        <label style="display: block; margin-top: 12px; margin-bottom: 4px; font-weight: bold; color: #00d2ff;">Teléfono / Contacto</label>
                        <input id="swal-sim-contact" class="swal2-input" value="55-8888-9999" style="margin-top: 0; width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px;">

                        <label style="display: block; margin-top: 12px; margin-bottom: 4px; font-weight: bold; color: #00d2ff;">Opción de Pago *</label>
                        <select id="swal-sim-payment" class="swal2-select" style="width: 100%; margin-top: 0; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 10px; border-radius: 8px;">
                            <option value="Pagado Completo" selected>Pagado Completo</option>
                            <option value="Apartado (50%)">Apartado (50%) / Anticipo</option>
                            <option value="Pago Parcial">Pago Parcial</option>
                            <option value="Pago al Entregar">Pago al Entregar</option>
                        </select>
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-check-circle"></i> Ejecutar Compra Simulada',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#00d2ff',
                cancelButtonColor: '#475569',
                background: '#0f172a',
                color: '#fff',
                preConfirm: () => {
                    const name = document.getElementById('swal-sim-name').value.trim();
                    const contact = document.getElementById('swal-sim-contact').value.trim();
                    const payment = document.getElementById('swal-sim-payment').value;
                    if (!name) {
                        Swal.showValidationMessage('Ingresa un nombre');
                        return false;
                    }
                    return { name, contact, payment };
                }
            });

            if (!buyerDetails) return;

            const sellerId = storeOwnerLinks.seller_id || window.currentStoreId;
            const totalAmount = Cart.getTotal();

            if (sellerId && typeof _supabase !== 'undefined') {
                try {
                    await _supabase.from('sealed_product_sales').insert([{
                        seller_id: sellerId,
                        buyer_name: buyerDetails.name,
                        buyer_contact: buyerDetails.contact,
                        items: items,
                        total_amount: totalAmount,
                        payment_status: buyerDetails.payment,
                        is_read: false
                    }]);

                    for (const item of items) {
                        if (item.id) {
                            const qty = parseInt(item.cart_quantity) || 1;
                            const { data: prod } = await _supabase.from('sealed_products').select('stock, quantity, status').eq('id', item.id).maybeSingle();
                            if (prod) {
                                const currentStock = prod.stock !== undefined ? parseInt(prod.stock) : (parseInt(prod.quantity) || 1);
                                const newStock = Math.max(0, currentStock - qty);
                                const newStatus = newStock === 0 ? 'Agotado' : (prod.status || 'Disponible');
                                await _supabase.from('sealed_products').update({ stock: newStock, quantity: newStock, status: newStatus }).eq('id', item.id);
                            }
                        }
                    }
                } catch (e) {
                    console.error("Error inserting simulated sale:", e);
                }
            }

            Cart.clear();
            renderCart();

            Swal.fire({
                title: '¡Compra Simulada Registrada!',
                text: `Se ha registrado la compra de ${buyerDetails.name} por $${totalAmount.toFixed(2)} (${buyerDetails.payment}). La notificación fue enviada en tiempo real al vendedor.`,
                icon: 'success',
                confirmButtonColor: '#00d2ff',
                background: '#0f172a',
                color: '#fff'
            });
        }

        async function payWithStripe() {
            const items = Cart.getAll();
            if (items.length === 0) return;

            const { value: buyerDetails } = await Swal.fire({
                title: 'Pago con Tarjeta via Stripe',
                html: `
                    <div style="text-align: left; font-family: sans-serif; font-size: 0.9rem;">
                        <p style="margin-bottom: 12px; color: #cbd5e1;">Ingresa tus datos para procesar el pago seguro con Stripe:</p>
                        <label style="display: block; margin-bottom: 4px; font-weight: bold; color: #635bff;">Tu Nombre Completo *</label>
                        <input id="swal-stripe-name" class="swal2-input" placeholder="Ej. Sutano Pérez" style="margin-top: 0; width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px;">

                        <label style="display: block; margin-top: 12px; margin-bottom: 4px; font-weight: bold; color: #635bff;">Correo Electrónico / Teléfono *</label>
                        <input id="swal-stripe-contact" class="swal2-input" placeholder="ejemplo@correo.com" style="margin-top: 0; width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px;">
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '<i class="fab fa-stripe-s"></i> Proceder al Pago Seguro',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#635bff',
                cancelButtonColor: '#475569',
                background: '#0f172a',
                color: '#fff',
                preConfirm: () => {
                    const name = document.getElementById('swal-stripe-name').value.trim();
                    const contact = document.getElementById('swal-stripe-contact').value.trim();
                    if (!name || !contact) {
                        Swal.showValidationMessage('Ingresa tu nombre y correo/teléfono');
                        return false;
                    }
                    return { name, contact };
                }
            });

            if (!buyerDetails) return;

            const sellerId = storeOwnerLinks.seller_id || window.currentStoreId;
            const totalAmount = Cart.getTotal();

            Swal.fire({ title: 'Conectando con Stripe...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                if (sellerId && typeof _supabase !== 'undefined') {
                    await _supabase.from('sealed_product_sales').insert([{
                        seller_id: sellerId,
                        buyer_name: buyerDetails.name,
                        buyer_contact: buyerDetails.contact,
                        items: items,
                        total_amount: totalAmount,
                        payment_status: 'Pagado con Tarjeta (Stripe)',
                        is_read: false
                    }]);

                    for (const item of items) {
                        if (item.id) {
                            const qty = parseInt(item.cart_quantity) || 1;
                            const { data: prod } = await _supabase.from('sealed_products').select('stock, quantity, status').eq('id', item.id).maybeSingle();
                            if (prod) {
                                const currentStock = prod.stock !== undefined ? parseInt(prod.stock) : (parseInt(prod.quantity) || 1);
                                const newStock = Math.max(0, currentStock - qty);
                                const newStatus = newStock === 0 ? 'Agotado' : (prod.status || 'Disponible');
                                await _supabase.from('sealed_products').update({ stock: newStock, quantity: newStock, status: newStatus }).eq('id', item.id);
                            }
                        }
                    }
                }

                let checkoutUrl = null;
                if (typeof _supabase !== 'undefined') {
                    try {
                        const { data } = await _supabase.functions.invoke('create-checkout-session', {
                            body: { items, buyer_name: buyerDetails.name, buyer_email: buyerDetails.contact, total_amount: totalAmount }
                        });
                        if (data && data.url) checkoutUrl = data.url;
                    } catch(e) {}
                }

                Cart.clear();
                renderCart();

                if (checkoutUrl) {
                    window.location.href = checkoutUrl;
                } else {
                    Swal.fire({
                        title: '¡Pago y Notificación Registrados!',
                        text: `Se registró la orden de ${buyerDetails.name} por $${totalAmount.toFixed(2)} (Stripe). Notificación enviada al vendedor.`,
                        icon: 'success',
                        confirmButtonColor: '#635bff',
                        background: '#0f172a',
                        color: '#fff'
                    });
                }
            } catch(e) {
                Swal.fire('Error', 'No se pudo iniciar el pago: ' + e.message, 'error');
            }
        }

        async function getAutofillUser() {
            let sessionUser = null;
            if (typeof _supabase !== 'undefined') {
                try {
                    const { data: { session } } = await _supabase.auth.getSession();
                    if (session && session.user) {
                        const { data: user } = await _supabase.from('usuarios').select('*').eq('id', session.user.id).maybeSingle();
                        if (user) sessionUser = user;
                    }
                } catch(e) {}
            }
            if (!sessionUser) {
                const cached = localStorage.getItem('tcg_session');
                if (cached) {
                    try { sessionUser = JSON.parse(cached); } catch(e) {}
                }
            }
            return sessionUser;
        }

        async function sendMessage(platform) {
            const items = Cart.getAll();
            if (items.length === 0) return;

            const firstItem = items[0];
            let whatsapp = storeOwnerLinks.whatsapp;
            let messenger = storeOwnerLinks.messenger;

            if (firstItem.whatsapp_link) whatsapp = firstItem.whatsapp_link;
            if (firstItem.messenger_link) messenger = firstItem.messenger_link;

            const sessionUser = await getAutofillUser();
            const defaultName = sessionUser ? (sessionUser.store_name || sessionUser.username || (sessionUser.user_metadata && sessionUser.user_metadata.name) || '') : '';
            const defaultPhone = sessionUser ? (sessionUser.whatsapp_link || (sessionUser.user_metadata && sessionUser.user_metadata.phone) || '') : '';

            const hasPreorders = items.some(it => it.unit_deposit !== undefined && it.unit_deposit !== null);

            let paymentOptionsHtml = '';
            if (!hasPreorders) {
                paymentOptionsHtml = `
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #00d2ff; font-size: 0.9rem;">Opciones de pago</label>
                        <select id="swal-payment-status" style="width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none;">
                            <option value="Pagar en local">Pagar en local</option>
                            <option value="Pagar por transferencia">Pagar por transferencia</option>
                            <option value="Apartar 50%">Apartar 50%</option>
                        </select>
                    </div>
                `;
            }

            const { value: buyerDetails } = await Swal.fire({
                title: '<span style="font-size: 1.35rem; font-weight: 800; color: #fff;">Confirmar Pedido</span>',
                html: `
                    <div style="text-align: left; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 5px 0;">
                        <div style="margin-bottom: 14px;">
                            <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #00d2ff; font-size: 0.9rem;">Nombre *</label>
                            <input id="swal-buyer-name" type="text" placeholder="Ingresa tu nombre" value="${defaultName}" style="width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none;">
                        </div>

                        <div style="margin-bottom: 14px;">
                            <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #00d2ff; font-size: 0.9rem;">Teléfono *</label>
                            <input id="swal-buyer-contact" type="tel" placeholder="Ej. 55-1234-5678" value="${defaultPhone}" style="width: 100%; box-sizing: border-box; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none;">
                        </div>

                        ${paymentOptionsHtml}
                    </div>
                `,
                customClass: {
                    popup: 'cart-swal-clean-modal'
                },
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: platform === 'whatsapp' ? '<i class="fab fa-whatsapp"></i> Enviar por WhatsApp' : '<i class="fab fa-facebook-messenger"></i> Enviar por Messenger',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: platform === 'whatsapp' ? '#25d366' : '#006aff',
                cancelButtonColor: '#475569',
                background: '#0f172a',
                color: '#fff',
                width: '460px',
                padding: '24px',
                preConfirm: () => {
                    const name = document.getElementById('swal-buyer-name').value.trim();
                    const contact = document.getElementById('swal-buyer-contact').value.trim();
                    const paymentSelect = document.getElementById('swal-payment-status');
                    const payment = paymentSelect ? paymentSelect.value : 'Preventa (Abono Configurado)';
                    if (!name) {
                        Swal.showValidationMessage('Ingresa tu nombre');
                        return false;
                    }
                    if (!contact) {
                        Swal.showValidationMessage('Ingresa tu teléfono');
                        return false;
                    }
                    return { name, contact, payment };
                }
            });

            if (!buyerDetails) return;

            const sellerId = storeOwnerLinks.seller_id || window.currentStoreId;
            const totalAmount = Cart.getTotal();

            if (sellerId && typeof _supabase !== 'undefined') {
                try {
                    await _supabase.from('sealed_product_sales').insert([{
                        seller_id: sellerId,
                        buyer_name: buyerDetails.name,
                        buyer_contact: buyerDetails.contact,
                        items: items,
                        total_amount: totalAmount,
                        payment_status: buyerDetails.payment,
                        is_read: false
                    }]);

                    for (const item of items) {
                        if (item.id) {
                            const qty = parseInt(item.cart_quantity) || 1;
                            const { data: prod } = await _supabase.from('sealed_products').select('stock, quantity, status').eq('id', item.id).maybeSingle();
                            if (prod) {
                                const currentStock = prod.stock !== undefined ? parseInt(prod.stock) : (parseInt(prod.quantity) || 1);
                                const newStock = Math.max(0, currentStock - qty);
                                const newStatus = newStock === 0 ? 'Agotado' : (prod.status || 'Disponible');
                                await _supabase.from('sealed_products').update({ stock: newStock, quantity: newStock, status: newStatus }).eq('id', item.id);
                            }
                        }
                    }
                } catch (e) {
                    console.error("Error logging sale transaction:", e);
                }
            }

            let message = `Hola, mi nombre es *${buyerDetails.name}* (${buyerDetails.contact || 'Sin teléfono'}).\n`;
            message += `Estado de Pago: *${buyerDetails.payment}*\n\n`;
            message += "Deseo adquirir los siguientes artículos:\n\n";

            items.forEach((item, index) => {
                const qty = parseInt(item.cart_quantity) || 1;
                const isPreorderDeposit = item.unit_deposit !== undefined && item.unit_deposit !== null;
                const unitPrice = isPreorderDeposit ? parseFloat(item.unit_deposit) : (parseFloat((item.price || "0").toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0);
                const subtotal = unitPrice * qty;

                const detailParts = [];
                if (isPreorderDeposit) {
                    const fullPrice = parseFloat(item.total_unit_price) || (parseFloat((item.price || "0").toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0);
                    detailParts.push(`PREVENTA - Abono: $${unitPrice.toFixed(2)}/u de Total: $${fullPrice.toFixed(2)}/u`);
                }
                if (item.deadline) detailParts.push(`Límite Pago: ${item.deadline}`);
                if (item.rarity && item.rarity !== '-') detailParts.push(item.rarity);
                if (item.language && item.language !== '-') detailParts.push(item.language);
                if (item.edition && item.edition !== '-') detailParts.push(item.edition);
                const tag = detailParts.length > 0 ? ` (${detailParts.join(' - ')})` : '';
                message += `${index + 1}. ${item.name}${tag} x${qty} - $${subtotal.toFixed(2)}\n`;
            });
            message += `\nTotal: $${totalAmount.toFixed(2)}`;

            const encodedMsg = encodeURIComponent(message);

            if (platform === 'whatsapp') {
                const waNumber = whatsapp.replace(/\D/g, '');
                if (!waNumber) {
                    Swal.fire('Error', 'No hay un número de WhatsApp configurado para este vendedor.', 'error');
                    return;
                }
                window.open(`https://wa.me/${waNumber}?text=${encodedMsg}`, '_blank');
            } else {
                let messengerLink = messenger;
                if (!messengerLink) {
                    Swal.fire('Error', 'No hay un enlace de Messenger configurado para este vendedor.', 'error');
                    return;
                }
                if (!messengerLink.startsWith('http')) {
                    messengerLink = `https://m.me/${messengerLink}`;
                }
                const separator = messengerLink.includes('?') ? '&' : '?';
                window.open(`${messengerLink}${separator}text=${encodedMsg}`, '_blank');
            }
        }
    </script>

    <div class="bottom-nav">
        <div class="nav-item" id="btn-nav-home" title="Ir al Home">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item" id="btn-nav-return" title="Volver">
            <i class="fas fa-chevron-left"></i>
        </div>
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("Service Worker registrado", reg))
                    .catch(err => console.warn("Error al registrar Service Worker", err));
            });
        }
    </script>
</body>
