<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #333; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px; }
        .container { width: 300px; height: 400px; position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .label { color: white; text-align: center; margin-bottom: 10px; font-weight: bold; grid-column: span 1; }
    </style>
</head>
<body>
    <div class="label">Standard (Vault)</div>
    <div class="label">Cosmic (Galaxy)</div>
    <div class="label">Holographic</div>

    <div class="container textured-cover style-standard"><h2>Test Album</h2></div>
    <div class="container textured-cover style-cosmic"><h2>Galaxy Test</h2></div>
    <div class="container textured-cover style-holographic"><h2>Holo Test</h2></div>

    <div class="label">Luxury</div>
    <div class="label">Marble</div>
    <div class="label">Velvet</div>

    <div class="container textured-cover style-luxury"><h2>Luxury Test</h2></div>
    <div class="container textured-cover style-marble"><h2>Marble Test</h2></div>
    <div class="container textured-cover style-velvet"><h2>Velvet Test</h2></div>
</body>
</html>
