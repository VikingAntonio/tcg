<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Preventas - Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        /* New UI Components Styles */
        .modal-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .modal-tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .modal-tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .modal-tab-btn.active {
            color: var(--primary-color, #00d2ff);
            border-bottom-color: var(--primary-color, #00d2ff);
            background: rgba(255, 255, 255, 0.05);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Share Modal Styles */
        .share-modal-content {
            max-width: 400px !important;
            text-align: center;
            padding: 40px !important;
        }
        #share-qr-code img {
            margin: 0 auto;
            border-radius: 8px;
        }
        .social-share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .social-share-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            border: none;
        }
        .social-share-btn:hover {
            transform: scale(1.1);
        }
        .social-share-btn.wa { background: #25D366; }
        .social-share-btn.tg { background: #0088cc; }
        .social-share-btn.fb { background: #3b5998; }
        .social-share-btn.ms { background: #0084ff; }

        /* External Search Results */
        .external-item {
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
        }
        .external-item:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>
    <!-- Floating User Panel -->
    <div class="top-left-panel" id="top-panel" style="display: none;">
        <div class="user-menu-container">
            <button class="user-avatar-btn" id="avatar-btn">
                <i class="fas fa-user"></i>
            </button>
            <div class="user-dropdown-menu" id="user-dropdown">
                <div class="user-dropdown-info">
                    <img id="dropdown-user-logo" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: none;">
                    <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                </div>
                <a href="admin.html" class="menu-item"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
                <a href="#" class="menu-item logout" id="menu-btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </div>
        </div>
    </div>

    <div id="authenticated-content" style="display: none; width: 100%; max-width: 1200px; margin: 0 auto; padding-top: 80px; padding-bottom: 100px;">
        <div class="admin-header">
            <a href="admin.html" class="btn btn-secondary" style="margin-bottom: 20px; text-decoration: none; display: inline-block;">
                <i class="fas fa-arrow-left"></i> Volver al Panel
            </a>
            <h1>Gestión de Preventas</h1>
            <p>Administra las próximas expansiones y productos con preventa activa de forma profesional.</p>
            <button id="btn-open-add-modal" class="btn" style="margin-top: 20px; background: var(--viking-gradient);">
                <i class="fas fa-plus"></i> Añadir Preventa
            </button>
        </div>

        <div id="preorder-list" class="album-list">
            <!-- Preorders will be loaded here -->
            <div class="loading">Cargando preventas...</div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-overlay" class="overlay">
        <div class="overlay-content share-modal-content">
            <span id="close-share-modal" class="close-btn" onclick="$('#share-overlay').removeClass('active')">&times;</span>
            <h2 id="share-modal-title">Compartir</h2>

            <div id="share-qr-container" style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: inline-block;">
                <div id="share-qr-code"></div>
            </div>

            <div class="form-group" style="text-align: left;">
                <label>Enlace Directo</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="share-link-input" readonly style="flex: 1;">
                    <button id="btn-copy-share-link" class="btn btn-sm" style="white-space: nowrap;"><i class="fas fa-copy"></i></button>
                </div>
            </div>

            <div class="social-share-grid">
                <button class="social-share-btn wa" id="share-wa" title="WhatsApp"><i class="fab fa-whatsapp"></i></button>
                <button class="social-share-btn tg" id="share-tg" title="Telegram"><i class="fab fa-telegram-plane"></i></button>
                <button class="social-share-btn fb" id="share-fb" title="Facebook"><i class="fab fa-facebook-f"></i></button>
                <button class="social-share-btn ms" id="share-ms" title="Messenger"><i class="fab fa-facebook-messenger"></i></button>
            </div>
        </div>
    </div>

    <!-- Preorder Modal -->
    <div id="preorder-modal" class="overlay">
        <div class="overlay-content" style="padding: 0; overflow: hidden; border-radius: 20px; max-width: 600px;">
            <div style="padding: 25px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
                <h2 id="modal-title" style="margin: 0; font-size: 1.5rem; font-weight: 800;">Añadir Preventa</h2>
                <span id="close-preorder-modal" class="close-btn" style="position: static; font-size: 28px;">&times;</span>
            </div>

            <!-- Modal Tabs -->
            <div class="modal-tabs">
                <div class="modal-tab-btn active" data-tab="tab-search">BÚSQUEDA</div>
                <div class="modal-tab-btn" data-tab="tab-data">DATOS</div>
            </div>

            <div style="padding: 30px; max-height: 70vh; overflow-y: auto;">
                <input type="hidden" id="edit-preorder-id">

                <!-- Tab: Search -->
                <div id="tab-search" class="tab-content active">
                    <div class="form-group">
                        <label><i class="fas fa-search"></i> Buscar en Base de Datos Global</label>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <input type="text" id="external-search-input" placeholder="Nombre de la expansión o preventa..." style="flex: 1;">
                            <button id="btn-external-search" class="btn" style="padding: 10px 20px;"><i class="fas fa-search"></i></button>
                        </div>
                        <div id="external-search-results" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); min-height: 150px;">
                            <div style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">Usa el buscador para encontrar expansiones oficiales</div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Data -->
                <div id="tab-data" class="tab-content">
                    <div class="form-group">
                        <label>Nombre de la Preventa</label>
                        <input type="text" id="preorder-name" placeholder="Ej: Phantom Nightmare Booster Box">
                    </div>

                    <div class="form-group">
                        <label>Imagen de la Preventa</label>
                        <label class="file-drop-zone" id="drop-zone-preorder" for="input-preorder-file" style="display: block;">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Arrastra una imagen aquí o haz clic para subir</p>
                            <input type="file" id="input-preorder-file" accept="image/*" style="display: none;">
                            <div class="file-name" style="font-size: 12px; color: #00d2ff; margin-top: 5px;"></div>
                        </label>
                        <input type="text" id="preorder-image-url" placeholder="O pega el link directo de la imagen...">
                    </div>

                    <div class="info-grid">
                        <div class="form-group">
                            <label>Precio</label>
                            <input type="text" id="preorder-price" placeholder="Ej: $1,200.00">
                        </div>
                        <div class="form-group">
                            <label>TCG</label>
                            <select id="preorder-tcg">
                                <option value="yugioh">Yu-Gi-Oh!</option>
                                <option value="pokemon">Pokémon</option>
                                <option value="onepiece">One Piece</option>
                                <option value="lorcana">Lorcana</option>
                                <option value="other">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Fecha Límite de Pago</label>
                        <input type="text" id="preorder-deadline" placeholder="Ej: 15 de Octubre, 2024">
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        <label class="switch">
                            <input type="checkbox" id="preorder-public" checked>
                            <span class="slider"></span>
                        </label>
                        <label style="margin-bottom: 0; cursor: pointer; font-weight: 600;" for="preorder-public">Preventa Pública (Visible en tienda)</label>
                    </div>
                </div>
            </div>

            <div style="padding: 20px 30px; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.01);">
                <button id="btn-save-preorder" class="btn" style="width: 100%; height: 50px; font-weight: 800; letter-spacing: 1px;">
                    <i class="fas fa-check-circle"></i> GUARDAR PREVENTA
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/viking-data.js"></script>
    <script src="js/preventas.js"></script>

    <div class="bottom-nav">
        <div class="nav-item" id="btn-nav-home" title="Ir al Home">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item" id="btn-nav-return" title="Volver">
            <i class="fas fa-chevron-left"></i>
        </div>
    </div>
</body>
</html>
