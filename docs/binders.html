<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Mis Álbumes - VikingTCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/binders.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
</head>
<body>
    <!-- Floating User Panel -->
    <div class="top-left-panel" id="top-panel" style="display: none;">
        <div class="pill-panel">
            <div class="pill-group" id="header-theme-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light" title="Modo Claro"><i class="fas fa-sun"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple" title="Modo Morado"><i class="fas fa-magic"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-dark" title="Modo Oscuro"><i class="fas fa-moon"></i></button>
            </div>

            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn" title="Usuario">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info">
                        <img id="dropdown-user-logo" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: none;">
                        <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                    </div>
                    <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> Mi Panel</a>
                    <a href="decks.html" class="menu-item"><i class="fas fa-layer-group"></i> Mis Decks</a>
                    <a href="#" class="menu-item logout" id="menu-btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="overlay">
        <div class="overlay-content login-container">
            <h1>Iniciar Sesión</h1>
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="login-username" placeholder="Tu nombre de usuario">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="********">
            </div>
            <button id="btn-login" class="btn" style="width: 100%; margin-bottom: 15px;">Entrar</button>
        </div>
    </div>

    <!-- Authenticated Content -->
    <div id="authenticated-content" style="display: none; width: 100%; max-width: 1200px; margin: 0 auto; padding-top: 100px;">

        <!-- Dashboard View (Albums) -->
        <div id="view-dashboard" class="admin-section">
            <div class="admin-header">
                <a href="admin.html" class="btn btn-secondary" style="margin-bottom: 20px; text-decoration: none; display: inline-block;"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
                <h1>Mis Álbumes</h1>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button id="btn-create-album" class="btn"><i class="fas fa-plus"></i> Crear Nuevo Álbum</button>
                    <button id="btn-organize-albums" class="btn btn-secondary"><i class="fas fa-sort"></i> Organizar</button>
                </div>
            </div>
            <div id="album-list" class="album-list">
                <div class="loading">Cargando álbumes...</div>
            </div>
        </div>

        <!-- Album Editor View -->
        <div id="view-editor" class="admin-section" style="display:none;">
            <div class="admin-header">
                <button id="btn-back-to-albums" class="btn btn-secondary" style="margin-bottom: 20px;"><i class="fas fa-arrow-left"></i> Volver a Álbumes</button>
                <h1 id="editor-title">Editar Álbum</h1>
                <button id="btn-save-album-meta" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
            </div>

            <div class="album-card" style="max-width: 600px; margin: 0 auto 40px;">
                <div class="form-group">
                    <label>Título del Álbum</label>
                    <input type="text" id="input-album-title" placeholder="Nuevo Álbum">
                </div>
                <div class="form-group">
                    <label>Portada (URL)</label>
                    <div class="color-input-wrapper">
                        <input type="text" id="input-album-cover" placeholder="midominio.com/portada.png" style="flex:1;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraportada (URL)</label>
                    <div class="color-input-wrapper">
                        <input type="text" id="input-album-back" placeholder="midominio.com/contraportada.png" style="flex:1;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="switch">
                        <input type="checkbox" id="input-album-public" checked>
                        <span class="slider"></span>
                    </label>
                    <label style="display: inline-block; margin-left: 10px;">Álbum Público</label>
                </div>
            </div>

            <div class="admin-header">
                <h2><i class="fas fa-file-alt"></i> Páginas</h2>
                <button id="btn-add-page" class="btn"><i class="fas fa-plus-circle"></i> Añadir Página</button>
            </div>
            <div id="page-list" class="page-list-container"></div>
            <div id="btn-add-page-bottom-container" style="text-align: center; margin-top: 30px; margin-bottom: 20px; display: none;">
                <button id="btn-add-page-bottom" class="btn"><i class="fas fa-plus-circle"></i> Añadir Página</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="gltf-overlay" class="overlay">
        <span id="close-gltf-overlay" class="close-btn-floating">&times;</span>
        <div class="overlay-content gltf-expanded-content">
            <model-viewer id="expanded-gltf-viewer" loading="lazy" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" exposure="1.2" oncontextmenu="return false;"></model-viewer>
            <div class="card-info"><div id="expanded-gltf-name" class="card-name">Nombre del Compañero</div></div>
        </div>
    </div>

    <div id="share-overlay" class="overlay">
        <div class="overlay-content">
            <span id="close-share-modal" class="close-btn">&times;</span>
            <h2 id="share-modal-title">Compartir</h2>
            <div id="share-qr-code" style="background:white; padding:10px; border-radius:10px; margin-bottom:10px; display: flex; justify-content: center;"></div>
            <input type="text" id="share-link-input" readonly style="width:100%; background: #222; color: #00d2ff; border: 1px solid #333; padding: 10px; border-radius: 8px;">
            <div id="embed-code-container" style="display:none; margin-top:10px;">
                <label style="font-size: 10px; color: #888;">Código de Inserción</label>
                <textarea id="embed-code-input" readonly style="width:100%; height:60px; background: #111; color: #aaa; border: 1px solid #222; font-family: monospace; font-size: 11px;"></textarea>
            </div>
        </div>
    </div>

    <div id="slot-modal" class="overlay">
        <div class="overlay-content">
            <span id="close-slot-modal" class="close-btn">&times;</span>
            <h2 style="margin-bottom: 20px;">Editar Espacio</h2>
            <div class="slot-modal-tabs">
                <button class="slot-tab-btn active" data-tab="slot-tab-info">Información</button>
                <button class="slot-tab-btn" data-tab="slot-tab-details">Detalles</button>
            </div>
            <div id="slot-tab-info" class="slot-tab-content active">
                <div class="form-group">
                    <input type="text" id="external-search-input" placeholder="Buscar carta..." style="width: calc(100% - 70px); display: inline-block;">
                    <button id="btn-external-search" class="btn" style="width: 60px; padding: 10px;"><i class="fas fa-search"></i></button>
                    <div id="external-search-results" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 10px; max-height: 120px; overflow-y: auto;"></div>
                </div>
                <div class="form-group">
                    <label>URL de la Imagen</label>
                    <input type="text" id="slot-image-url" placeholder="midominio.com/carta.png">
                </div>
                <div class="form-group">
                    <label>Nombre de la Carta</label>
                    <input type="text" id="slot-name">
                </div>
            </div>
            <div id="slot-tab-details" class="slot-tab-content">
                <div class="form-group">
                    <label>Rareza</label>
                    <input type="text" id="slot-rarity">
                </div>
                <div class="form-group">
                    <label>Precio</label>
                    <input type="text" id="slot-price">
                </div>
            </div>
            <button id="btn-save-slot" class="btn" style="width: 100%; margin-top: 15px;">Guardar Carta</button>
        </div>
    </div>

    <div id="organize-modal" class="overlay">
        <div class="overlay-content" style="max-width: 600px;">
            <span id="close-organize-modal" class="close-btn">&times;</span>
            <h2 style="margin-bottom: 10px;"><i class="fas fa-sort"></i> Organizar</h2>
            <div id="organize-grid" class="organize-grid"></div>
            <button id="btn-finish-organize" class="btn" style="width: 100%; margin-top: 20px;">Finalizar Orden</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" id="btn-nav-home" title="Ir al Home"><i class="fas fa-home"></i></div>
        <div class="nav-item" id="btn-nav-return" title="Volver"><i class="fas fa-chevron-left"></i></div>
    </div>

    <div id="companion-wrapper">
        <div class="companion-drag-handle" id="companion-drag-handle"><i class="fas fa-arrows-alt"></i></div>
        <div class="companion-bubble" id="companion-bubble"></div>
        <div id="floating-companion-container"></div>
        <div class="companion-menu-popup" id="companion-menu">
            <div class="companion-menu-item" id="menu-item-chat"><i class="fas fa-comment-dots"></i> Chatear</div>
            <div class="companion-menu-item" id="menu-item-play"><i class="fas fa-gamepad"></i> Jugar</div>
            <div class="companion-menu-item" id="menu-item-details"><i class="fas fa-search-plus"></i> Ver Detalle</div>
        </div>
    </div>

    <div id="chatbot-container">
        <div class="chatbot-header">
            <h3><i class="fas fa-robot"></i> Viking Assistant</h3>
            <span id="close-chatbot" style="cursor:pointer; font-size: 1.5rem;">&times;</span>
        </div>
        <div class="chatbot-messages" id="chat-messages"></div>
        <div class="chatbot-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="Escribe tu duda...">
                <button id="send-chat" class="btn btn-sm"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/viking-data.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/ztext.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/companion-bot.js"></script>
    <script type="text/javascript" src="js/turn.js"></script>
    <script src="js/binders.js"></script>
</body>
</html>
