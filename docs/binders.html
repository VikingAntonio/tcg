<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <link rel="manifest" href="manifest.json">
    <title>Vikingdev TCG - Álbumes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"/>
    <style>
        .switch-searching { position: absolute; top: 5px; left: 5px; z-index: 100; display: flex; align-items: center; }
        .switch-mini { width: 32px !important; height: 18px !important; }
        .switch-mini .slider:before { height: 12px !important; width: 12px !important; left: 3px !important; bottom: 3px !important; }
        .switch-mini input:checked + .slider:before { transform: translateX(14px) !important; }
        .switch-mini input:checked + .slider { background-color: #ff4757; }

        .wishlist-tab-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s ease; white-space: nowrap; }
        .wishlist-tab-btn.active { background: var(--primary-color); color: #000; border-color: var(--primary-color); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }

        /* Modern Slot Modal Styling */
        #slot-modal .overlay-content {
            background: linear-gradient(145deg, #121824, #0a0e17) !important;
            border: 1px solid rgba(0, 210, 255, 0.25) !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0, 210, 255, 0.15) !important;
            border-radius: 20px !important;
            padding: 30px !important;
        }

        #slot-modal h2 {
            font-size: 1.6rem !important;
            font-weight: 900 !important;
            letter-spacing: 0.5px !important;
            color: #fff !important;
            margin-bottom: 20px !important;
            text-align: center !important;
        }

        .slot-modal-tabs {
            display: flex !important;
            gap: 12px !important;
            justify-content: center !important;
            margin-bottom: 25px !important;
            background: rgba(255, 255, 255, 0.04) !important;
            padding: 6px !important;
            border-radius: 50px !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .slot-tab-btn {
            flex: 1 !important;
            padding: 10px 20px !important;
            border-radius: 50px !important;
            border: none !important;
            background: transparent !important;
            color: #94a3b8 !important;
            font-weight: 800 !important;
            font-size: 0.88rem !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            text-align: center !important;
        }

        .slot-tab-btn.active {
            background: linear-gradient(135deg, #00d2ff, #0072ff) !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4) !important;
        }

        .binder-form-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 16px !important;
        }

        @media (max-width: 640px) {
            .binder-form-grid {
                grid-template-columns: 1fr !important;
            }
        }

        .binder-form-grid .form-group {
            margin-bottom: 0 !important;
        }

        .binder-form-grid .form-group.full-width {
            grid-column: 1 / -1 !important;
        }

        .binder-form-grid label {
            display: block !important;
            font-size: 0.75rem !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.8px !important;
            color: #64748b !important;
            margin-bottom: 6px !important;
        }

        .binder-form-grid input {
            width: 100% !important;
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 12px !important;
            padding: 12px 14px !important;
            color: #fff !important;
            font-size: 0.92rem !important;
            font-weight: 600 !important;
            outline: none !important;
            transition: all 0.2s ease !important;
            box-sizing: border-box !important;
        }

        .binder-form-grid input:focus {
            border-color: #00d2ff !important;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3) !important;
            background: rgba(15, 23, 42, 0.95) !important;
        }

        .card-preview-thumb-box {
            width: 90px;
            height: 125px;
            border-radius: 10px;
            border: 2px dashed rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-preview-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #btn-save-slot {
            background: linear-gradient(135deg, #00ff88, #00b894) !important;
            color: #000 !important;
            font-weight: 900 !important;
            font-size: 1.05rem !important;
            padding: 14px !important;
            border-radius: 14px !important;
            border: none !important;
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.35) !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }

        #btn-save-slot:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.5) !important;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tcgdex/sdk@2/dist/tcgdex.browser.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>
    <div class="top-left-panel" id="top-panel" style="display: none;">
        <div class="pill-panel">
            <div class="pill-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light"><i class="fas fa-sun"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple"><i class="fas fa-magic"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-dark"><i class="fas fa-moon"></i></button>
            </div>
            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn"><i class="fas fa-user"></i></button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info"><div id="dropdown-user-name">Usuario</div></div>
                    <a href="#" class="menu-item logout" id="menu-btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="overlay">
        <div class="overlay-content login-container">
            <h1>Iniciar Sesión</h1>
            <div class="form-group"><label>Usuario</label><input type="text" id="login-username"></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="login-password"></div>
            <button id="btn-login" class="btn" style="width: 100%;">Entrar</button>
        </div>
    </div>

    <div id="authenticated-content" style="display: none; width: 100%; max-width: 1200px; margin: 0 auto; padding-top: 100px;">
        <div id="view-dashboard" class="admin-section">
            <div class="admin-header">
                <button id="btn-back-to-web" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver a la Web</button>
                <h1>Mis Álbumes</h1>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button id="btn-create-album" class="btn"><i class="fas fa-plus"></i> Crear Nuevo Álbum</button>
                    <button id="btn-organize-albums" class="btn btn-secondary"><i class="fas fa-sort"></i> Organizar</button>
                </div>
            </div>
            <div id="album-list" class="album-list"></div>
        </div>

        <div id="view-editor" class="admin-section" style="display:none;">
            <div class="admin-header">
                <button id="btn-back-to-albums" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</button>
                <h1 id="editor-title">Editar Álbum</h1>
                <button id="btn-save-album-meta" class="btn"><i class="fas fa-save"></i> Guardar Cambios</button>
            </div>
            <div class="album-card" style="max-width: 600px; margin: 0 auto 40px;">
                <div class="form-group"><label>Título</label><input type="text" id="input-album-title"></div>
                <div class="form-group">
                    <label><i class="fas fa-th"></i> Tamaño de la Carpeta (Filas x Columnas)</label>
                    <select id="input-album-grid-layout" style="width: 100%; background: #222; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px;">
                        <option value="3x3">3x3 (9 Cartas)</option>
                        <option value="4x4">4x4 (16 Cartas)</option>
                        <option value="2x2">2x2 (4 Cartas)</option>
                        <option value="1x1">1x1 (1 Carta)</option>
                    </select>
                </div>
                <div class="form-group"><label>Portada URL</label><input type="text" id="input-album-cover"></div>
                <div class="form-group"><label>Contraportada URL</label><input type="text" id="input-album-back"></div>
                <div class="form-group" style="display: flex; align-items: center; gap: 15px;"><label class="switch"><input type="checkbox" id="input-album-public"><span class="slider"></span></label><label>Público</label></div>
            </div>
            <div class="admin-header"><h2>Páginas</h2><button id="btn-add-page" class="btn">Añadir Página</button></div>
            <div id="page-list" class="page-list-container"></div>
        </div>
    </div>

    <div id="slot-modal" class="overlay">
        <div class="overlay-content" style="max-width: 680px; width: 95%;">
            <span id="close-slot-modal" class="close-btn">&times;</span>
            <h2><i class="fas fa-layer-group" style="color: #00d2ff;"></i> Detalle de Carta</h2>

            <div class="slot-modal-tabs">
                <button class="slot-tab-btn active" data-tab="slot-tab-info"><i class="fas fa-info-circle"></i> Información General</button>
                <button class="slot-tab-btn" data-tab="slot-tab-images"><i class="fas fa-images"></i> Galerías / Fotos</button>
            </div>

            <div id="slot-tab-info" class="slot-tab-content active">
                <div class="binder-form-grid">
                    <!-- External API Search -->
                    <div class="form-group full-width" style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06);">
                        <label><i class="fas fa-search" style="color: #00d2ff;"></i> Buscar en Base de Datos Externa</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="external-search-input" placeholder="Nombre o código de carta..." style="flex: 1;">
                            <button id="btn-external-search" class="btn" style="background: linear-gradient(135deg, #00d2ff, #0072ff); color: #fff; font-weight: 800; padding: 0 20px; border-radius: 12px; border: none;"><i class="fas fa-search"></i> Buscar</button>
                        </div>
                        <div id="external-search-results" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 12px; max-height: 160px; overflow-y: auto;"></div>
                    </div>

                    <!-- Main Image Preview & Input -->
                    <div class="form-group full-width" style="display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);">
                        <div class="card-preview-thumb-box" id="slot-image-preview-container">
                            <i class="fas fa-image" id="slot-preview-placeholder" style="color: #475569; font-size: 1.8rem;"></i>
                            <img id="slot-preview-img" src="" style="display: none;">
                        </div>
                        <div style="flex: 1;">
                            <div class="form-group" style="margin-bottom: 8px;">
                                <label><i class="fas fa-font"></i> Nombre de la Carta *</label>
                                <input type="text" id="slot-name" placeholder="Ej: Dark Magician">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-link"></i> URL Imagen Principal</label>
                                <input type="text" id="slot-image-url" placeholder="https://...">
                            </div>
                        </div>
                    </div>

                    <!-- Pricing & Collect Investment Section -->
                    <div class="form-group">
                        <label><i class="fas fa-hand-holding-usd" style="color: #f59e0b;"></i> Inversión / Costo ($)</label>
                        <input type="number" step="0.01" id="slot-cost-price" placeholder="0.00" style="border-color: rgba(245, 158, 11, 0.4) !important;">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tag" style="color: #00ff88;"></i> Precio Venta Público ($)</label>
                        <input type="number" step="0.01" id="slot-price" placeholder="0.00" style="border-color: rgba(0, 255, 136, 0.4) !important; color: #00ff88 !important; font-weight: 800 !important;">
                    </div>

                    <!-- Rarity & Set -->
                    <div class="form-group">
                        <label><i class="fas fa-gem"></i> Rareza</label>
                        <input type="text" id="slot-rarity" placeholder="Ej: Secret Rare">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-box-open"></i> Expansión / Edición</label>
                        <input type="text" id="slot-expansion" placeholder="Ej: LOB-001">
                    </div>

                    <!-- Condition -->
                    <div class="form-group full-width">
                        <label><i class="fas fa-shield-alt"></i> Estado de Conservación</label>
                        <input type="text" id="slot-condition" placeholder="M (Mint), NM (Near Mint), LP (Lightly Played)...">
                    </div>
                </div>
            </div>

            <div id="slot-tab-images" class="slot-tab-content" style="display:none;">
                <div class="form-group">
                    <label style="font-size: 0.85rem; font-weight: 800; color: #94a3b8; margin-bottom: 10px; display: block;">Imágenes Adicionales de la Carta (Drag & Drop o Seleccionar)</label>
                    <div id="slot-dropzone" style="border: 2px dashed rgba(0, 210, 255, 0.4); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; background: rgba(15, 23, 42, 0.6); margin-bottom: 15px; transition: all 0.3s ease;">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: #00d2ff; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(0,210,255,0.4));"></i>
                        <p style="margin: 0 0 6px 0; font-size: 1rem; font-weight: 800; color: #fff;">Arrastra tus fotos o haz clic aquí</p>
                        <p style="margin: 0; font-size: 0.8rem; color: #64748b;">Formatos JPG, PNG, WEBP permitidos</p>
                        <input type="file" id="slot-file-input" multiple accept="image/*" style="display: none;">
                    </div>
                    <div id="slot-extra-images-preview" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 15px;"></div>
                </div>
            </div>

            <button id="btn-save-slot" class="btn" style="width: 100%; margin-top: 20px;"><i class="fas fa-check-circle"></i> Guardar Carta en Binder</button>
        </div>
    </div>

    <div id="organize-modal" class="overlay">
        <div class="overlay-content" style="max-width: 600px;">
            <span id="close-organize-modal" class="close-btn">&times;</span>
            <h2>Organizar</h2>
            <div id="organize-grid" class="organize-grid"></div>
            <button id="btn-finish-organize" class="btn" style="width: 100%; margin-top: 20px;">Finalizar</button>
        </div>
    </div>

    <div id="share-overlay" class="overlay">
        <div class="overlay-content share-modal-content">
            <span id="close-share-modal" class="close-btn">&times;</span>
            <h2 id="share-modal-title">Compartir</h2>
            <div id="share-qr-code" style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px;"></div>
            <div class="form-group"><label>Link</label><input type="text" id="share-link-input" readonly></div>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/cloudinary-upload.js"></script>
    <script src="js/viking-data.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/michatbot.js"></script>

    <script src="js/utils.js"></script>
    <script src="js/ztext.js"></script>
    <script type="text/javascript" src="js/turn.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
    <script src="js/binders.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado', reg))
                    .catch(err => console.warn('Error al registrar Service Worker', err));
            });
        }
    </script>
</body>
</html>
