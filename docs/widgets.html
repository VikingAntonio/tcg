<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Labels - Viking TCG</title>
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #0b0f19; color: #f8fafc; font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        .widgets-main-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 90px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .widgets-nav-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }

        .btn-back-clean {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.25 ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .btn-back-clean:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
            transform: translateY(-2px);
        }

        .widgets-buttons-wrapper {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .widgets-buttons-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .btn-widget-copy {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 28px 20px;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            user-select: none;
        }

        .btn-widget-copy:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.25));
            border-color: #38bdf8;
            color: #38bdf8;
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.25);
        }

        .btn-widget-copy:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <!-- Floating User Panel -->
    <div class="top-left-panel" id="top-panel" style="display: none;">
        <div class="pill-panel">
            <div class="pill-group" id="header-theme-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light" title="Modo Claro"><i class="fas fa-sun"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple" title="Modo Morado"><i class="fas fa-magic"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-dark" title="Modo Oscuro"><i class="fas fa-moon"></i></button>
            </div>

            <a href="carrito.html" id="cart-btn" class="pill-icon" title="Carrito">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </a>

            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn" title="Usuario">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info">
                        <img id="dropdown-user-logo" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: none;">
                        <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                        <div class="user-dropdown-role" id="dropdown-user-role" style="display: none;">Admin</div>
                    </div>
                    <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> Mi Panel</a>
                    <a href="play.html" class="menu-item"><i class="fas fa-gamepad"></i> Play!</a>
                    <a href="binders.html" class="menu-item"><i class="fas fa-book"></i> Mis Álbumes</a>
                    <a href="decks.html" class="menu-item"><i class="fas fa-layer-group"></i> Mis Decks</a>
                    <a href="scanner.html" class="menu-item"><i class="fas fa-barcode"></i> Scanner de Cartas</a>
                    <a href="learn.html" class="menu-item"><i class="fas fa-brain"></i> Base de Conocimiento</a>
                    <a href="widgets.html" class="menu-item"><i class="fas fa-code"></i> Custom Labels</a>
                    <a href="dominios.html" class="menu-item"><i class="fas fa-globe"></i> Gestión de Dominios</a>
                    <a href="deseos.html" class="menu-item"><i class="fas fa-heart"></i> Wishlist</a>
                    <a href="eventos.html" class="menu-item"><i class="fas fa-calendar-alt"></i> Eventos</a>
                    <a href="inversiones.html" class="menu-item"><i class="fas fa-chart-line"></i> Mis Inversiones</a>

                    <div class="theme-menu-container-mobile" style="display: none;">
                        <div class="menu-item"><i class="fas fa-palette"></i> Temas</div>
                        <div class="theme-switcher-inline" style="padding: 0 20px 10px;">
                            <button class="theme-btn-small" data-theme="theme-light" title="Modo Claro"><i class="fas fa-sun"></i></button>
                            <button class="theme-btn-small" data-theme="theme-purple" title="Modo Morado"><i class="fas fa-magic"></i></button>
                            <button class="theme-btn-small" data-theme="theme-dark" title="Modo Oscuro"><i class="fas fa-moon"></i></button>
                        </div>
                    </div>

                    <a href="#" class="menu-item logout" id="menu-btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="authenticated-content" style="display: none; width: 100%;">
        <div class="widgets-main-container">
            <div class="widgets-nav-bar">
                <a href="admin.html" class="btn-back-clean">Volver al Panel</a>
            </div>

            <div class="widgets-buttons-wrapper">
                <button class="btn-widget-copy" onclick="copyWidgetSnippet('chatbot')">Chatbot</button>
                <button class="btn-widget-copy" onclick="copyWidgetSnippet('binders')">Binders</button>
                <button class="btn-widget-copy" onclick="copyWidgetSnippet('subastas')">Subastas</button>
                <button class="btn-widget-copy" onclick="copyWidgetSnippet('claims')">Claims</button>
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        window.widgetSnippets = {
            chatbot: '',
            binders: '',
            subastas: '',
            claims: ''
        };

        $(document).ready(async function() {
            initTheme();
            await checkSession();

            // Theme click listeners
            $(document).on('click', '.theme-btn-small[data-theme]', function() {
                const theme = $(this).data('theme');
                applyTheme(theme);
            });

            // Avatar dropdown toggle
            $(document).on('click', '#avatar-btn', function(e) {
                e.stopPropagation();
                $('#user-dropdown').toggleClass('active');
            });

            $(document).on('click', function(e) {
                if (!$(e.target).closest('.user-menu-container').length) {
                    $('#user-dropdown').removeClass('active');
                }
            });

            // Logout listener
            $('#menu-btn-logout').click(async function(e) {
                e.preventDefault();
                await _supabase.auth.signOut();
                localStorage.removeItem('tcg_session');
                window.location.href = 'index.html';
            });
        });

        async function checkSession() {
            if (typeof _supabase === 'undefined') return;
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'admin.html';
                return;
            }

            const uid = session.user.id;
            const { data: user } = await _supabase
                .from('usuarios')
                .select('id, username, store_name, store_logo, custom_domain, role')
                .eq('id', uid)
                .single();

            if (user) {
                $('#dropdown-user-name').text(user.username);
                if (user.store_logo && user.role !== 'starter') {
                    $('#dropdown-user-logo').attr('src', user.store_logo).show();
                } else {
                    $('#dropdown-user-logo').hide();
                }
                $('#top-panel, #authenticated-content').show();

                await buildUserSnippets(uid, user.custom_domain);
            } else {
                window.location.href = 'admin.html';
            }
        }

        async function buildUserSnippets(uid, customDomain) {
            let domainName = 'tudominio.com';

            let registeredDomains = [];
            const { data: registered } = await _supabase
                .from('widget_domains')
                .select('domain')
                .eq('user_id', uid);

            if (registered && registered.length > 0) {
                registeredDomains = registered.map(r => r.domain);
            }

            if (registeredDomains.length === 0 && customDomain) {
                registeredDomains.push(customDomain);
            }

            if (registeredDomains.length > 0) {
                const raw = registeredDomains[0];
                domainName = raw.toLowerCase().replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0].split(':')[0].trim();
            }

            window.widgetSnippets.chatbot = `<!-- VikingTCG Chatbot Widget -->\n<script src="https://vikingtcg.xyz/js/viking-widget.js" defer><\/script>\n<vikingdev-chatbot domain="${domainName}"></vikingdev-chatbot>`;
            window.widgetSnippets.binders = `<!-- VikingTCG Binder Widget -->\n<script src="https://vikingtcg.xyz/js/viking-widget.js" defer><\/script>\n<vikingdev-binder domain="${domainName}"></vikingdev-binder>`;
            window.widgetSnippets.subastas = `<!-- VikingTCG Auctions Widget -->\n<script src="https://vikingtcg.xyz/js/viking-widget.js" defer><\/script>\n<vikingdev-subastas domain="${domainName}"></vikingdev-subastas>`;
            window.widgetSnippets.claims = `<!-- VikingTCG Claims Widget -->\n<script src="https://vikingtcg.xyz/js/viking-widget.js" defer><\/script>\n<vikingdev-claims domain="${domainName}"></vikingdev-claims>`;
        }

        window.copyWidgetSnippet = function(type) {
            const code = window.widgetSnippets[type] || '';
            if (!code) return;

            navigator.clipboard.writeText(code).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Código copiado al portapapeles',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 1500
                });
            });
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('tcg_theme') || 'theme-dark';
            applyTheme(savedTheme);
        }

        function applyTheme(theme) {
            $('body').removeClass('theme-light theme-medium theme-dark theme-purple').addClass(theme);
            localStorage.setItem('tcg_theme', theme);
            $('.theme-btn-small').removeClass('active');
            $(`.theme-btn-small[data-theme="${theme}"]`).addClass('active');
        }
    </script>
    <script src="js/michatbot.js"></script>
</body>
</html>
