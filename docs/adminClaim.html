<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://vikingtcg.xyz/favi.png">
    <title>Gestión de Ganadores Claim - Vikingdev TCG</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/claim.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        .winner-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--nm-shadow);
            transition: transform 0.3s ease;
        }
        .winner-group:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }
        .winner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .winner-name {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-color);
        }
        .claimed-items-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .claimed-item-mini {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .claimed-item-mini img {
            width: 50px;
            height: 70px;
            object-fit: contain;
            border-radius: 4px;
        }
        .claimed-item-info {
            flex: 1;
        }
        .claimed-item-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .claimed-item-price {
            font-size: 0.8rem;
            color: var(--primary-color);
            font-weight: 800;
        }
        .contact-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .contact-buttons .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            font-weight: 800;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-wa { background: #25d366 !important; color: white !important; border: none !important; }
        .btn-ms { background: #006aff !important; color: white !important; border: none !important; }

        .btn-delete-group {
            background: #ff4757 !important;
            border: none !important;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white !important;
            cursor: pointer;
        }
        .btn-delete-group:hover {
            transform: scale(1.1) rotate(5deg);
            background: #ff6b81 !important;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
        }
        .claimed-item-mini {
            transition: all 0.3s ease;
        }
        .claimed-item-mini:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <!-- Floating User Panel -->
    <div class="top-left-panel" id="top-panel">
        <div class="pill-panel">
            <div class="pill-group" id="header-theme-group">
                <button class="pill-icon theme-btn-small" data-theme="theme-light" title="Modo Claro"><i class="fas fa-sun"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-purple" title="Modo Morado"><i class="fas fa-magic"></i></button>
                <button class="pill-icon theme-btn-small" data-theme="theme-dark" title="Modo Oscuro"><i class="fas fa-moon"></i></button>
            </div>

            <a href="admin.html" class="pill-icon" title="Volver al Panel"><i class="fas fa-arrow-left"></i></a>

            <div class="user-menu-container">
                <button class="pill-icon" id="avatar-btn" title="Usuario">
                    <i class="fas fa-user"></i>
                </button>
                <div class="user-dropdown-menu" id="user-dropdown">
                    <div class="user-dropdown-info">
                        <img id="dropdown-user-logo" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: none;">
                        <div class="user-dropdown-name" id="dropdown-user-name">Usuario</div>
                        <div class="user-dropdown-role" id="dropdown-user-role" style="display: none;">Admin</div>
                    </div>
                    <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> Mi Panel</a>
                    <a href="index.html" class="menu-item"><i class="fas fa-globe"></i> Ver Web Pública</a>
                    <a href="#" class="menu-item logout" id="menu-btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>

    <div id="authenticated-content" style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 100px 20px;">
        <div class="admin-header">
            <h1 style="font-size: 2.2rem; font-weight: 900;">GESTIÓN DE CLAIMS</h1>
        </div>

        <div class="sticky-tabs-container" id="admin-winner-tabs" style="margin-bottom: 30px; display: flex; justify-content: center; gap: 15px;">
            <button class="modal-tab-btn active" id="btn-tab-mis-claims" style="flex: 0 1 250px;">Mis Claims (Ventas)</button>
            <button class="modal-tab-btn" id="btn-tab-ganados" style="flex: 0 1 250px;">Claims Ganados (Compras)</button>
        </div>

        <div id="my-claims-view" class="winner-container">
            <!-- Filters removed as requested -->
            <div id="my-claims-list"></div>
        </div>

        <div id="won-claims-view" class="winner-container" style="display: none;">
            <div id="won-claims-list"></div>
        </div>
    </div>

    <!-- Floating Companion Wrapper -->
    <div id="companion-wrapper">
        <div class="companion-drag-handle" id="companion-drag-handle">
            <i class="fas fa-arrows-alt"></i>
        </div>
        <div class="companion-bubble" id="companion-bubble"></div>
        <div id="floating-companion-container"></div>

        <div class="companion-menu-popup" id="companion-menu">
            <div class="companion-menu-item" id="menu-item-chat">
                <i class="fas fa-comment-dots"></i> Chatear
            </div>
            <div class="companion-menu-item" id="menu-item-play">
                <i class="fas fa-gamepad"></i> Jugar
            </div>
            <div class="companion-menu-item" id="menu-item-details">
                <i class="fas fa-search-plus"></i> Ver Detalle
            </div>
        </div>
    </div>

    <!-- Chatbot Container -->
    <div id="chatbot-container">
        <div class="chatbot-header">
            <h3><i class="fas fa-robot"></i> Vikingdev Assistant</h3>
            <span id="close-chatbot" style="cursor:pointer; font-size: 1.5rem;">&times;</span>
        </div>
        <div class="chatbot-messages" id="chat-messages">
            <div class="chat-msg msg-bot">¡Hola! Soy tu asistente. ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div class="chatbot-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="Escribe tu duda...">
                <button id="send-chat" class="btn btn-sm"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <div class="bottom-nav">
        <div class="nav-item" id="btn-nav-home" title="Ir al Panel">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item" id="btn-nav-return" title="Volver">
            <i class="fas fa-chevron-left"></i>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/migltf.js"></script>
    <script src="js/companion-bot.js"></script>
    <script src="js/adminClaim.js"></script>
</body>
</html>
