<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vikingdev TCG</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafrex/spa-github-pages
        // This script takes the current url and converts the path into a query parameter,
        // then redirects the browser to the new url with the query parameter and
        // hash fragment.
        var pathSegmentsToKeep = 0;

        var l = window.location;
        var path = l.pathname.split('/').filter(Boolean);

        // If there's at least one path segment, it's likely a store/user identifier
        if (path.length > pathSegmentsToKeep) {
            var identifier = path[path.length - 1];
            // Redirect to public.html with the identifier as 'id'
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 * -1).join('/') + '/public.html?id=' +
                identifier + (l.search ? '&' + l.search.slice(1) : '') + l.hash
            );
        } else {
            // Fallback to index if no path
            l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/index.html');
        }
    </script>
</head>
<body>
</body>
</html>
